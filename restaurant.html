<style>
/* ===== Splash launch screen ===== */
#splash{position:fixed;inset:0;z-index:10000;background:linear-gradient(160deg,#FFF9F2 0%,#FFEDDD 55%,#FFE3CB 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease;overflow:hidden}
#splash.out{opacity:0;pointer-events:none}
.sp-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:spDrift 5s ease-in-out infinite alternate}
.sp-blob.b1{width:340px;height:340px;background:#FFD9B8;top:-90px;right:-90px}
.sp-blob.b2{width:300px;height:300px;background:#FFE9D2;bottom:-80px;left:-80px;animation-delay:-2.5s;animation-direction:alternate-reverse}
@keyframes spDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,20px) scale(1.08)}}
.sp-icon{width:118px;height:118px;border-radius:32px;background:linear-gradient(140deg,#F08A3C,#D95F16);display:flex;align-items:center;justify-content:center;font-size:58px;box-shadow:0 18px 44px rgba(217,95,22,.38);position:relative;z-index:2;opacity:0;transform:scale(.4);animation:spPop .7s cubic-bezier(.34,1.56,.64,1) .25s forwards}
@keyframes spPop{to{opacity:1;transform:scale(1)}}
.sp-word{margin-top:26px;font-size:38px;font-weight:800;color:#20242b;letter-spacing:-.5px;z-index:2;display:flex}
.sp-word span{opacity:0;transform:translateY(26px);display:inline-block;animation:spRise .55s cubic-bezier(.22,1,.36,1) forwards}
.sp-word span.dot{color:#E8722A}
@keyframes spRise{to{opacity:1;transform:none}}
.sp-tag{margin-top:10px;font-size:13px;color:#8a7a68;letter-spacing:2.5px;text-transform:uppercase;z-index:2;opacity:0;animation:spFade .8s ease 1.5s forwards}
@keyframes spFade{to{opacity:1}}
.sp-load{position:absolute;bottom:84px;width:150px;height:5px;border-radius:4px;background:rgba(232,114,42,.16);z-index:2;overflow:hidden;opacity:0;animation:spFade .5s ease 1.7s forwards}
.sp-load i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#F08A3C,#E8722A);animation:spSlide 1.1s ease-in-out infinite}
@keyframes spSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
.sp-hills{position:absolute;bottom:-2px;left:0;width:100%;height:120px;z-index:1;opacity:0;animation:spFade 1s ease .9s forwards}
@media (prefers-color-scheme:dark){#splash{background:linear-gradient(160deg,#211912,#2A1F13)}.sp-word{color:#F5EDE2}.sp-tag{color:#A89880}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important}}

:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#1E2B25; --muted:#66746C; --line:#DDE3DB; --soft:#EAF1EC;
  --green:#1F6F4A; --green-dark:#175539; --marigold:#F2A900; --danger:#B3261E; --blue:#2A6F97;
  --s-placed:#B7791F; --s-accepted:#2A6F97; --s-preparing:#C4571A; --s-ready:#0F766E;
  --s-rider_assigned:#6B4FA0; --s-picked_up:#6B4FA0; --s-delivered:#1F6F4A; --s-cancelled:#B3261E; --s-rejected:#B3261E;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#111A16; --surface:#1A2620; --ink:#E7EFE9; --muted:#93A59A; --line:#2B3A32; --soft:#1F3129; --green:#3FA774; --green-dark:#2F8F60; --danger:#F08A82; --blue:#6FB3DA; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang=ur] body{font-family:"Noto Naskh Arabic","Bricolage Grotesque",system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}

.shopecap{display:block;font-size:10.5px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;opacity:.75;margin-bottom:1px}
.custavatar{width:40px;height:40px;border-radius:50%;background:linear-gradient(135deg,var(--brand-2),var(--brand));color:#fff;display:grid;place-items:center;font-weight:900;font-size:16px;flex:none}
.custrow{display:flex;align-items:center;gap:10px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.card.new{border:2px solid var(--marigold)!important;box-shadow:0 8px 24px rgba(242,169,0,.18)}
@keyframes newOrderPulse{0%,100%{box-shadow:0 0 0 0 rgba(242,169,0,.4)}50%{box-shadow:0 0 0 10px rgba(242,169,0,0)}}
.card.new{animation:newOrderPulse 2s ease-in-out infinite}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:14px}
.openbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 12px;font-weight:800;cursor:pointer;color:#fff;background:var(--muted);flex:none}
.openbtn.on{background:var(--brand)}
.openbtn i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.6}
.openbtn.on i{opacity:1}
main{padding:14px 16px 120px}
h1{font-size:24px;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:18px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.count{background:var(--marigold);color:#1E2B25;font-size:13px;font-weight:800;border-radius:999px;padding:1px 9px}
.muted{color:var(--muted)}
.red{color:var(--danger)}
.bkc{display:block;background:var(--surface,#fff);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 10px}.bkc .ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:4px}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.btn{display:block;width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:15px 16px;font-weight:700;cursor:pointer;text-align:center;font-size:17px;text-decoration:none}
.btn:active{background:var(--brand-dark)}
.btn.ghost{background:transparent;color:var(--brand);border:2px solid var(--brand)}
.btn.warn{background:transparent;color:var(--danger);border:2px solid var(--danger)}
.btn.small{padding:10px 14px;font-size:15px;width:auto;display:inline-block}
.btn[disabled]{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:14px 0 5px;font-weight:600;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.grp{margin:18px 0}
.grp-h{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:1px;margin:0 4px 8px}
.setlist .row{padding:9px 2px}
.row.danger .row-title{color:#C0392B}
.row.danger .row-sub{color:#C0392B;opacity:.7}
.card.new{border:2px solid var(--marigold);box-shadow:0 0 0 4px rgba(242,169,0,.18)}
.card.late{border:2px solid var(--danger)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.oid{font-weight:800;font-size:18px}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff;background:var(--muted);white-space:nowrap}
.pill.y{background:#B7791F} .pill.g{background:var(--brand)} .pill.r{background:var(--danger)}
.line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:18px}
.items{font-size:17px;margin:8px 0}
.items div{padding:3px 0}
.items b{display:inline-block;min-width:34px;color:var(--brand)}
.cust{margin:6px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
.countdown{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700}
.countdown.late{background:rgba(179,38,30,.12);color:var(--danger)}
.order-wait{background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700;font-size:14px}
.actions{display:grid;gap:10px;margin-top:12px}
.note{background:rgba(242,169,0,.14);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.soundbar{background:var(--marigold);color:#1E2B25;border:0;width:100%;border-radius:12px;padding:12px;font-weight:800;margin-bottom:12px;cursor:pointer}
.closedbar{background:var(--surface);border:2px solid var(--danger);color:var(--danger);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:680px;margin:0 auto}
.nav button{position:relative;flex:1;background:none;border:0;padding:14px 4px 12px;font-weight:700;font-size:14px;color:var(--muted);border-top:3px solid transparent;cursor:pointer}
.nav button.on{color:var(--brand);border-top-color:var(--marigold)}
.nav .dot{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 4px;margin-inline-start:4px;vertical-align:2px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:inherit}
.row-main{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:start;padding:0;color:inherit}
.thumb{width:54px;height:54px;border-radius:12px;background:var(--line);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.switch{position:relative;display:block;width:50px;height:28px;flex:none;margin:0 auto 3px}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + span{background:var(--brand)}
.switch input:checked + span::after{transform:translateX(22px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:8px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.cat{display:flex;justify-content:space-between;align-items:center;margin:20px 0 4px}
.shophead{display:flex;align-items:center;gap:10px;margin:6px 0 2px;font-size:17px}
.prodstats{display:flex;gap:16px;margin:0 0 8px;font-size:14px;color:var(--muted)}
.prodstats b{color:var(--ink)}
.btngroup{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:8px;padding:8px;border:1px solid var(--line);border-radius:12px}
.btngroup-t{font-size:12px;font-weight:700;color:var(--muted);text-transform:uppercase;flex:0 0 100%;margin-bottom:2px}
.cat h3{margin:0;font-size:18px}
.strike{text-decoration:line-through;color:var(--muted);font-size:13px;margin-inline-start:6px}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.alert{border-top:6px solid var(--marigold)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h3{margin:0;font-size:20px}
.x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.preview{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.check input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;z-index:60;max-width:90%;font-weight:600;text-align:center}
.toast.err{background:var(--danger);color:#fff}
.auth{max-width:400px;margin:0 auto;padding:9vh 20px 30px}
.auth .brand{font-size:40px;white-space:normal}
.auth .brand b{color:var(--marigold)}
.kindgrid{display:grid;gap:12px;margin-top:6px}
.kindcard{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:16px;cursor:pointer;font:inherit;color:inherit;width:100%}
.kindcard:active{transform:scale(.98)}
.kindcard .kemoji{font-size:40px}
.kindcard b{font-size:18px;display:block;margin-bottom:4px}
.kindcard small{color:var(--muted);font-size:13px;line-height:1.5}
.err-text{color:var(--danger);margin-top:12px;min-height:22px;font-weight:600}
.link{background:none;border:0;color:var(--brand);text-decoration:underline;cursor:pointer;padding:12px 0;font-weight:600}
.linkbtn{background:none;border:0;color:var(--brand);padding:6px 4px;cursor:pointer;text-decoration:underline;font-weight:600;font:inherit}
.schedbox{background:var(--marigold);color:#1E2B25;border-radius:12px;padding:10px 12px;font-weight:800;margin:8px 0;display:flex;justify-content:space-between;gap:8px}
.ver{font-size:12px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.tile b{display:block;font-size:22px}
.tile span{color:var(--muted);font-size:13px}
.tile.hi{background:var(--brand);border-color:var(--brand);color:#fff}
.tile.hi span{color:rgba(255,255,255,.85)}
.stars{color:var(--marigold);letter-spacing:1px}
.review{padding:10px 0;border-bottom:1px solid var(--line)}
.issuebox{background:rgba(179,38,30,.1);border:1px solid var(--danger);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.card.back{border:2px solid var(--danger)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
/* ===== Dera design system v2 (shared by all apps) ===== */
:root{
  --paper:#F2F5F1; --surface:#FFFFFF; --ink:#13201A; --muted:#64736A; --line:#E2E8E1; --soft:#E8F3EC; --field:#F3F6F2;
  --green:#0E7A4D; --green-dark:#0A5E3B; --green-2:#17A56B; --marigold:#FFB302; --danger:#D63B2F; --deal:#E2472F;
  --r-sm:12px; --r:16px; --r-lg:22px;
  --sh-1:0 1px 2px rgba(19,40,28,.06),0 1px 1px rgba(19,40,28,.03);
  --sh-2:0 8px 22px rgba(19,40,28,.08),0 2px 6px rgba(19,40,28,.05);
  --sh-3:0 18px 44px rgba(19,40,28,.20),0 4px 12px rgba(19,40,28,.08);
  --grad:linear-gradient(135deg,#F08A3C 0%,#E8722A 55%,#D95F16 100%);
  --grad-gold:linear-gradient(135deg,#FFC23A,#FFA400);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0C1511; --surface:#16211B; --ink:#E8F0EA; --muted:#93A59A; --line:#243229; --soft:#18291F; --field:#1C2922;
    --green:#34B27A; --green-dark:#23915F; --green-2:#46C489; --danger:#FF8A7E; --deal:#FF8A70;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 22px rgba(0,0,0,.35); --sh-3:0 18px 44px rgba(0,0,0,.55);
    --grad:linear-gradient(135deg,#7A3F14 0%,#96541C 60%,#B0621F 100%); }
}
body{background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(232,114,42,.25)}
h1{font-weight:800;letter-spacing:-.025em}
h2{font-weight:800;letter-spacing:-.015em}
h3{font-weight:800}
/* Buttons */
.btn{background:var(--grad);border-radius:14px;box-shadow:0 6px 16px rgba(198,94,27,.25);transition:transform .12s var(--ease),box-shadow .2s,filter .2s;letter-spacing:.005em}
.btn:active{transform:scale(.98);filter:brightness(.95);background:var(--grad)}
.btn.ghost{background:var(--soft);color:var(--brand);border:1.5px solid transparent;box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.warn{background:rgba(214,59,47,.08);color:var(--danger);border:1.5px solid transparent;box-shadow:none}
.btn.gold{background:var(--grad-gold);color:#241a00;box-shadow:0 6px 16px rgba(255,170,0,.28)}
.btn[disabled]{opacity:.45;box-shadow:none;filter:grayscale(.3)}
/* Fields */
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s,background .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px rgba(232,114,42,.15)}
label.f{color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.01em}
/* Surfaces */
.card,.box{border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);background:var(--surface)}
.pill{border-radius:999px;font-weight:700;letter-spacing:.01em}
.muted{color:var(--muted)}
.empty{color:var(--muted)}
/* Sheets and popups */
.sheet-back{background:rgba(8,20,14,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:wmFade .2s ease both}
.sheet{border-radius:28px 28px 0 0;box-shadow:var(--sh-3);animation:wmUp .32s var(--ease) both;position:relative;padding-top:22px!important}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:9px;background:var(--line)}
.sheet-head h3{font-size:20px;letter-spacing:-.01em}
.x{border-radius:50%!important;background:var(--field)!important;width:36px;height:36px;display:grid;place-items:center;border:0!important}
.toast{border-radius:16px!important;box-shadow:var(--sh-3)!important;font-weight:700;animation:wmToast .35s var(--ease) both;backdrop-filter:blur(6px)}
@keyframes wmFade{from{opacity:0}to{opacity:1}}
@keyframes wmUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes wmToast{from{transform:translate(-50%,16px) scale(.96);opacity:0}}
@keyframes wmPop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
/* Loading skeleton */
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--field) 37%,var(--line) 63%);background-size:400% 100%;animation:wmShim 1.3s ease infinite;border-radius:14px}
@keyframes wmShim{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* Switch */
.switch span{transition:background .2s}
/* Scrollbars */
*::-webkit-scrollbar{height:0;width:6px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Floating bottom navigation */
.nav{left:50%!important;right:auto!important;transform:translateX(-50%);width:min(calc(100% - 20px),680px);bottom:calc(10px + env(safe-area-inset-bottom,0px))!important;
  border:1px solid var(--line)!important;border-radius:24px;box-shadow:var(--sh-3);padding:4px!important;
  background:rgba(255,255,255,.9);backdrop-filter:saturate(1.4) blur(16px);-webkit-backdrop-filter:saturate(1.4) blur(16px)}
@media (prefers-color-scheme: dark){ .nav{background:rgba(22,33,27,.9)} }
.nav a,.nav button{border-top:0!important;border-radius:18px;transition:background .2s,color .2s}
.nav a.on,.nav button.on{background:var(--soft);color:var(--brand)!important}
main{padding-bottom:140px!important}
/* ===== Rider / Shop / Admin look ===== */
.top,.topbar{background:var(--grad)!important;color:#fff;border-bottom:0!important;border-radius:0 0 22px 22px;box-shadow:0 10px 26px rgba(11,107,68,.22);padding:14px 16px!important}
.top .brand,.topbar .brand{color:#fff;font-size:19px;line-height:1.15}
.tiles{row-gap:10px}
.top .brand small,.topbar .ver{color:rgba(255,255,255,.8)!important}
.top .pillbtn,.topbar .linkbtn{color:#fff!important;border:0;background:rgba(255,255,255,.16);border-radius:999px;padding:7px 12px;text-decoration:none}
.top .cbtn,.topbar .cbtn{background:rgba(255,255,255,.95)!important}
.duty,.openbtn{background:rgba(255,255,255,.18)!important;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.35)}
.duty.on,.openbtn.on{background:#fff!important;color:var(--brand)!important;box-shadow:0 6px 16px rgba(0,0,0,.18)}
.duty.on i,.openbtn.on i{background:var(--brand-2)!important;opacity:1!important;box-shadow:0 0 0 4px rgba(232,114,42,.25)!important}
main{padding-top:16px}
h1{font-size:26px}
h2{font-size:18px}
.card{border-radius:22px;padding:16px;box-shadow:var(--sh-2);border:1px solid var(--line)}
.card.new{border:2px solid var(--marigold)!important;box-shadow:0 0 0 5px rgba(255,179,2,.18),var(--sh-2)!important;animation:wmPop .35s var(--ease) both}
.card.late{border:2px solid var(--danger)!important;box-shadow:0 0 0 5px rgba(214,59,47,.12),var(--sh-2)!important}
.tiles{gap:10px}
.tile{border:0!important;border-radius:20px;box-shadow:var(--sh-1);padding:14px}
.tile b{font-size:24px;letter-spacing:-.02em}
.tile span{color:var(--muted);font-weight:600;font-size:13px}
.tile.hi{background:var(--grad)!important;box-shadow:0 10px 24px rgba(198,94,27,.28)}
.tile.hi span{color:rgba(255,255,255,.85)!important}
.pill{padding:3px 10px}
.cash{background:linear-gradient(135deg,rgba(255,179,2,.18),rgba(255,179,2,.08));border-radius:16px;padding:14px}
.cash b{font-size:20px}
.note{border-radius:14px}
.soundbar{background:var(--grad-gold);border-radius:16px;box-shadow:0 8px 18px rgba(255,170,0,.28)}
.warnbox,.closedbar{border-radius:16px;background:rgba(214,59,47,.06)!important;border:1.5px solid rgba(214,59,47,.5)!important}
.countdown{border-radius:14px;background:var(--soft)}
.row{padding:13px 4px}
.list{border-top:0;background:var(--surface);border-radius:20px;box-shadow:var(--sh-1);padding:0 12px;border:1px solid var(--line)}
.list .row:last-child{border-bottom:0}
.chip{border-radius:999px;border:0!important;background:var(--surface);box-shadow:var(--sh-1);font-weight:700}
.chip.on{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}
.alert{border-radius:16px;box-shadow:var(--sh-1)}
.chart{border:0;border-radius:20px;box-shadow:var(--sh-1)}
.chart .c i{background:var(--grad);border-radius:6px 6px 2px 2px}
.over{background:rgba(8,20,14,.5);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:wmFade .2s ease both}
.over .panel{border-radius:28px 28px 0 0;box-shadow:var(--sh-3);animation:wmUp .32s var(--ease) both}
.newjob .panel{border-top:0!important;box-shadow:0 -6px 0 var(--marigold),var(--sh-3)}
.newjob .big{font-size:40px!important;letter-spacing:-.03em}
.timer{border-radius:9px;overflow:hidden}
.slide{border-radius:18px;background:var(--grad);box-shadow:0 8px 20px rgba(198,94,27,.3)}
.slide .knob{border-radius:14px}
.step .n{box-shadow:0 0 0 4px var(--soft)}
.bar{border-radius:9px;background:var(--field)}
.bar i{background:var(--grad);border-radius:9px}
.face{box-shadow:0 0 0 4px var(--soft)}
.auth,.login{padding-top:30px}
.kv{padding:9px 0}
.selfie{border-radius:18px;box-shadow:var(--sh-1)}
.review{border-radius:16px}





.sec{background:var(--surface);border:1px solid var(--line);border-radius:16px;margin:10px 0;overflow:hidden}
.sec.off{opacity:.65}
.sechead{display:flex;align-items:center;gap:10px;padding:13px 12px;cursor:pointer;user-select:none}
.sechead b{display:block;font-size:16px}
.sechead small{display:block;font-size:12.5px}
.sec .chev{font-size:22px;color:var(--muted);transition:transform .2s;width:14px;text-align:center;flex:none}
.sec.open .chev{transform:rotate(90deg);color:var(--brand)}
html[dir=rtl] .sec .chev{transform:scaleX(-1)} html[dir=rtl] .sec.open .chev{transform:rotate(90deg)}
.sec.open .sechead{border-bottom:1px solid var(--line)}
.secbody{padding:4px 12px 12px}
  .secrow{display:flex;align-items:center;gap:12px;margin:18px 0 6px}
.secoff{opacity:.5}
#rqWait .rqsteps{margin-top:12px;display:grid;gap:10px}
.rqsteps div{display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.rqsteps i{flex:none;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px;background:var(--field);color:var(--muted)}
.rqsteps .done{color:var(--ink)} .rqsteps .done i{background:var(--brand);color:#fff}
.rqsteps .now{color:var(--ink);font-weight:700} .rqsteps .now i{background:var(--marigold,#FFB400);color:#2A1D00}
.rqsteps small{display:block;font-weight:500;color:var(--muted);font-size:12px}
#rqCats .chip{text-align:start;white-space:normal;line-height:1.25;padding:9px 10px;font-size:13.5px}

/* timings, payout, photos, stock, whatsapp */
.hrsed{display:grid;gap:8px}
.hday{border:1px solid var(--line);border-radius:14px;padding:10px 12px;background:var(--surface)}
.hday.off .htimes{opacity:.35;pointer-events:none}
.hhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.hsw{display:flex;align-items:center;gap:8px;margin:0;cursor:pointer}
.hst{font-size:13px;color:var(--muted);font-weight:600}
.htimes{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;margin-top:8px}
.htimes input{min-width:0;margin:0}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:8px}
.pgrid:empty{display:none}
.pth{position:relative;aspect-ratio:1/1;border-radius:12px;overflow:hidden;border:1px solid var(--line);touch-action:none;cursor:grab}.pth.dragging{z-index:6;box-shadow:0 12px 26px rgba(0,0,0,.28);border-color:#F85606;cursor:grabbing}
.pth img{width:100%;height:100%;object-fit:cover;display:block}
.pth button{position:absolute;top:4px;inset-inline-end:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:16px;line-height:1;cursor:pointer}
.filebtn{display:block;margin-top:8px;border:1.5px dashed var(--line);border-radius:12px;padding:12px;text-align:center;font-weight:700;cursor:pointer;color:var(--muted)}
.wa{display:inline-block;margin-inline-start:6px;background:#25D366;color:#fff!important;border-radius:8px;padding:2px 10px;font-size:13px;font-weight:700;text-decoration:none}
.paidtag{margin:8px 0 0;background:rgba(232,114,42,.1);color:var(--brand);border-radius:10px;padding:8px 10px;font-weight:700;font-size:14px}

/* bulk products + photo mode */
.bkmap{padding:6px 0}
.bkmap-title{font-size:17px;font-weight:800;margin-bottom:6px}
.bkmap-field{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.bkmap-field label{flex:0 0 140px;font-weight:700;font-size:14px}
.bkmap-field select{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);font-size:14px;font-family:inherit;background:var(--field)}
.bkmap-sample{margin:10px 0;padding:8px;background:var(--field);border-radius:10px;font-size:12px}
.bkmap-row{display:flex;gap:6px;padding:3px 0;border-bottom:1px solid var(--line)}
.bkmap-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:#fff;padding:2px 6px;border-radius:6px}
.bk small{display:block;color:var(--muted);font-size:13px;line-height:1.45;margin-top:2px}
.bkst{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.bkst>div{flex:1;min-width:0}
.bkn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-size:15px}
.bkbtn{display:flex!important;width:100%;margin-top:10px;justify-content:center;align-items:center;cursor:pointer}
.bkfile{display:flex;align-items:center;justify-content:center;margin-top:10px;border:1.5px dashed var(--brand);border-radius:12px;padding:12px;text-align:center;font-weight:700;cursor:pointer;color:var(--brand);min-height:48px;overflow-wrap:anywhere}
.bksum{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 8px}
.bksum span{background:var(--field,#F1F4F0);border-radius:999px;padding:6px 10px;font-size:13px}
.bksum span.e{background:rgba(210,59,46,.12);color:var(--danger,#D23B2E)}
.bklist{border:1px solid var(--line);border-radius:14px;max-height:46vh;overflow:auto}
.bkrow{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line)}
.bkrow:last-child{border-bottom:0}
.bkrow.bad{background:rgba(210,59,46,.06)}
.bkrow>div{min-width:0}
.bkrow b{display:block;overflow-wrap:anywhere}
.bkrow small.e{color:var(--danger,#D23B2E);font-weight:700}
.bkrow small.w{color:#9A5B00}
.bki{flex:none}
.bkerr{margin-top:12px;background:rgba(210,59,46,.1);color:var(--danger,#D23B2E);border-radius:12px;padding:12px;font-weight:600;font-size:14px;line-height:1.5}
.bkdone{margin-top:12px;background:rgba(232,114,42,.1);color:var(--brand);border-radius:12px;padding:14px;font-weight:800}
.bkprog{margin-top:14px;font-weight:700}
.bkprog i,.pmbar{display:block;height:10px;border-radius:6px;background:var(--field,#F1F4F0);overflow:hidden;margin-top:8px}
.bkprog i b,.pmbar b{display:block;height:100%;background:var(--brand);transition:width .3s}
.pm{text-align:center}
.pmname{font-size:22px;font-weight:800;margin-top:14px;overflow-wrap:anywhere}

/* timings v2 + many shops */
.htimes select,.hbrk select{min-width:0;margin:0;padding:10px 8px;font-size:15px}
.h24{margin-top:6px;font-size:13px;font-weight:700;color:var(--brand)}
.hbrk{display:grid;grid-template-columns:auto 1fr auto 1fr auto;gap:6px;align-items:center;margin-top:8px;font-size:13px;color:var(--muted)}
.hbrk .hx{border:0;background:var(--field,#F1F4F0);width:32px;height:32px;border-radius:50%;font-size:18px;cursor:pointer;color:var(--ink)}
.hbtns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.hadd{border:1px dashed var(--line);background:none;border-radius:999px;padding:6px 12px;font:inherit;font-size:13px;font-weight:700;color:var(--brand);cursor:pointer}
.shopsw{background:none;border:0;padding:0;text-align:start;cursor:pointer;font:inherit;position:relative;max-width:62vw}
.sbadge{display:inline-block;margin-inline-start:6px;background:var(--danger,#D23B2E);color:#fff;border-radius:999px;font-size:12px;padding:1px 7px;vertical-align:middle}
.shoprow{display:flex;align-items:center;gap:12px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer;font:inherit;color:var(--ink);text-align:start}
.shoprow.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(232,114,42,.12)}
.shoprow .thumb{width:44px;height:44px;border-radius:12px;overflow:hidden;flex:none}
.shoprow .thumb img{width:100%;height:100%;object-fit:cover}
.shoprow .nm{flex:1;min-width:0}.shoprow .nm small{display:block;color:var(--muted);font-size:13px}
.otheralert{position:fixed;left:12px;right:12px;top:76px;z-index:9500;background:#B4161B;color:#fff;border-radius:16px;padding:12px 12px 12px 16px;display:flex;align-items:center;gap:10px;font-weight:800;box-shadow:0 12px 30px rgba(0,0,0,.3);animation:oa 1s ease-in-out infinite alternate}
.otheralert span{flex:1}
.otheralert button{border:0;background:#fff;color:#B4161B;border-radius:10px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
.otheralert button.x{background:transparent;color:#fff;padding:4px 8px;font-size:20px}
@keyframes oa{to{background:#D23B2E}}

/* busy, pickup */
.busybtn{display:block;width:100%;margin:0 0 10px;border:1.5px dashed var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px;font:inherit;font-weight:800;cursor:pointer}
.busybar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:rgba(232,160,40,.16);border:1px solid rgba(232,160,40,.5);border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:800}
.busybar .btn{width:auto;flex:none}
.picktag{margin:6px 0;background:#E8F0FE;color:#1A4FB0;border-radius:10px;padding:8px 10px;font-weight:800;font-size:14px}
.pickcode{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:8px 0;background:linear-gradient(135deg,#0B3A2B,#14532D);color:#fff;border-radius:14px;padding:12px 14px}
.cxrow{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px dashed var(--line)}
.cxrow:last-child{border-bottom:none}
.cxname{flex:1;min-width:0}
.cxbtn{flex:none;border:1.5px solid var(--danger);color:var(--danger);background:#FFF5F5;font-weight:700;font-size:12.5px;border-radius:99px;padding:4px 10px;cursor:pointer}
.cxstrip{display:flex;align-items:center;gap:10px;margin:4px 0 6px;background:#FFF7EC;border:1.5px solid #F0DDBE;border-radius:11px;padding:5px 11px;font-size:13.5px}
.cxstep{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--brand,#E8730C);color:var(--brand,#E8730C);background:#fff;font-weight:800;font-size:15px;line-height:1;cursor:pointer;flex:none}
.cxstep.off{border-color:#C9C0AA;color:#B4AC97}
.pickcode b{display:block;font-size:14px}
.pickcode small{opacity:.8;font-size:12px}
.pickcode .code{font-size:28px;font-weight:900;letter-spacing:4px;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:10px;font-variant-numeric:tabular-nums}
/* ===== Dera design system v3 ===== */
:root{
  --paper:#F3F5F2; --surface:#FFFFFF; --ink:#12201A; --muted:#5E6D65; --line:#E1E6E1; --soft:#E5F1EA; --field:#F1F4F0;
  --green:#0B7D4F; --green-dark:#086640; --green-2:#14A064; --forest:#0B3A2B; --marigold:#FFB400; --danger:#D23B2E; --blue:#2463B5; --deal:#E2472F;
  --brand:#E8722A; --brand-dark:#C65E1B; --brand-2:#F0923F; --brand-deep:#B34E14;
  --r-sm:12px; --r:16px; --r-lg:24px;
  --sh-1:0 1px 2px rgba(16,32,24,.05);
  --sh-2:0 8px 20px -10px rgba(16,32,24,.22),0 1px 2px rgba(16,32,24,.05);
  --sh-3:0 24px 50px -14px rgba(8,28,20,.38);
  --grad:var(--brand); --grad-gold:var(--marigold);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* truck-art band: the one decorative signature, used under the top bar */
  --band:linear-gradient(90deg,#FFB400,#E2472F,#F0923F);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0B1310; --surface:#141E19; --ink:#E6EEE8; --muted:#94A59B; --line:#24322B; --soft:#17291F; --field:#1A2620;
    --green:#2FB27A; --green-dark:#23915F; --green-2:#46C489; --forest:#0A241B; --danger:#FF8A7E; --blue:#7DB2F0; --deal:#FF8A70;
    --brand:#F08A3C; --brand-dark:#D9722A; --brand-2:#F5A968; --brand-deep:#7A3A12;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 20px -10px rgba(0,0,0,.6); --sh-3:0 24px 50px -14px rgba(0,0,0,.7); }
}
body{font-family:var(--body);font-size:15.5px;line-height:1.5;color:var(--ink);background:var(--paper);letter-spacing:.003em}
html[lang=ur] body{font-family:"Noto Naskh Arabic",var(--body);line-height:1.75;letter-spacing:0}
h1,h2,h3,.brand,.oid,.tile b,.big,.newjob .big,.attgrid b,.susp .big,.waitbox .clock{font-family:var(--display)}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3{font-family:"Noto Naskh Arabic",var(--display)}
h1{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 14px}
h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tile b,.kv span:last-child,.kv b:last-child,.line span:last-child,.row-side,.row .r,.cash b,.money{font-variant-numeric:tabular-nums}
::selection{background:rgba(255,180,0,.35)}
:focus-visible{outline:3px solid var(--marigold)!important;outline-offset:2px}
/* buttons: solid, no gradients */
.btn{background:var(--brand);color:#fff;border:0;border-radius:var(--r-sm);min-height:50px;padding:13px 16px;font-weight:700;font-size:16px;letter-spacing:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 14px -8px rgba(232,114,42,.8);transition:transform .12s var(--ease),background .15s}
.btn:active{background:var(--brand-dark);transform:scale(.985);filter:none}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.warn{background:#FCEDEB;color:var(--danger);border:0;box-shadow:none}
.btn.gold{background:var(--marigold);color:#2A1D00;box-shadow:0 6px 14px -8px rgba(200,140,0,.9)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;box-shadow:none}
@media (prefers-color-scheme: dark){ .btn.warn{background:rgba(255,138,126,.12)} .btn{color:#06140E} .btn.ghost{color:var(--brand)} .btn.warn{color:var(--danger)} }
/* fields */
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--brand)!important;box-shadow:0 0 0 4px rgba(232,114,42,.14)!important}
label.f{color:var(--ink);opacity:.72;font-weight:700;font-size:13px}
/* surfaces */
.card,.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1)}
.note{background:#FFF5D9;color:#4F3A00;border-radius:12px;border:0}
.warnbox,.closedbar{background:#FDEFED!important;border:1px solid rgba(210,59,46,.3)!important;color:var(--danger);border-radius:14px}
@media (prefers-color-scheme: dark){ .note{background:rgba(255,180,0,.12);color:#F2D58C} .warnbox,.closedbar{background:rgba(255,138,126,.08)!important} }
.empty{color:var(--muted);font-size:15px}
.toast{background:var(--ink)!important;color:var(--paper)!important;border-radius:14px!important;box-shadow:var(--sh-3)!important;font-weight:600;padding:12px 18px}
.toast.err{background:var(--danger)!important;color:#fff!important}
/* chips */
.chip,.chip2{background:var(--surface);border:1px solid var(--line)!important;box-shadow:none;font-weight:600;font-size:14px;color:var(--ink)}
.chip.on,.chip2.on{background:var(--ink)!important;border-color:var(--ink)!important;color:var(--paper)!important}
/* sheets */
.sheet-back,.over{background:rgba(6,18,12,.5)}
.sheet,.over .panel{border-radius:24px 24px 0 0}
.sheet-head h3{font-family:var(--display);font-size:20px;font-weight:800}
.x{background:var(--field)!important;color:var(--ink)!important;font-size:22px!important}
/* switch */
.switch input:checked + span{background:var(--brand)}

/* top bar: deep forest + truck-art band */
.top,.topbar{position:sticky;top:0;z-index:20;background:var(--brand-deep)!important;color:#fff;border-radius:0!important;box-shadow:none!important;border:0!important;padding:12px 16px 16px!important;min-height:64px}
.top::after,.topbar::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--band)}

<script>
// ================= THEME: LIGHT / DARK / AUTO (same code in all apps) =================
// The apps already have dark colours inside "@media (prefers-color-scheme: dark)". This switch turns
// those blocks always-on (Dark), always-off (Light) or back to following the phone (Auto).
const Theme = (() => {
  const KEY = 'kh_theme', DARK_Q = /prefers-color-scheme\s*:\s*dark/i, LIGHT_Q = /prefers-color-scheme\s*:\s*light/i;
  const known = new Map();   // rule -> its original media text (kept so the same rule object is found again)
  const get = () => { try { return localStorage.getItem(KEY) || 'light'; } catch (e) { return 'light'; } };
  function walk(rules, mode){
    for (const r of rules){
      if (r.media && r.cssRules){
        if (!known.has(r)) known.set(r, r.media.mediaText); const orig = known.get(r);
        const want = DARK_Q.test(orig) ? (mode === 'dark' ? 'all' : mode === 'light' ? 'not all' : orig)
                   : LIGHT_Q.test(orig) ? (mode === 'light' ? 'all' : mode === 'dark' ? 'not all' : orig) : null;
        if (want !== null && r.media.mediaText !== want){ try { r.media.mediaText = want; } catch (e) {} }
        if (r.cssRules) walk(r.cssRules, mode);
      }
    }
  }
  function apply(mode){
    mode = mode || get();
    for (const sh of document.styleSheets){ try { walk(sh.cssRules, mode); } catch (e) {} }
    const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    const m = document.querySelector('meta[name=theme-color]'); if (m){ if (!m.dataset.light) m.dataset.light = m.content; m.content = dark ? '#0E1A14' : m.dataset.light; }
  }
  function set(mode){ try { localStorage.setItem(KEY, mode); } catch (e) {} apply(mode); document.querySelectorAll('.themesw button').forEach(b => b.classList.toggle('on', b.dataset.m === mode)); }
  function picker(lang){
    const ur = lang === 'ur'; const cur = get();
    const L = ur ? { t:'ایپ کا رنگ', light:'☀️ روشن', dark:'🌙 گہرا', auto:'📱 فون جیسا' } : { t:'App theme', light:'☀️ Light', dark:'🌙 Dark', auto:'📱 Auto' };
    return `<div class="themebox"><b>${L.t}</b><div class="themesw">${['light', 'dark', 'auto'].map(m => `<button type="button" data-m="${m}" class="${cur === m ? 'on' : ''}" onclick="Theme.set('${m}')">${L[m]}</button>`).join('')}</div></div>`;
  }
  // new <style> tags (chat, dialogs) get the same treatment
  try { new MutationObserver(ms => { if (get() !== 'auto' && ms.some(m => [...m.addedNodes].some(n => n.tagName === 'STYLE'))) apply(); }).observe(document.head, { childList:true }); } catch (e) {}
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (get() === 'auto') apply('auto'); }); } catch (e) {}
  const st = document.createElement('style');
  st.textContent = `.themebox{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.themesw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--field,#F1F4F0);border-radius:12px;padding:4px}
.themesw button{border:0;background:transparent;color:var(--ink);border-radius:9px;padding:9px 4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.themesw button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15)}`;
  document.head.appendChild(st);
  apply();
  return { apply, set, get, picker };
})();

// uiConfirm / uiPrompt look like the app instead of the browser's grey "site says" box.
const UI = (() => {
  const ur = () => (document.documentElement.lang || '').startsWith('ur');
  const W = () => ur() ? { ok:'ٹھیک ہے', cancel:'واپس', yes:'جی ہاں', show:'پاس ورڈ دکھائیں', hide:'پاس ورڈ چھپائیں' } : { ok:'OK', cancel:'Cancel', yes:'Yes', show:'Show password', hide:'Hide password' };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const DANGER = /\b(delete|remove|block|reject|disconnect|log ?out|take back|stop|cancel this|forfeit|reset)\b|حذف|ختم|بلاک|منسوخ/i;
  let styled = false;

    const s = document.createElement('style');
    s.textContent = `.uidlg{position:fixed;inset:0;z-index:9800;background:rgba(6,18,12,.5);display:flex;align-items:center;justify-content:center;padding:20px;animation:uiF .15s ease both}

function openSheet(title, html, cls){
  closeSheet();
  const back = document.createElement('div'); back.className = 'sheet-back'; back.id = 'sheet';
  back.innerHTML = `<div class="sheet ${cls || ''}" role="dialog" aria-modal="true"><div class="sheet-head"><h3>${esc(title)}</h3><button class="x" aria-label="Close" onclick="closeSheet()">&times;</button></div>${html}</div>`;
  back.addEventListener('click', e => { if (e.target === back) closeSheet(); });
  document.body.appendChild(back);
}

let actx = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio);
const audioReady = () => !!actx && actx.state === 'running';
function beep(){
  if (state.sound && audioReady()){
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.18; o.connect(g); g.connect(actx.destination); o.start();
      setTimeout(() => { o.frequency.value = 1175; }, 160); setTimeout(() => { o.frequency.value = 880; }, 320); setTimeout(() => o.stop(), 520);
    } catch (e) {}
  }
  try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
}
const newOrders = () => state.orders.filter(o => o.status === 'placed');
let alertTimer = null;

let wakeLock = null;
async function keepAwake(){ try { if ('wakeLock' in navigator && !wakeLock){ wakeLock = await navigator.wakeLock.request('screen'); wakeLock.addEventListener('release', () => { wakeLock = null; }); } } catch (e) {} }

    if (tab === 'orders'){ await loadOrders(); if (!state.items) loadMenu().then(() => { if (state.tab === 'orders') renderTab(); }, () => {}); }

function renderTab(){

async function loadOrders(){
  if (state.restaurant && state.pastPageShopId !== state.restaurant.id){ resetPastOrders(); state.pastPageShopId = state.restaurant.id; }
  if (state.restaurant && isServices()){ try { const { data } = await sb.rpc('shop_bookings_v2', { p_shop:state.restaurant.id }); state.appts = data || []; } catch (e) { state.appts = []; } } else state.appts = [];
  if (state.restaurant){ sb.rpc('shop_booking_terms', { p_shop:state.restaurant.id }).then(({ data }) => { if (data) state.bkTerms = data; }, () => {}); }
  const allOrders = need(await sb.from('orders')
    .select('*, customer:profiles!customer_id(full_name,phone), order_items(name,quantity,price,note)')
    .eq('restaurant_id', state.restaurant.id).order('created_at', { ascending:false }).order('id', { ascending:false }).limit(120));
  if (!state.pastExtraOrders.length){ state.pastCursor = allOrders.length ? allOrders[allOrders.length - 1] : null; state.pastHasMore = allOrders.length === 120; }
  state.payChecks = allOrders.filter(o => o.payment_status === 'checking' && o.pay_destination === 'shop');
  const orderMap = new Map((state.pastExtraOrders || []).map(o => [o.id, o])); allOrders.forEach(o => orderMap.set(o.id, o));
  const data = Array.from(orderMap.values()).sort(compareOrdersDesc)
    .filter(o => !(o.payment_method === 'wallet' && ['unpaid', 'checking'].includes(o.payment_status)));  // online orders show only after the money is received
  const active = data.filter(o => ['accepted','preparing'].includes(o.status)).map(o => o.id);
  if (active.length){
    const logs = need(await sb.from('order_status_log').select('order_id,changed_at').in('order_id', active).eq('status', 'accepted'));
    logs.forEach(l => { state.acceptedAt[l.order_id] = l.changed_at; });
  }
  await Promise.all(data.filter(o => ['rider_assigned', 'picked_up'].includes(o.status)).map(async o => {
    const r = await sb.rpc('order_rider_info', { p_order_id:o.id }); o.rider = (r.data && r.data[0]) || null;
  }));
  state.issues = {};
  const recent = data.filter(o => !['delivered','rejected'].includes(o.status) && (o.status !== 'cancelled' || o.return_status === 'returning')).map(o => o.id);
  if (recent.length){
    const rows = need(await sb.from('order_issues').select('id,order_id,restaurant_id,kind,note,status,wait_until,resolution,created_at').in('order_id', recent).in('status', ['open','returning']).order('created_at', { ascending:false }));
    rows.forEach(i => { (state.issues[i.order_id] = state.issues[i.order_id] || []).push(i); });
    const newIss = rows.filter(i => !state.seenIssues.has(i.id));
    newIss.forEach(i => state.seenIssues.add(i.id));
    if (newIss.length && state.loadedOnce){ beep(); toast(t('new_problem') + ': ' + t('k_' + newIss[0].kind), true); }
  }
  state.orders = data;
  const fresh = data.filter(o => o.status === 'placed' && !state.alerted.has(o.id));
  fresh.forEach(o => state.alerted.add(o.id));
  if (fresh.length && state.loadedOnce && !$('sheet')) showNewOrder(fresh[0]);
  state.loadedOnce = true;
  updateTitle(); markTab();
}
async function loadOlderPastOrders(){
  const cursor = state.pastCursor;
  if (!state.restaurant || !cursor || !cursor.created_at){ state.pastHasMore = false; return; }
  const filter = `created_at.lt.${cursor.created_at},and(created_at.eq.${cursor.created_at},id.lt.${cursor.id})`;
  const rows = need(await sb.from('orders')
    .select('*, customer:profiles!customer_id(full_name,phone), order_items(name,quantity,price,note)')
    .eq('restaurant_id', state.restaurant.id).in('status', ['delivered','cancelled','rejected']).or(filter)
    .order('created_at', { ascending:false }).order('id', { ascending:false }).limit(60));
  const page = rows || []; const known = new Set(state.pastExtraOrders.map(o => o.id));
  state.pastExtraOrders = state.pastExtraOrders.concat(page.filter(o => !known.has(o.id))).sort(compareOrdersDesc);
  if (page.length) state.pastCursor = page[page.length - 1];
  state.pastHasMore = page.length === 60;
  await loadOrders();
}
async function loadInsights(){
  if (state.staffMode || !state.restaurant) throw new Error('Insights are available to the shop owner only');
  const rows = need(await sb.from('orders').select('customer_id,created_at,status')
    .eq('restaurant_id', state.restaurant.id).order('created_at', { ascending:false }).limit(1000));
  state.insights = { rows:rows || [], capped:(rows || []).length === 1000, loadedAt:new Date().toISOString() };
}
function viewInsights(){
  const data = state.insights || {}, rows = data.rows || [], now = Date.now(), day = 86400000;
  const end = now, start30 = now - 30 * day, start60 = now - 60 * day, start90 = now - 90 * day;
  const outcomeRates = (from, to) => {
    const cohort = rows.filter(o => { const x = Date.parse(o.created_at); return Number.isFinite(x) && x >= from && x < to; });
    const total = cohort.length;
    const rate = status => total ? cohort.filter(o => o.status === status).length / total : null;
    return { delivered:rate('delivered'), cancelled:total ? cohort.filter(o => ['cancelled','rejected'].includes(o.status)).length / total : null, total };
  };
  const recentOutcomes = outcomeRates(start30, end + 1), previousOutcomes = outcomeRates(start60, start30);
  const rateLabel = (current, prior) => current === null ? '—' : `${(current * 100).toFixed(1)}%${prior === null ? '' : ` (${current - prior > 0 ? '+' : ''}${((current - prior) * 100).toFixed(1)} pp vs prior 30 days)`}`;
  const outcomeNote = state.lang === 'ur' ? 'آرڈر بننے کی تاریخ کے مطابق 30 دن کے گروپ؛ حیثیت موجودہ لوڈ کے وقت کی ہے، حتمی نتیجہ ضروری نہیں۔' : '30-day cohorts by order creation date; statuses reflect their current value when loaded, not necessarily a final outcome.';
  const delivered = rows.filter(o => o.status === 'delivered');
  const recent = delivered.filter(o => { const x = Date.parse(o.created_at); return x >= start30 && x <= end; }).length;
  const previous = delivered.filter(o => { const x = Date.parse(o.created_at); return x >= start60 && x < start30; }).length;
  const cust = new Map();
  delivered.filter(o => Date.parse(o.created_at) >= start90 && o.customer_id).forEach(o => cust.set(o.customer_id, (cust.get(o.customer_id) || 0) + 1));
  const groups = { first:0, repeat:0, frequent:0 };
  cust.forEach(n => { groups[n >= 3 ? 'frequent' : n >= 2 ? 'repeat' : 'first']++; });
  const max = Math.max(1, ...Array.from({length:4}, (_, i) => delivered.filter(o => { const x = Date.parse(o.created_at); return x >= now - (i + 1) * 7 * day && x < now - i * 7 * day; }).length));
  const bars = Array.from({length:4}, (_, i) => {
    const count = delivered.filter(o => { const x = Date.parse(o.created_at); return x >= now - (i + 1) * 7 * day && x < now - i * 7 * day; }).length;
    const label = i === 0 ? (state.lang === 'ur' ? 'یہ ہفتہ' : 'This week') : (state.lang === 'ur' ? `${i} ہفتے پہلے` : `${i} week${i > 1 ? 's' : ''} ago`);
    return `<div class="line" style="align-items:center;gap:10px"><span class="muted" style="min-width:90px">${label}</span><span style="flex:1;background:var(--soft);border-radius:99px;height:10px;overflow:hidden"><i style="display:block;width:${Math.round(count / max * 100)}%;height:100%;background:var(--brand);border-radius:99px"></i></span><b>${count}</b></div>`;
  }).reverse().join('');
  const delta = previous ? Math.round((recent - previous) / previous * 100) : null;
  const change = delta === null ? (state.lang === 'ur' ? 'پچھلے 30 دن میں آرڈر نہیں' : 'No delivered orders in the prior 30 days') : `${delta > 0 ? '+' : ''}${delta}% ${state.lang === 'ur' ? 'گزشتہ 30 دن کے مقابلے میں' : 'vs prior 30 days'}`;
  const capNote = data.capped ? (state.lang === 'ur' ? 'یہ خلاصہ تازہ ترین 1,000 آرڈرز تک محدود ہے۔' : 'Summary is limited to the latest 1,000 shop-visible orders.') : (state.lang === 'ur' ? 'صرف اس دکان کے نظر آنے والے آرڈرز؛ گاہک کی شناخت یا رابطہ معلومات شامل نہیں۔' : 'Only orders visible to this shop are used. No customer identity or contact details are shown.');
  return `<h1>${state.lang === 'ur' ? '📈 دکان کے رجحانات' : '📈 Shop insights'}</h1>
    <p class="muted" style="margin-top:-6px">${state.lang === 'ur' ? 'پچھلے 30 اور 90 دن کے مکمل شدہ آرڈرز' : 'Delivered-order trends over the last 30 and 90 days'}</p>
    <div class="tiles"><div class="tile hi"><b>${recent}</b><span>${state.lang === 'ur' ? 'مکمل آرڈر · 30 دن' : 'Delivered · 30 days'}</span></div><div class="tile"><b>${previous}</b><span>${state.lang === 'ur' ? 'اس سے پچھلے 30 دن' : 'Prior 30 days'}</span></div></div>
    <div class="card" style="margin-top:10px"><b>${esc(change)}</b><div class="muted" style="font-size:13px;margin-top:4px">${state.lang === 'ur' ? 'صرف سمت کا موازنہ؛ موسمی اثرات یا منسوخیوں کی وجہ نہیں بتاتا۔' : 'A simple comparison, not an explanation of seasonality or cancellations.'}</div></div>
    <h2>${state.lang === 'ur' ? 'آرڈر کے نتائج · دو 30 روزہ گروپ' : 'Order outcomes · two 30-day cohorts'}</h2><div class="card"><div class="line"><span>${state.lang === 'ur' ? 'مکمل ہونے کی شرح' : 'Delivered share'}<small class="muted"> · ${recentOutcomes.total} / ${previousOutcomes.total} orders</small></span><b>${rateLabel(recentOutcomes.delivered, previousOutcomes.delivered)}</b></div><div class="line"><span>${state.lang === 'ur' ? 'منسوخ / مسترد شرح' : 'Cancelled / rejected share'}<small class="muted"> · ${recentOutcomes.total} / ${previousOutcomes.total} orders</small></span><b>${rateLabel(recentOutcomes.cancelled, previousOutcomes.cancelled)}</b></div><div class="muted" style="font-size:13px;margin-top:4px">${esc(outcomeNote)}</div></div>
    <h2>${state.lang === 'ur' ? 'ہفتہ وار رجحان' : 'Weekly order trend'}</h2><div class="card">${bars}</div>
    <h2>${state.lang === 'ur' ? 'گاہکوں کے مجموعی گروپ · 90 دن' : 'Aggregate customer groups · 90 days'}</h2><div class="card"><div class="line"><span>${state.lang === 'ur' ? 'ایک مکمل آرڈر' : 'One delivered order'}</span><b>${groups.first}</b></div><div class="line"><span>${state.lang === 'ur' ? '2 مکمل آرڈر' : '2 delivered orders'}</span><b>${groups.repeat}</b></div><div class="line"><span>${state.lang === 'ur' ? '3 یا زیادہ مکمل آرڈر' : '3+ delivered orders'}</span><b>${groups.frequent}</b></div></div>
    <div class="note">${esc(capNote)}</div><button class="btn ghost" onclick="A.refreshInsights()">${state.lang === 'ur' ? 'تازہ کریں' : 'Refresh insights'}</button>`;
}

async function loadEarn(){
  const from = range(state.period); const id = state.restaurant.id;
  const [o, un, pay] = await Promise.all([
    sb.from('orders').select('id,status,subtotal,commission_amount,restaurant_earning,created_at,order_items(name,quantity,price)').eq('restaurant_id', id).gte('created_at', from.toISOString()).limit(3000),
    sb.from('orders').select('restaurant_earning').eq('restaurant_id', id).eq('status', 'delivered').eq('restaurant_settled', false),
    sb.from('payouts').select('*').eq('party_type', 'restaurant').eq('party_id', id).order('created_at', { ascending:false }).limit(20)
  ]);
  try { state.fees = need(await sb.from('shop_fees').select('*').eq('restaurant_id', id).order('month', { ascending:false }).limit(12)) || []; } catch (e) { state.fees = []; }
  const orders = need(o); const del = orders.filter(x => x.status === 'delivered');
  const sum = (l, f) => l.reduce((n, x) => n + num(f(x)), 0);
  // services revenue: appointments are paid cash at the shop, so done ones count in
  // sales/earning/delivered — but not in "to receive" (Dera owes nothing for them)
  let appts = [];
  try { appts = need(await sb.from('appointments').select('id,item_name,price,commission_amount,status,starts_at').eq('restaurant_id', id).in('status', ['done','cancelled','no_show']).gte('starts_at', from.toISOString()).limit(1000)) || []; } catch (e) { logErr(e); }
  const doneAp = appts.filter(x => x.status === 'done');
  const cxAp = appts.filter(x => x.status !== 'done');
  const apSales = sum(doneAp, x => x.price), apComm = sum(doneAp, x => x.commission_amount);
  const by = {};
  del.forEach(x => (x.order_items || []).forEach(i => { const p = by[i.name] || (by[i.name] = { qty:0, rev:0 }); p.qty += i.quantity; p.rev += num(i.price) * i.quantity; }));
  doneAp.forEach(x => { const p = by[x.item_name] || (by[x.item_name] = { qty:0, rev:0 }); p.qty += 1; p.rev += num(x.price); });
  state.earnOrders = orders.concat(appts.map(x => ({ id:x.id, created_at:x.starts_at, status:x.status, order_items:[{ name:x.item_name, quantity:1, price:x.price }], subtotal:x.status === 'done' ? x.price : 0, commission_amount:x.status === 'done' ? x.commission_amount : 0, restaurant_earning:x.status === 'done' ? num(x.price) - num(x.commission_amount) : 0 })));
  state.earn = {
    orders:orders.length + appts.length, delivered:del.length + doneAp.length, cancelled:orders.filter(x => ['cancelled','rejected'].includes(x.status)).length + cxAp.length,
    sales:sum(del, x => x.subtotal) + apSales, commission:sum(del, x => x.commission_amount) + apComm, earning:sum(del, x => x.restaurant_earning) + (apSales - apComm),
    unpaid:sum(need(un), x => x.restaurant_earning), payouts:need(pay),
    top:Object.entries(by).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.qty - a.qty).slice(0, 8)
  };
}

function stmtMonths(){
  const pkt = new Date(new Date().toLocaleString('en-US', { timeZone:'Asia/Karachi' }));
  const out = [];
  for (let i = 0; i < 6; i++){
    const d = new Date(pkt.getFullYear(), pkt.getMonth() - i, 1);
    out.push({ key:d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-01',
      label:d.toLocaleDateString(state.lang === 'ur' ? 'ur-PK' : 'en-GB', { month:'long', year:'numeric' }) });
  }
  return out;
}
async function loadStmt(){

}

function resizeImage(file, max){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      if (!img.width || !img.height){ URL.revokeObjectURL(url); return rej(new Error('Could not read this image')); }
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read this image')), 'image/jpeg', 0.82);
    };
    img.onerror = () => rej(new Error('Could not read this image')); img.src = url;
  });
}

function payAccList(p){

  payAccSaveEdit(){
    A.payAccHarvest();
    const ed = state.paEdit; if (!ed) return;
    const a = ed.entry;
    const cleanPhone = v => String(v || '').replace(/\D/g, '').replace(/^92(?=3\d{9}$)/, '0');
    if (a.type === 'bank'){
      a.iban = String(a.iban || '').replace(/\s/g, '').toUpperCase();
      a.raast_id = cleanPhone(a.raast_id);
      a.number = '';
      if (a.iban && !/^PK\d{2}[A-Z]{4}\d{16}$/.test(a.iban)) return toast(t('iban_l'), true);
    } else {
      a.number = cleanPhone(a.number);
      a.iban = ''; a.raast_id = ''; a.bank = '';
      if (a.number && !/^03\d{9}$/.test(a.number)) return toast('03XXXXXXXXX', true);
    }
    a.title = String(a.title || '').trim(); a.label = String(a.label || '').trim(); a.bank = String(a.bank || '').trim(); a.qr_url = String(a.qr_url || '').trim();
    if (ed.idx >= 0) state.paDraft.accounts[ed.idx] = a; else state.paDraft.accounts.push(a);
    state.paEdit = null;
    A.payAccountsSheet(true);

  async submitPwChange(){
    const cur = $('npw0') ? $('npw0').value : '';
    const p1 = $('npw1').value, p2 = $('npw2').value; const m = $('npwMsg'); if (m) m.textContent = '';
    if (!cur){ if (m) m.textContent = t('enter_all'); return; }
    if (p1.length < 6){ if (m) m.textContent = t('short_pw'); return; }
    if (p1 !== p2){ if (m) m.textContent = t('pw_mismatch'); return; }
    const b = $('npwBtn'); if (b){ b.disabled = true; b.textContent = t('loading'); }
    try {
      const { data:gu } = await sb.auth.getUser();
      const email = gu && gu.user && gu.user.email;
      const { error:ce } = await sb.auth.signInWithPassword({ email, password:cur });
      if (ce) throw ce;
    } catch (e) {
      if (m) m.textContent = t('pw_cur_wrong');
      if (b){ b.disabled = false; b.textContent = t('pw_set'); }
      return;
    }
    let ok = false;
    await run(async () => {
      const { error } = await sb.auth.updateUser({ password:p1 }); if (error) throw error;
      try { need(await sb.rpc('i_changed_my_password')); } catch (e) {}
      ok = true;
      toast(t('pw_changed'));
      if (state.pwBlocking){ state.pwBlocking = false; await afterLogin(state.user); }

let channel = null, pollTimer = null;
function subscribeOrders(){
  try {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('rest-orders').on('postgres_changes',
      { event:'*', schema:'public', table:'orders', filter:'restaurant_id=eq.' + state.restaurant.id },
      async payload => { if (payload.eventType === 'INSERT' && !(payload.new && payload.new.payment_method === 'wallet')){ unlockAudio(); beep(); } await refreshOrders(); }
    ).on('postgres_changes', { event:'INSERT', schema:'public', table:'order_issues', filter:'restaurant_id=eq.' + state.restaurant.id },
      async () => { unlockAudio(); await refreshOrders(); }
    );
    const others = (state.shops || []).filter(x => x.id !== state.restaurant.id).map(x => x.id);
    if (others.length) channel.on('postgres_changes', { event:'*', schema:'public', table:'orders', filter:'restaurant_id=in.(' + others.join(',') + ')' }, () => checkOtherShops(false));
    channel.subscribe();
  } catch (e) { console.warn('Live updates are off', e); }
  if (!pollTimer) pollTimer = setInterval(() => { if (state.user) refreshOrders(); }, 15000);
}

// ================= FCM PUSH (Capacitor only; web par no-op) =================
// App khulne par login user ka FCM token device_tokens mein save hota hai,
// taake Admin app se push bheja ja sake. Koi error login ko kabhi nahi rokti.
function handleCallPush(d){
  try {
    if (!d || d.type !== 'call') return false;
    const rec = { thread: d.thread, orderId: d.orderId || null, ts: Date.now() };
    try { localStorage.setItem('dera_pending_call', JSON.stringify(rec)); } catch (e) {}
    try { if (typeof Chat !== 'undefined' && Chat.consumePendingCall) Chat.consumePendingCall(); } catch (e) {}
    return true;
  } catch (e) { return false; }
}
const FCM = {
  app: 'shop',
  done: false,
  async register(uid){
    try {
      if (this.done) return; this.done = true;
      const Cap = window.Capacitor;
      const PN = Cap && Cap.Plugins && Cap.Plugins.PushNotifications;
      if (!PN || !uid) return;
      const saved = new Promise((res) => {
        try {
          PN.addListener('registration', async (tok) => {
            try {
              if (tok && tok.value) await sb.from('device_tokens').upsert({ user_id: uid, token: tok.value, platform: 'android', app: FCM.app, updated_at: new Date().toISOString() }, { onConflict: 'token' });
            } catch (e) {}
            res();
          });
          PN.addListener('registrationError', () => res());
        } catch (e) { res(); }
        setTimeout(res, 10000);
      });
      const perm = await PN.requestPermissions();
      if (!perm || perm.receive === 'denied') return;
      await PN.register();
      await saved;
      try {
        PN.addListener('pushNotificationReceived', async (n) => {
          try {
            try { if (n && n.data) handleCallPush(n.data); } catch (e) {}
            const LN = Cap.Plugins.LocalNotifications;
            if (!LN || !n) return;
            await LN.schedule({ notifications: [{ id: Date.now() % 2147483647, title: n.title || 'Dera', body: n.body || '', extra: n.data || {} }] });
          } catch (e) {}
        });
      } catch (e) {}
      try {
        PN.addListener('pushNotificationActionPerformed', (a) => {
          try {
            try { if (a && a.notification && a.notification.data) handleCallPush(a.notification.data); } catch (e) {}
            const p = a && a.notification && a.notification.data && a.notification.data.path;
            if (p) location.hash = p;
          } catch (e) {}
        });
      } catch (e) {}
    } catch (e) {}
  }
};

      const isSup = thread && thread.startsWith('sup');
      if (isSup) {
        if (cfg.role !== 'rider' && cfg.role !== 'admin') return;
        video = true;
      } else {
        if (cfg.role === 'admin') return;
        if (!orderId || !['cr','cs','rs'].includes(thread)) return;
        video = false;
      }
      if (callSt) { if (cfg.toast) cfg.toast(tr('busy_self')); return; }
      if (!isSup) {
        try {
          const { data: od } = await sb.from('orders').select('status').eq('id', orderId).single();
          if (od && ['delivered','cancelled'].includes(od.status)) { if (cfg.toast) cfg.toast(tr('closed')); return; }
        } catch (x) {}
      }
      const peerName = await callPeerName(orderId, thread);
      const peerKey = isSup ? supPeerKey() : null;
      callSt = { orderId, thread, state: 'calling', peerName, muted: false, pendCand: [], durSec: null, video: !!video, peerKey, speaker: false };
      callShow();
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: !!video }); }
      catch (x) { callEnd(tr('mic_denied')); return; }
      if (!callSt || callSt.state !== 'calling') { try { stream.getTracks().forEach(t => t.stop()); } catch (x) {} return; }
      callSt.stream = stream;
      const pc = callNewPc(callSt);
      callSt.pc = pc;
      stream.getTracks().forEach(t => pc.addTrack(t, stream));

      await pc.setLocalDescription(offer);
      if (callSt) callSt.noAnsTimer = setTimeout(() => {
        try { if (callSt && callSt.state === 'calling') { callSend(callSt.orderId, callSt.thread, { type: 'hangup' }, callSt.peerKey); callEnd(tr('no_answer')); } } catch (x) {}
      }, CALL_NOANSWER_MS);
      const ok = await callSend(orderId, thread, { type: 'offer', sdp: offer, video: !!video }, peerKey);
      if (!ok) { callEnd(tr('call_failed')); return; }

  }

          } catch (x) {}
        }
        const peerName = await callPeerName(orderId, thread);
        if (callSt) { await callSend(orderId, thread, { type: 'busy' }, peerKey); return; }

        callShow();

        if (callSt) callSt.ringTimer = setInterval(() => { try { if (callSt && callSt.state === 'incoming' && cfg.ding) cfg.ding(); } catch (x) {} }, 3000);
        return;
      }
      if (type === 'call-ready') {
        const cs = callSt;
        if (cs && cs.state === 'calling' && cs.orderId === orderId && cs.thread === thread && cs.pc && cs.pc.localDescription) {
          try { await callSend(orderId, thread, { type: 'offer', sdp: cs.pc.localDescription, video: !!cs.video }, cs.peerKey); } catch (x) {}
        }
        return;
      }
      const s = callSt;
      if (!s || s.orderId !== orderId || s.thread !== thread) return;
      if (thread && thread.startsWith('sup') && peerKey && s.peerKey && s.peerKey !== peerKey) return;

        if (s.state !== 'calling') return;
        if (s.noAnsTimer) { clearTimeout(s.noAnsTimer); s.noAnsTimer = null; }
        try {
          await s.pc.setRemoteDescription(p.sdp);
          if (s.state === 'calling') { s.state = 'connecting'; callShow(); }
          const q = s.pendCand; s.pendCand = [];
          for (const c of q) { try { await s.pc.addIceCandidate(c); } catch (x) {} }
        } catch (x) { callEnd(tr('call_failed')); }
        return;
      }
      if (type === 'ice-candidate') {
        try {
          if (!s.pc) { s.pendCand.push(p.candidate); return; }
          if (s.pc.remoteDescription) await s.pc.addIceCandidate(p.candidate);
          else s.pendCand.push(p.candidate);
        } catch (x) {}
        return;
      }
      if (type === 'hangup') { callEnd(s.state === 'in-call' ? tr('call_ended') : null); return; }

      catch (x) { await callSend(s.orderId, s.thread, { type: 'decline' }, s.peerKey); callEnd(tr('mic_denied')); return; }
      if (!callSt || callSt !== s) { try { stream.getTracks().forEach(t => t.stop()); } catch (x) {} return; }

  }
  async function callDecline(){

  async function callCancel(){

  }
  async function callHangup(){
    try { const s = callSt; if (s) await callSend(s.orderId, s.thread, { type: 'hangup' }, s.peerKey); } catch (x) {}

  }
  function callMute(){

  }

    } catch (x) {}
  }
  return { init, stop, refresh, button, inbox, open, close, send, label, askJoin, sendPhoto, sendLoc, callStart, callAccept, callDecline, callCancel, callHangup, callMute, callSpeaker, consumePendingCall };
})();

})();

        if (!running) return;
        while (paused){ await new Promise(r => setTimeout(r, 500)); if (!running) return; }
        const it = items[done++];
        try {
          const url = await lookup(it.barcode);
          if (url){
            const blob = await fetchBlob(url);
            const upUrl = await uploadImage(blob, 'items');
            const { error } = await sb.rpc('shop_submit_menu_photo', { p_menu_item_id:it.id, p_photo_url:upUrl, p_photos:Array.isArray(it.photos) ? it.photos : [], p_back_photos:Array.isArray(it.back_photos) ? it.back_photos : [] });
            if (!error){ it.pending_photo_url = upUrl; found++; }
          }
        } catch (e) {}
        draw();
      }
    };
    for (let w = 0; w < 4; w++) workers.push(next());
    await Promise.all(workers);
    running = false; draw();
    await loadMenu(); renderTab();
  }
  function toggle(){ paused = !paused; draw(); }
  function close(){ running = false; C.closeSheet(); }
  function init(cfg){ C = cfg; }
  return { init, open, toggle, close };
})();

const Report = (() => {
  let xlsxP = null;
  function loadXlsx(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxP) xlsxP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error('xlsx')); }; document.head.appendChild(s); });
    return xlsxP;
  }
  function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  // sheets: [{ name, rows:[[header...], [cells...]] }]
  async function excel(file, sheets){
    try {
      const X = await loadXlsx(); const wb = X.utils.book_new();
      sheets.forEach(sh => { const ws = X.utils.aoa_to_sheet(sh.rows); ws['!cols'] = (sh.rows[0] || []).map((_, i) => ({ wch:Math.min(40, Math.max(10, ...sh.rows.map(r => String(r[i] ?? '').length + 2))) })); X.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31)); });
      X.writeFile(wb, file + '.xlsx');
    } catch (e) {
      // Fallback: CSV opens in Excel too
      const sh = sheets[0]; const csv = sh.rows.map(r => r.map(c => { const v = String(c ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
      download(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }), file + '.csv');
    }
  }
  const esc2 = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  // Printable page: title, subtitle, blocks of { heading, rows:[[label, value]] } and optional table { head:[], rows:[[]] }
  function pdf(o){
    const old = document.getElementById('rptWrap'); if (old) old.remove();
    const w = document.createElement('div'); w.id = 'rptWrap';
    w.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.5);overflow:auto;padding:16px';
    const kv = rows => rows.map(([a, b, bold]) => `<tr${bold ? ' style="font-weight:800;border-top:2px solid #111"' : ''}><td>${esc2(a)}</td><td style="text-align:right">${esc2(b)}</td></tr>`).join('');
    const tbl = t => `<table class="rt"><thead><tr>${t.head.map(h => `<th>${esc2(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map((c, i) => `<td${i >= (t.numFrom ?? 99) ? ' style="text-align:right"' : ''}>${esc2(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    w.innerHTML = `<style>
      #rptWrap .pg{max-width:800px;overflow-wrap:anywhere;margin:0 auto;background:#fff;color:#111;border-radius:12px;padding:24px;font:14px/1.5 system-ui,sans-serif}
      #rptWrap h1{margin:0;font-size:22px} #rptWrap h2{font-size:16px;margin:18px 0 6px}
      #rptWrap table{width:100%;border-collapse:collapse} #rptWrap td,#rptWrap th{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
      #rptWrap .rt{font-size:12px;min-width:520px} #rptWrap .rt th{white-space:nowrap} #rptWrap .rt th{background:#f0f3ee}
      #rptWrap .nb{max-width:800px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
      @media (max-width:520px){#rptWrap{padding:10px}#rptWrap .pg{padding:16px}#rptWrap h1{font-size:19px}}
      @media print{#rptWrap .rt{min-width:0}body>*:not(#rptWrap){display:none!important}#rptWrap{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}#rptWrap .nb{display:none!important}#rptWrap .pg{border-radius:0;padding:0}}
    </style>
    <div class="pg"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h1>${esc2(o.title)}</h1><div style="color:#555">${esc2(o.subtitle || '')}</div></div>
      <div style="text-align:right"><b style="font-size:18px">Dera<span style="color:#F2A900">.</span></b><div style="color:#555;font-size:12px">Kallar Kahar · ${esc2(new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }))}</div></div></div>
      ${(o.blocks || []).map(b => `<h2>${esc2(b.heading)}</h2><table>${kv(b.rows)}</table>`).join('')}
      ${o.table ? `<h2>${esc2(o.table.heading || '')}</h2><div style="overflow-x:auto;-webkit-overflow-scrolling:touch">${tbl(o.table)}</div>` : ''}
      ${o.note ? `<p style="color:#555;font-size:12px;margin-top:16px">${esc2(o.note)}</p>` : ''}</div>
    <div class="nb"><button class="btn" onclick="window.print()">${esc2(o.printLabel || 'Print or save as PDF')}</button><button class="btn ghost" style="background:#fff" onclick="document.getElementById('rptWrap').remove()">${esc2(o.closeLabel || 'Close')}</button></div>`;
    document.body.appendChild(w);
  }
  return { excel, pdf };
})();

// ================= BACK BUTTON (same code in all four apps) =================
// Phone back button: closes the open popup first, then goes to the main tab, then asks "press back again to exit".
const BackNav = (() => {
  let cfg = null, pushed = 0, internal = 0, armed = false, armTimer = null, pushHash = [];
  const present = () => cfg.overlays.filter(([sel]) => document.querySelector(sel));
  function onMutate(){
    const n = present().length;
    while (pushed < n){ pushHash.push(location.hash); history.pushState({ wmov:pushed + 1 }, '', location.href); pushed++; }
    if (pushed > n){
      const extra = pushed - n; pushed = n;
      const h = pushHash.splice(n).pop();
      // Closed by a button (same page): remove our extra history steps. Closed because the page changed: leave history alone.
      if (h === location.hash && history.state && history.state.wmov){ internal++; history.go(-extra); }
    }
  }
  function guard(){ history.pushState({ wmg:1 }, '', location.href); }
  function onPop(ev){
    if (internal > 0){ internal--; return; }
    const st = ev.state || {};
    const open = present();
    if (open.length){
      // user pressed back while a popup is open: close the top one
      pushed = Math.max(0, pushed - 1); pushHash.pop();
      const [sel, close] = open[open.length - 1];
      try { close ? close() : document.querySelector(sel).remove(); } catch (e) { const el = document.querySelector(sel); if (el) el.remove(); }
      return;
    }
    if (st.wmov){ internal++; history.back(); return; }         // leftover popup step: skip it
    if (!st.wmb) return;                                          // normal page change (hash links) is handled by the app
    if (cfg.back && cfg.back()){ guard(); return; }               // went to main tab / home
    if (armed){ return; }                                         // second press: nothing left, phone closes the app
    armed = true; cfg.toast(cfg.exitMsg());
    clearTimeout(armTimer); armTimer = setTimeout(() => { armed = false; if (history.state && history.state.wmb) guard(); }, 2200);
  }
  function init(c){
    if (cfg) return; cfg = c;
    history.replaceState({ wmb:1 }, '', location.href); guard();
    window.addEventListener('popstate', onPop);
    new MutationObserver(onMutate).observe(document.body, { childList:true });
  }
  return { init };
})();
