<title>Wanhar Mart Shop</title>

<style>
:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#1E2B25; --muted:#66746C; --line:#DDE3DB; --soft:#EAF1EC;
  --green:#1F6F4A; --green-dark:#175539; --marigold:#F2A900; --danger:#B3261E; --blue:#2A6F97;
  --s-placed:#B7791F; --s-accepted:#2A6F97; --s-preparing:#C4571A; --s-ready:#0F766E;
  --s-rider_assigned:#6B4FA0; --s-picked_up:#6B4FA0; --s-delivered:#1F6F4A; --s-cancelled:#B3261E; --s-rejected:#B3261E;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#111A16; --surface:#1A2620; --ink:#E7EFE9; --muted:#93A59A; --line:#2B3A32; --soft:#1F3129; --green:#3FA774; --green-dark:#2F8F60; --danger:#F08A82; --blue:#6FB3DA; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang=ur] body{font-family:"Noto Naskh Arabic","Bricolage Grotesque",system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--green)}
#app{max-width:680px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 16px;background:var(--paper);border-bottom:1px solid var(--line)}
.brand{font-weight:800;font-size:20px;letter-spacing:-.02em;line-height:1.15;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brand small{display:block;font-size:13px;font-weight:600;color:var(--muted);letter-spacing:0}
.pillbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:14px}
.openbtn{display:flex;align-items:center;gap:8px;border:0;border-radius:999px;padding:9px 16px 9px 12px;font-weight:800;cursor:pointer;color:#fff;background:var(--muted);flex:none}
.openbtn.on{background:var(--green)}
.openbtn i{width:10px;height:10px;border-radius:50%;background:#fff;opacity:.6}
.openbtn.on i{opacity:1}
main{padding:14px 16px 120px}
h1{font-size:24px;margin:6px 0 12px;letter-spacing:-.01em}
h2{font-size:18px;margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.count{background:var(--marigold);color:#1E2B25;font-size:13px;font-weight:800;border-radius:999px;padding:1px 9px}
.muted{color:var(--muted)}
.red{color:var(--danger)}
.empty{padding:34px 10px;text-align:center;color:var(--muted)}
.btn{display:block;width:100%;background:var(--green);color:#fff;border:0;border-radius:12px;padding:15px 16px;font-weight:700;cursor:pointer;text-align:center;font-size:17px;text-decoration:none}
.btn:active{background:var(--green-dark)}
.btn.ghost{background:transparent;color:var(--green);border:2px solid var(--green)}
.btn.warn{background:transparent;color:var(--danger);border:2px solid var(--danger)}
.btn.small{padding:10px 14px;font-size:15px;width:auto;display:inline-block}
.btn[disabled]{opacity:.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=search],textarea,select{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:14px 0 5px;font-weight:600;font-size:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin:0 0 12px}
.card.new{border:2px solid var(--marigold);box-shadow:0 0 0 4px rgba(242,169,0,.18)}
.card.late{border:2px solid var(--danger)}
.ch{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.oid{font-weight:800;font-size:18px}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff;background:var(--muted);white-space:nowrap}
.pill.y{background:#B7791F} .pill.g{background:var(--green)} .pill.r{background:var(--danger)}
.line{display:flex;justify-content:space-between;gap:12px;padding:3px 0}
.line.total{border-top:1px solid var(--line);margin-top:6px;padding-top:10px;font-weight:800;font-size:18px}
.items{font-size:17px;margin:8px 0}
.items div{padding:3px 0}
.items b{display:inline-block;min-width:34px;color:var(--green)}
.cust{margin:6px 0;padding:8px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:15px}
.countdown{display:flex;justify-content:space-between;align-items:center;background:var(--soft);border-radius:10px;padding:8px 12px;margin:8px 0;font-weight:700}
.countdown.late{background:rgba(179,38,30,.12);color:var(--danger)}
.actions{display:grid;gap:10px;margin-top:12px}
.note{background:rgba(242,169,0,.14);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.soundbar{background:var(--marigold);color:#1E2B25;border:0;width:100%;border-radius:12px;padding:12px;font-weight:800;margin-bottom:12px;cursor:pointer}
.closedbar{background:var(--surface);border:2px solid var(--danger);color:var(--danger);border-radius:12px;padding:12px;margin-bottom:12px;font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:10px}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:680px;margin:0 auto}
.nav button{position:relative;flex:1;background:none;border:0;padding:14px 4px 12px;font-weight:700;font-size:14px;color:var(--muted);border-top:3px solid transparent;cursor:pointer}
.nav button.on{color:var(--green);border-top-color:var(--marigold)}
.nav .dot{min-width:18px;height:18px;border-radius:9px;background:var(--danger);color:#fff;font-size:11px;display:inline-grid;place-items:center;padding:0 4px;margin-inline-start:4px;vertical-align:2px}
.row{display:flex;gap:12px;align-items:center;width:100%;text-align:start;background:none;border:0;border-bottom:1px solid var(--line);padding:12px 2px;color:inherit}
.row-main{flex:1;min-width:0;cursor:pointer;background:none;border:0;text-align:start;padding:0;color:inherit}
.thumb{width:54px;height:54px;border-radius:12px;background:var(--line);object-fit:cover;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted);overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover}
.switch{position:relative;display:block;width:50px;height:28px;flex:none;margin:0 auto 3px}
.switch input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:background .15s}
.switch span::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked + span{background:var(--green)}
.switch input:checked + span::after{transform:translateX(22px)}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:8px 0 12px;-webkit-overflow-scrolling:touch}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700}
.chip.on{background:var(--green);border-color:var(--green);color:#fff}
.cat{display:flex;justify-content:space-between;align-items:center;margin:20px 0 4px}
.cat h3{margin:0;font-size:18px}
.strike{text-decoration:line-through;color:var(--muted);font-size:13px;margin-inline-start:6px}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:680px;max-height:94%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet.alert{border-top:6px solid var(--marigold)}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sheet-head h3{margin:0;font-size:20px}
.x{background:none;border:0;font-size:30px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.preview{width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-top:8px}
.check{display:flex;align-items:center;gap:10px;margin:14px 0 4px}
.check input{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;z-index:60;max-width:90%;font-weight:600;text-align:center}
.toast.err{background:var(--danger);color:#fff}
.auth{max-width:400px;margin:0 auto;padding:9vh 20px 30px}
.auth .brand{font-size:40px;white-space:normal}
.auth .brand b{color:var(--marigold)}
.err-text{color:var(--danger);margin-top:12px;min-height:22px;font-weight:600}
.link{background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;padding:12px 0;font-weight:600}
.ver{font-size:12px;color:var(--muted);font-weight:600}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.tile b{display:block;font-size:22px}
.tile span{color:var(--muted);font-size:13px}
.tile.hi{background:var(--green);border-color:var(--green);color:#fff}
.tile.hi span{color:rgba(255,255,255,.85)}
.stars{color:var(--marigold);letter-spacing:1px}
.review{padding:10px 0;border-bottom:1px solid var(--line)}
.issuebox{background:rgba(179,38,30,.1);border:1px solid var(--danger);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14px}
.card.back{border:2px solid var(--danger)}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

let actx = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio);
const audioReady = () => !!actx && actx.state === 'running';
function beep(){
  if (state.sound && audioReady()){
    try {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.18; o.connect(g); g.connect(actx.destination); o.start();
      setTimeout(() => { o.frequency.value = 1175; }, 160); setTimeout(() => { o.frequency.value = 880; }, 320); setTimeout(() => o.stop(), 520);
    } catch (e) {}
  }
  try { if (navigator.vibrate) navigator.vibrate([300, 120, 300]); } catch (e) {}
}

async function loadOrders(){
  const data = need(await sb.from('orders')
    .select('*, customer:profiles!customer_id(full_name,phone), order_items(name,quantity,price,note)')
    .eq('restaurant_id', state.restaurant.id).order('created_at', { ascending:false }).limit(120));
  const active = data.filter(o => ['accepted','preparing'].includes(o.status)).map(o => o.id);
  if (active.length){
    const logs = need(await sb.from('order_status_log').select('order_id,changed_at').in('order_id', active).eq('status', 'accepted'));
    logs.forEach(l => { state.acceptedAt[l.order_id] = l.changed_at; });
  }
  await Promise.all(data.filter(o => ['rider_assigned', 'picked_up'].includes(o.status)).map(async o => {
    const r = await sb.rpc('order_rider_info', { p_order_id:o.id }); o.rider = (r.data && r.data[0]) || null;
  }));
  state.issues = {};
  const recent = data.filter(o => !['delivered','rejected'].includes(o.status) && (o.status !== 'cancelled' || o.return_status === 'returning')).map(o => o.id);
  if (recent.length){
    const rows = need(await sb.from('order_issues').select('*').in('order_id', recent).in('status', ['open','returning']).order('created_at', { ascending:false }));
    rows.forEach(i => { (state.issues[i.order_id] = state.issues[i.order_id] || []).push(i); });
    const newIss = rows.filter(i => !state.seenIssues.has(i.id));
    newIss.forEach(i => state.seenIssues.add(i.id));
    if (newIss.length && state.loadedOnce){ beep(); toast(t('new_problem') + ': ' + t('k_' + newIss[0].kind), true); }
  }
  state.orders = data;
  const fresh = data.filter(o => o.status === 'placed' && !state.alerted.has(o.id));
  fresh.forEach(o => state.alerted.add(o.id));
  if (fresh.length && state.loadedOnce && !$('sheet')) showNewOrder(fresh[0]);
  state.loadedOnce = true;
  updateTitle(); markTab();
}

}

function countdown(o){
  if (!['accepted','preparing'].includes(o.status) || !o.prep_minutes) return '';

                   : `<div class="countdown late"><span>${t('late_by')}</span><span>${-left} ${t('min')}</span></div>`;
}

async function loadEarn(){
  const from = range(state.period); const id = state.restaurant.id;
  const [o, un, pay] = await Promise.all([
    sb.from('orders').select('id,status,subtotal,commission_amount,restaurant_earning,created_at,order_items(name,quantity,price)').eq('restaurant_id', id).gte('created_at', from.toISOString()).limit(3000),
    sb.from('orders').select('restaurant_earning').eq('restaurant_id', id).eq('status', 'delivered').eq('restaurant_settled', false),
    sb.from('payouts').select('*').eq('party_type', 'restaurant').eq('party_id', id).order('created_at', { ascending:false }).limit(20)
  ]);
  const orders = need(o); const del = orders.filter(x => x.status === 'delivered');
  const sum = (l, f) => l.reduce((n, x) => n + num(f(x)), 0);
  const by = {};
  del.forEach(x => (x.order_items || []).forEach(i => { const p = by[i.name] || (by[i.name] = { qty:0, rev:0 }); p.qty += i.quantity; p.rev += num(i.price) * i.quantity; }));
  state.earn = {
    orders:orders.length, delivered:del.length, cancelled:orders.filter(x => ['cancelled','rejected'].includes(x.status)).length,
    sales:sum(del, x => x.subtotal), commission:sum(del, x => x.commission_amount), earning:sum(del, x => x.restaurant_earning),
    unpaid:sum(need(un), x => x.restaurant_earning), payouts:need(pay),
    top:Object.entries(by).map(([name, v]) => ({ name, ...v })).sort((a, b) => b.qty - a.qty).slice(0, 8)
  };
}

function resizeImage(file, max){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(file);
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(new Error('Could not read this image')), 'image/jpeg', 0.82);
    };
    img.onerror = () => rej(new Error('Could not read this image')); img.src = url;
  });
}
async function uploadImage(file, folder){
  const blob = await resizeImage(file, 900); const path = `${folder}/${Date.now()}.jpg`;
  need(await sb.storage.from('food-images').upload(path, blob, { contentType:'image/jpeg' }));
  return sb.storage.from('food-images').getPublicUrl(path).data.publicUrl;
}
function previewFile(input, id){ const f = input.files && input.files[0]; if (!f) return; const el = $(id); el.src = URL.createObjectURL(f); el.style.display = 'block'; }

    const btn = $('saveBtn'); btn.disabled = true; btn.textContent = t('loading');
    await run(async () => {
      const row = { name, description:$('i_desc').value.trim() || null, price:num(price), compare_price:cmp === '' ? null : num(cmp),
        category_id:$('i_cat').value, is_available:$('i_avail').checked };
      const f = $('i_photo').files[0]; if (f) row.photo_url = await uploadImage(f, 'items');
      if (id) need(await sb.from('menu_items').update(row).eq('id', id));
      else need(await sb.from('menu_items').insert(Object.assign(row, { restaurant_id:state.restaurant.id, sort_order:state.items.length + 1 })));
      await loadMenu(); closeSheet(); renderTab(); toast(t('saved'));
    });
    const b = $('saveBtn'); if (b){ b.disabled = false; b.textContent = t('save'); }
  },
  async deleteItem(id){
    if (!confirm(t('remove_q'))) return;
    await run(async () => { need(await sb.from('menu_items').delete().eq('id', id)); await loadMenu(); closeSheet(); renderTab(); toast(t('saved')); });
  }
};

// ================= LIVE =================
let channel = null, pollTimer = null;
function subscribeOrders(){
  try {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('rest-orders').on('postgres_changes',
      { event:'*', schema:'public', table:'orders', filter:'restaurant_id=eq.' + state.restaurant.id },
      async payload => { if (payload.eventType === 'INSERT'){ unlockAudio(); beep(); } await refreshOrders(); }
    ).on('postgres_changes', { event:'INSERT', schema:'public', table:'order_issues', filter:'restaurant_id=eq.' + state.restaurant.id },
      async () => { unlockAudio(); await refreshOrders(); }
    ).subscribe();
  } catch (e) { console.warn('Live updates are off', e); }
  if (!pollTimer) pollTimer = setInterval(() => { if (state.user) refreshOrders(); }, 15000);
}

  const data = need(await sb.from('restaurants').select('*').eq('owner_id', state.user.id).order('created_at').limit(1));

}

  await go('orders');
}

}

    const body = (text || (ta && ta.value) || '').trim(); if (!body) return;
    if (ta && !text) ta.value = '';
    const { data:id, error } = await sb.rpc('send_message', { p_order_id:cur.orderId, p_thread:cur.thread, p_body:body, p_user_id:cur.userId });
    if (error){ if (cfg.toast) cfg.toast(error.message, true); if (ta && !text) ta.value = body; return; }
    const m = { id, order_id:cur.orderId, thread:cur.thread, user_id:cur.userId, sender_id:me(), sender_role:cfg.role, body, created_at:new Date().toISOString() };
    seenIds.add(id); cur.msgs.push(m); draw(); setSeen(cur.k, m.created_at);
  }
  return { init, stop, refresh, button, inbox, open, close, send, label, askJoin };
})();

(async function boot(){
  applyLang();
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await afterLogin(session.user); else showAuth();
  } catch (e) { logErr(e); showAuth(t('error')); }
})();
</script>
