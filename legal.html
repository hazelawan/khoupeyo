privacy:`<h1>Privacy Policy</h1><p class="muted">{updated}</p>
<p>Wanhar Mart (“we”, “us”) runs a local delivery service in Kallar Kahar, District Chakwal, Punjab, Pakistan. We have four apps: the Customer app, the Shop app, the Rider app and the Admin panel. This policy explains what information we collect, why, and your choices.</p>
<h2>1. Information we collect</h2>
<ul>
<li><b>Account:</b> name, phone number, email address and password (the password is stored in encrypted form by our login provider; we cannot see it).</li>
<li><b>Customers:</b> delivery addresses, the map location you choose or share, orders, reviews, chat messages, invite codes and promo codes used.</li>
<li><b>Shops:</b> shop name, address, location, phone, opening times, products, photos, orders and earnings.</li>
<li><b>Riders:</b> vehicle, CNIC number, duty times, live location <u>only while on duty</u>, deliveries, cash collected, pay, fines, bonuses, and a selfie taken when starting duty. To check it is really you, the app turns your registered face photo into a set of numbers (a face template) and compares it with the duty selfie on your phone. The face template and selfies are stored privately and are seen only by you and Wanhar Mart admins.</li>
<li><b>Device:</b> notification token (to send order alerts), app language and basic error logs.</li>
</ul>
<h2>2. How we use it</h2>
<ul>
<li>To take, prepare, deliver and track orders, and to calculate delivery fees by distance.</li>
<li>To let customers, shops, riders and our support team talk about an order.</li>
<li>To pay shops and riders, record cash handovers, duty hours, overtime, fines and bonuses.</li>
<li>To send notifications about orders, messages, offers and account safety.</li>
<li>To prevent fraud and misuse, and to solve complaints.</li>
</ul>
<h2>3. Who can see your information</h2>
<ul>
<li><b>The shop</b> sees your name, phone, order and note. <b>The rider</b> sees your name, phone, delivery address and location for that order. <b>Customers</b> see the rider’s name, phone and live location while their order is on the way.</li>
<li><b>Other riders</b> see only your first name and initial on the “Rider of the day” list.</li>
<li><b>Service providers</b> that run our apps: Supabase (database, login and file storage), GitHub Pages (website hosting), OpenStreetMap and its address service (maps and finding your address), BigDataCloud (backup address lookup), and Google, Apple or Mozilla push services (notifications).</li>
<li><b>The law:</b> we share information with authorities only when Pakistani law requires it.</li>
</ul>
<p>We do not sell your personal information.</p>
<h2>4. Location</h2>
<p>Customers share location only when they tap “Use my location” or place a pin. Riders share location only while on duty, so customers and Wanhar Mart can follow the delivery and send nearby orders. You can turn location permission off in your phone settings, but some features will not work.</p>
<h2>5. How long we keep it</h2>
<p>We keep account information while your account is open. Order, payment and pay records are kept for up to 5 years for accounting and disputes. Duty selfies are kept only as long as needed to check duty and settle disputes. When your account is deleted, your name, phone, email, addresses, face template and notification tokens are removed; past orders stay in our records without your name.</p>
<h2>6. Security</h2>
<p>Data is sent over encrypted connections (HTTPS). Access is limited by account type, and each user can only see what their role needs. No system is 100% safe, so please keep your password private.</p>
<h2>7. Your choices and rights</h2>
<ul>
<li>You can see and edit your name, phone and addresses in the app.</li>
<li>You can turn notifications off at any time.</li>
<li><b>Delete your account:</b> open Account and tap “Delete my account”, or message “Wanhar Mart help”. We complete requests within 7 days.</li>
</ul>
<h2>8. Children</h2>
<p>Our apps are not meant for children under 13. Riders and shop owners must be 18 or older.</p>
<h2>9. Changes</h2>
<p>We may update this policy. We will change the date at the top and tell you in the app if the change is important.</p>
<h2>10. Contact</h2>

<li>واپس ہونے والے آرڈر کی رقم واپس نہیں ہو سکتی، اور بار بار ایسا ہونے پر اکاؤنٹ بند ہو سکتا ہے۔</li>
<li>آرڈر ملنے پر ہی ”مل گیا“ دبائیں۔ کوئی مسئلہ ہو تو فوراً ”نہیں ملا“ دبائیں یا سپورٹ سے رابطہ کریں۔</li></ul>
<h2>6. منسوخی اور رقم کی واپسی</h2>
<p>دکان کے قبول کرنے سے پہلے آرڈر منسوخ کر سکتے ہیں، بعد میں سپورٹ سے رابطہ کریں۔ کوئی چیز کم، غلط یا خراب ہو تو 24 گھنٹے میں بتائیں؛ جانچ کے بعد ہم چیز بدل سکتے ہیں، رقم واپس کر سکتے ہیں یا کوڈ دے سکتے ہیں۔</p>
<h2>7. پرومو کوڈ اور دعوت</h2>
<p>کوڈز کی شرائط ہوتی ہیں جیسے کم از کم آرڈر، آخری تاریخ اور استعمال کی حد۔ کوڈ کی کوئی نقد قیمت نہیں۔ جعلی اکاؤنٹس کے ذریعے استعمال سمیت غلط استعمال پر کوڈ منسوخ کیے جا سکتے ہیں۔</p>
<h2>8. دکانیں</h2>
<p>دکانیں پروڈکٹس، قیمتیں، تصاویر اور اوقات درست رکھیں، آرڈر وقت پر تیار کریں اور کاروبار اور صفائی کے قوانین پر عمل کریں۔ Wanhar Mart طے شدہ کمیشن کاٹ کر طے شدہ وقت پر ادائیگی کرتا ہے۔</p>
<h2>9. رائیڈر</h2>
<p>رائیڈر کے پاس درست ڈرائیونگ لائسنس ہو، ٹریفک قوانین پر عمل کرے، ڈیوٹی اپنی سیلفی سے شروع کرے، گاہکوں سے اچھا برتاؤ کرے اور جمع کیا گیا سارا کیش جمع کرائے۔ تنخواہ، اوور ٹائم، فی ڈیلیوری اجرت، بونس اور جرمانے رائیڈر کے کنٹریکٹ اور رائیڈر ایپ میں دیے گئے اصولوں کے مطابق ہوں گے۔ اصول توڑنے پر جرمانہ اجرت سے کاٹا جا سکتا ہے۔</p>
<h2>10. منع ہے</h2>
<p>غیر قانونی چیزیں، دھوکہ، جعلی آرڈر، ہراساں کرنا، ایپس کی نقل یا ان پر حملہ، یا کسی اور کا اکاؤنٹ استعمال کرنا۔</p>
<h2>11. ذمہ داری</h2>
<p>ہم ایپس چلتی رکھنے اور ڈیلیوری وقت پر کرنے کی کوشش کرتے ہیں، لیکن موسم، ٹریفک یا دکان کی وجہ سے دیر ہو سکتی ہے۔ قانون کی حد تک Wanhar Mart بالواسطہ نقصان کا ذمہ دار نہیں۔ یہ شرائط پاکستانی صارف قانون کے تحت آپ کے حقوق ختم نہیں کرتیں۔</p>
<h2>12. قانون</h2>
<p>یہ شرائط پاکستان کے قوانین کے تابع ہیں۔ تنازعہ پہلے ہماری سپورٹ کے ذریعے حل کیا جائے گا؛ ضرورت ہو تو پنجاب، پاکستان کی عدالتیں فیصلہ کریں گی۔</p>
<h2>13. تبدیلیاں</h2>
<p>ہم یہ شرائط بدل سکتے ہیں۔ تبدیلی کے بعد ایپس استعمال کرنا تبدیلی قبول کرنا ہے۔</p>
