// ================= DOCUMENT-SCAN ONBOARDING (Feature 23) =================
// Rider uploads onboarding documents (photo or PDF). Status is per
// document type; verification never changes rider approval itself.
// Pure helpers (harness-tested): dscTypeLabel, dscStatusMeta,
// dscSafeName, dscExt, dscPath, dscCanDelete, dscIsMissingTable.
const DSC_TYPES = ['cnic_front', 'cnic_back', 'licence', 'vehicle', 'other'];
const DSC_BUCKET = 'rider-docs';
function dscTypeLabel(k){ return t('dsc_t_' + k); }
function dscStatusMeta(s){
  if (s === 'verified') return { cls:'approved', label:t('dsc_verified') };
  if (s === 'rejected') return { cls:'rejected', label:t('dsc_rejected') };
  return { cls:'pending', label:t('dsc_pending') };
}
function dscSafeName(n){ return String(n || 'doc').replace(/[^A-Za-z0-9._-]+/g, '_').slice(0, 60) || 'doc'; }
function dscExt(name, mime){
  if ((mime || '').startsWith('image/')) return 'jpg';
  if (mime === 'application/pdf' || /\.pdf$/i.test(name || '')) return 'pdf';
  return '';
}
function dscPath(type, ext){ return state.user.id + '/doc-' + type + '-' + Date.now() + '.' + ext; }
function dscCanDelete(d){ return !!d && (d.status === 'pending' || d.status === 'rejected'); }
function dscIsMissingTable(e){
  const m = String((e && (e.message || e)) || '');
  return (e && e.code === '42P01') || m.indexOf('PGRST205') !== -1 || (m.indexOf('rider_documents') !== -1 && m.indexOf('does not exist') !== -1);
}
function dscImageBlob(file){
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file); const img = new Image();
    img.onload = () => {
      try {
        const s = Math.min(1, 1280 / Math.max(img.width, img.height));
        const c = document.createElement('canvas'); c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
        toBlob(c).then(res, rej);
      } catch (e) { URL.revokeObjectURL(url); rej(e); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('bad image')); };
    img.src = url;
  });
}
function dscListHtml(rows){
  const by = {}; (rows || []).forEach(d => { by[d.doc_type] = d; });
  const cards = DSC_TYPES.map(ty => {
    const d = by[ty] || null;
    const pill = d ? (() => { const m = dscStatusMeta(d.status); return `<span class="st ${m.cls}">${m.label}</span>`; })() : `<span class="muted">${t('dsc_not_submitted')}</span>`;
    const meta = d ? `<div class="muted" style="font-size:13px">${esc(d.file_name || '')} · ${new Date(d.created_at).toLocaleDateString('en-GB')}${d.status === 'rejected' && d.admin_note ? ` · ${t('dsc_reason')}${esc(d.admin_note)}` : ''}</div>` : '';
    return `<div class="card"><div class="row"><div class="row-main"><div class="row-title">📄 ${dscTypeLabel(ty)}</div>${meta}</div>${pill}</div>
      <input type="file" id="dscF-${ty}" accept="image/*,application/pdf" style="display:none" onchange="dscOnFile('${ty}',this)">
      <input type="file" id="dscC-${ty}" accept="image/*" capture="environment" style="display:none" onchange="dscOnFile('${ty}',this)">
      <div class="bar" style="margin-top:8px">${d ? `<button class="btn ghost small" onclick="dscView('${esc(d.storage_path)}')">${t('dsc_view')}</button>` : ''}
      <button class="btn small" onclick="$('dscF-${ty}').click()">${d ? t('dsc_replace') : t('dsc_upload')}</button>
      <button class="btn ghost small" onclick="$('dscC-${ty}').click()">📷 ${t('dsc_take_photo')}</button>
      ${dscCanDelete(d) ? `<button class="btn ghost small" onclick="dscDelete('${d.id}')">🗑️ ${t('dsc_delete')}</button>` : ''}</div></div>`;
  }).join('');
  return `<div class="note">${t('dsc_note')}</div>${cards}`;
}
async function dscOpen(){
  openSheet('📄 ' + t('dsc_title'), `<div class="muted" style="font-size:14px">${t('dsc_sub')}</div><div id="dscBody" style="margin-top:10px"><div class="empty">${t('loading')}</div></div>`);
  await dscLoad();
}
async function dscLoad(){
  const box = $('dscBody'); if (!box) return;
  try {
    const { data, error } = await sb.from('rider_documents').select('*').eq('rider_id', state.rider.id).order('doc_type');
    if (error) throw error;
    state.dscRows = data || [];
    box.innerHTML = dscListHtml(data || []);
  } catch (e) {
    box.innerHTML = dscIsMissingTable(e) ? `<div class="note">${t('dsc_pending_note')}</div>` : `<div class="empty">${esc(String((e && e.message) || e))}</div>`;
  }
}
async function dscOnFile(type, input){
  try {
    const f = input && input.files && input.files[0]; input.value = '';
    if (!f) return toast(t('dsc_file_needed'), true);
    const ext = dscExt(f.name, f.type);
    if (!ext) return toast(t('dsc_file_type'), true);
    toast(t('dsc_uploading'));
    const blob = ext === 'jpg' ? await dscImageBlob(f) : f;
    const path = dscPath(type, ext);
    const { error: uerr } = await sb.storage.from(DSC_BUCKET).upload(path, blob, { contentType: ext === 'jpg' ? 'image/jpeg' : 'application/pdf', upsert:false });
    if (uerr) throw uerr;
    const old = (state.dscRows || []).find(d => d.doc_type === type) || null;
    const row = { rider_id: state.rider.id, doc_type: type, storage_path: path, file_name: dscSafeName(f.name), status: 'pending', admin_note: null, reviewed_by: null, reviewed_at: null, updated_at: new Date().toISOString() };
    let werr = null;
    if (old) { const r = await sb.from('rider_documents').update(row).eq('id', old.id); werr = r.error; }
    else { const r = await sb.from('rider_documents').insert(row); werr = r.error; }
    if (werr) { try { await sb.storage.from(DSC_BUCKET).remove([path]); } catch (e) {} throw werr; }
    if (old && old.storage_path && old.storage_path !== path) { try { await sb.storage.from(DSC_BUCKET).remove([old.storage_path]); } catch (e) {} }
    toast(t('dsc_saved')); closeSheet(); await dscOpen();
  } catch (e) { toast(String((e && e.message) || e), true); }
}
async function dscView(path){
  try {
    const { data, error } = await sb.storage.from(DSC_BUCKET).createSignedUrl(path, 600);
    if (error || !data || !data.signedUrl) throw (error || new Error('sign failed'));
    window.open(data.signedUrl, '_blank', 'noopener');
  } catch (e) { toast(t('dsc_view_fail'), true); }
}
async function dscDelete(id){
  try {
    if (!await uiConfirm(t('dsc_del_q'))) return;
    const { data } = await sb.from('rider_documents').select('storage_path,status').eq('id', id).maybeSingle();
    if (!data) throw new Error('not found');
    if (!dscCanDelete(data)) throw new Error('verified cannot be deleted');
    try { await sb.storage.from(DSC_BUCKET).remove([data.storage_path]); } catch (e) {}
    const { error } = await sb.from('rider_documents').delete().eq('id', id);
    if (error) throw error;
    toast(t('dsc_deleted')); await dscLoad();
  } catch (e) { toast(String((e && e.message) || e), true); }
}

// SOS already exists (rider_sos RPC + sos_alerts + admin list). This block
// COMPLETES it: rider-side resolve, Share Trip, RideCheck, emergency contact.
// Pure, harness-tested: sftyNext(now, trip, st), sftyShareText(...).
const SFTY_CHECK_MS = 30 * 60 * 1000, SFTY_GRACE_MS = 10 * 60 * 1000;
function sftyState(){ if (!state.sfty){ const saved = ls.get('sfty_sos', null); state.sfty = { orderId:null, anchor:0, nextDue:0, promptAt:0, escAt:0, promptOpen:false, sosAt:(saved && saved.at) || 0, sosOrder:(saved && saved.order) || null }; } return state.sfty; }
function sftyActiveTrip(){ return (state.mine || []).find(o => ['rider_assigned','picked_up'].includes(o.status)) || null; }
function sftyNext(now, trip, st){
  if (!trip) return { action:'reset' };
  if (st.orderId !== trip.id) return { action:'arm' };
  if (st.promptAt && st.escAt !== st.promptAt && now >= st.promptAt + SFTY_GRACE_MS) return { action:'escalate', nextDue: now + SFTY_CHECK_MS };
  if (!st.promptAt && now >= st.nextDue) return { action:'prompt', at: now };
  return { action:'none' };
}
function sftyShareText(name, shop, url, timeStr){ return t('sfty_share_msg', { n:name, s:shop, u:url }) + '\n' + t('sfty_share_note', { t:timeStr }); }

  return `<button class="btn ghost small" style="width:100%;margin-top:7px" onclick="A.sftyShareTrip('${o.id}')">📤 ${t('sfty_share_trip')}</button>${sosOn ? `<div class="note" style="background:rgba(180,22,27,.12);margin-top:8px">${t('sfty_sos_active')}</div><button class="btn gold small" style="width:100%;margin-top:7px" onclick="A.sftySosResolve()">${t('sfty_sos_oknow')}</button>` : ''}${nxt ? `<div class="muted" style="font-size:13px;margin-top:6px">🛟 ${t('sfty_next_check', { m:nxt })}</div>` : ''}`;

function sftyRcTick(){
  try {
    const st = sftyState(); const trip = sftyActiveTrip();
    const r = sftyNext(Date.now(), trip, st);
    if (r.action === 'reset'){ if (st.promptOpen) closeSheet(); if (st.orderId){ try { localStorage.removeItem('sfty_anchor_' + st.orderId); } catch(e){} } st.orderId = null; st.promptAt = 0; st.escAt = 0; st.promptOpen = false; return; }
    if (r.action === 'arm'){ st.orderId = trip.id; const saved = ls.get('sfty_anchor_' + trip.id, 0); st.anchor = (saved && saved <= Date.now()) ? saved : Date.now(); if (!saved) ls.set('sfty_anchor_' + trip.id, st.anchor); st.nextDue = st.anchor + SFTY_CHECK_MS; st.promptAt = 0; st.escAt = 0; return; }

  async capture(mode){
    const v = $('camv'), btn = $('camBtn'), fs = $('fstate'), ring = $('ring');
    if (!v || !btn) return;
    if (btn.dataset.retake){ delete btn.dataset.retake; v.style.display = ''; $('camimg').style.display = 'none'; ring.className = 'ring'; fs.textContent = ''; btn.textContent = t('take_photo'); return; }
    btn.disabled = true; fs.className = 'facestate'; fs.textContent = t('loading');
    try {
      const canvas = snap(v);
      $('camimg').src = canvas.toDataURL('image/jpeg', 0.7); $('camimg').style.display = ''; v.style.display = 'none';
      const res = await analyse(canvas);
      const retake = msg => { ring.className = 'ring bad'; fs.className = 'facestate red'; fs.textContent = msg; btn.dataset.retake = '1'; btn.textContent = t('retake'); btn.disabled = false; };
      if (res.err) return retake(t(res.err));
      if (mode === 'register'){
        const path = await uploadSelfie(canvas, 'face');
        need(await sb.from('riders').update({ face_descriptor:res.descriptor, face_photo_path:path }).eq('id', state.rider.id));
        state.rider.face_descriptor = res.descriptor; state.rider.face_photo_path = path;
        ring.className = 'ring ok'; fs.className = 'facestate'; fs.style.color = 'var(--brand)'; fs.textContent = t('face_saved');
        toast(t('face_saved'));
        const wasGate = !!(state.user && ls.get('kh_facegate_' + state.user.id, null));
        passGate();
        setTimeout(() => { closeOverlay(); if (wasGate || state.tab === 'acct') renderTab(); else openCamera('duty'); }, 900);
        return;
      }
      const dist = faceapi.euclideanDistance(res.descriptor, state.rider.face_descriptor);
      const ok = dist <= threshold();
      if (mode === 'login' || mode === 'off'){
        if (!ok) return retake(t('face_nomatch'));
        ring.className = 'ring ok'; fs.style.color = 'var(--brand)'; fs.textContent = t('face_match');
        if (mode === 'login'){ passGate(); setTimeout(() => { closeOverlay(); toast(t('face_welcome')); }, 700); return; }
        closeOverlay(); await A.endDutyNow(); return;
      }
      if (!ok && requireSelfie()) return retake(t('face_nomatch'));
      ring.className = 'ring ' + (ok ? 'ok' : 'bad'); fs.style.color = ok ? 'var(--brand)' : ''; fs.textContent = ok ? t('face_match') : t('face_nomatch');
      const path = await uploadSelfie(canvas, 'shift');
      await A.beginShift(path, Math.round(dist * 1000) / 1000, ok);
    } catch (e) {
      logErr(e); fs.className = 'facestate red'; fs.textContent = (e && e.message) || t('error');
      btn.dataset.retake = '1'; btn.textContent = t('retake'); btn.disabled = false;
    }
  },

// ================= FCM PUSH (Capacitor only; web par no-op) =================
// App khulne par login user ka FCM token device_tokens mein save hota hai,
// So the Admin app can send a push. No error ever blocks login.
function handleCallPush(d){
  try {
    if (!d || d.type !== 'call') return false;
    const rec = { thread: d.thread, orderId: d.orderId || null, ts: Date.now() };
    try { localStorage.setItem('dera_pending_call', JSON.stringify(rec)); } catch (e) {}
    try { if (typeof Chat !== 'undefined' && Chat.consumePendingCall) Chat.consumePendingCall(); } catch (e) {}
    return true;
  } catch (e) { return false; }
}
const FCM = {
  app: 'rider',
  done: false,
  async register(uid){
    try {
      if (this.done) return; this.done = true;
      const Cap = window.Capacitor;
      const PN = Cap && Cap.Plugins && Cap.Plugins.PushNotifications;
      if (!PN || !uid) return;
      const saved = new Promise((res) => {
        try {
          PN.addListener('registration', async (tok) => {
            try {
              if (tok && tok.value) await sb.from('device_tokens').upsert({ user_id: uid, token: tok.value, platform: 'android', app: FCM.app, updated_at: new Date().toISOString() }, { onConflict: 'token' });
            } catch (e) {}
            res();
          });
          PN.addListener('registrationError', () => res());
        } catch (e) { res(); }
        setTimeout(res, 10000);
      });
      const perm = await PN.requestPermissions();
      if (!perm || perm.receive === 'denied') return;
      await PN.register();
      await saved;
      try {
        PN.addListener('pushNotificationReceived', async (n) => {
          try {
            try { if (n && n.data) handleCallPush(n.data); } catch (e) {}
            const LN = Cap.Plugins.LocalNotifications;
            if (!LN || !n) return;
            await LN.schedule({ notifications: [{ id: Date.now() % 2147483647, title: n.title || 'Dera', body: n.body || '', extra: n.data || {} }] });
          } catch (e) {}
        });
      } catch (e) {}
      try {
        PN.addListener('pushNotificationActionPerformed', (a) => {
          try {
            try { if (a && a.notification && a.notification.data) handleCallPush(a.notification.data); } catch (e) {}
            const p = a && a.notification && a.notification.data && a.notification.data.path;
            if (p) location.hash = p;
          } catch (e) {}
        });
      } catch (e) {}
    } catch (e) {}
  }
};

// ================= 2FA (Feature 14: native Supabase Auth TOTP) =================
// Factors live in Supabase Auth, never in app tables. Only a VERIFIED factor
// gates logins; an enrolled-but-unverified factor never does. 2FA is
// account-level (all devices), not device-level. It protects against a
// stolen password only — never claim more than that.
function tfaL(k){ return t(k); }
function tfaHasApi(){ try { return !!(sb.auth && sb.auth.mfa && typeof sb.auth.mfa.listFactors === 'function' && typeof sb.auth.mfa.getAuthenticatorAssuranceLevel === 'function'); } catch(e){ return false; } }
/* ---- Communication mode (cmm): preferred contact method ---- */
const CMM_MODES = ['chat','call','whatsapp'];
function cmmValid(m){ return CMM_MODES.indexOf(m) >= 0 ? m : null; }
function cmmLabel(m){ if(m==='chat') return t('cmm_chat'); if(m==='call') return t('cmm_call'); if(m==='whatsapp') return t('cmm_wa'); return ''; }
function cmmOrder(items, mode){
  const pref = cmmValid(mode);
  if(!pref) return items.slice();
  const first = [], rest = [];
  for(const it of items){ (it.ch === pref ? first : rest).push(it); }
  return first.concat(rest);
}

async function tfaStatus(){

  } catch(e){ return { api:true, verified:[], unverified:[], error:e }; }
}

function tfaPrompt(factorId){
  return new Promise(resolve => {
    tfaOverlay(tfaGateBox(tfaL('tfa_gate_title'), tfaL('tfa_gate_sub'),
      `<input id="tfaGateCode" inputmode="numeric" autocomplete="one-time-code" placeholder="${tfaL('tfa_code')}" style="width:100%;padding:12px;font-size:18px;letter-spacing:4px;text-align:center"><div id="tfaGateMsg" class="muted" style="font-size:13px;margin-top:8px;min-height:18px"></div><button id="tfaGateBtn" class="btn" style="width:100%;margin-top:10px">${tfaL('tfa_continue')}</button><button id="tfaGateOut" class="btn ghost" style="width:100%;margin-top:8px">${tfaL('tfa_signout')}</button>`));

async function tfaGate(){
  if (!tfaHasApi()) return true;
  let st; try { st = await tfaStatus(); } catch(e){ st = { error:e }; }
  if (st.error) return await tfaStatusErrorGate();
  if (!st.verified || !st.verified.length) return true;
  let aal = null;
  try { const r = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if (r.error) throw r.error; aal = r.data; } catch(e){ return await tfaStatusErrorGate(); }
  if (aal && aal.currentLevel === 'aal2') return true;
  return await tfaPrompt(st.verified[0].id);
}
async function tfaSheet(){
  const st = await tfaStatus();
  if (!st.api){ openSheet(tfaL('tfa_title'), `<p class="muted">${tfaL('tfa_unavailable')}</p>`); return; }
  if (st.error){ openSheet(tfaL('tfa_title'), `<p class="muted">${tfaL('tfa_status_err')}</p><button class="btn" style="width:100%" onclick="tfaSheet()">${tfaL('tfa_retry')}</button>`); return; }

    openSheet(tfaL('tfa_title'), `<div class="box"><b>🔐 ${tfaL('tfa_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${tfaL('tfa_on')}</p><button class="btn warn" style="width:100%" onclick="tfaDisableAsk()">${tfaL('tfa_disable')}</button></div><p class="muted" style="font-size:13px">${tfaL('tfa_recovery')}</p>`);

}
async function tfaEnrollStart(){
  try {
    const st = await tfaStatus();
    if (st.verified.length) return tfaSheet();
    for (const f of (st.unverified || [])){ try { await sb.auth.mfa.unenroll({ factorId: f.id }); } catch(e){} }
    const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp' });
    if (error) throw error;
    state.tfaPending = { id: data.id, secret: (data.totp && data.totp.secret) || '', qr: (data.totp && data.totp.qr_code) || '' };

async function tfaCancelEnroll(){

async function tfaVerifyEnroll(){
  const p = state.tfaPending; if (!p) return tfaSheet();
  const inp = document.getElementById('tfaEnrollCode'), msg = document.getElementById('tfaMsg');
  const code = (inp && inp.value || '').trim();

    if (chErr) throw chErr;

    if (error) throw error;

function tfaDisableAsk(){

// ================= BIOMETRICS LOGIN (Feature 15: native Supabase passkeys, rider) =================
// Mirrors Feature 6 customer passkeys (secHasPasskeyApi / secRegisterPasskey /
// secDeletePasskey / secPasskeySignIn): the device's own biometric unlock
// (fingerprint / face / device PIN) protects a Supabase-verified WebAuthn
// passkey. No fingerprint image or biometric data ever leaves this phone;
// nothing biometric is sent to Dera or Supabase. Passkeys live in Supabase
// Auth, not in app tables (zero migration). Sign-in flows through the
// existing afterLogin(), whose first statement is tfaGate(), so a rider
// with 2FA enabled still gets the code prompt after a passkey sign-in.
function bioHasApi(authObj){ return !!(authObj && typeof authObj.signInWithPasskey === 'function' && typeof authObj.registerPasskey === 'function'); }
function bioErrKind(err){
  const code = String((err && err.code) || '');
  const msg = String((err && err.message) || '');
  if (code === 'passkey_disabled') return 'disabled';
  if (code === 'webauthn_credential_exists') return 'exists';
  if (/credential_not_found|not found|no passkey/i.test(msg)) return 'notfound';
  return '';
}
function bioErrText(e){
  const kind = bioErrKind(e);
  if (kind === 'disabled') return t('bio_disabled');
  if (kind === 'exists') return t('bio_exists');
  if (kind === 'notfound') return t('bio_no_device');
  return String((e && e.message) || '') || t('error');
}
// Device-local hint: the login screen has no session, so passkey.list()
// cannot run there. Registration sets this flag; deleting the last passkey
// clears it. The server is source of truth on use: a stale flag only yields
// the honest "no passkey on this phone" message, which clears the flag.
function bioFlag(){ try { return ls.get('kh_rd_bio', 0) === 1; } catch (e) { return false; } }
function bioSetFlag(v){ try { ls.set('kh_rd_bio', v ? 1 : 0); } catch (e) {} }
function bioLoginBtnHtml(){
  if (state.authMode === 'signup') return '';
  if (!bioHasApi(sb.auth) || !bioFlag()) return '';
  return `<button class="btn ghost" style="width:100%;margin-top:10px" onclick="bioSignIn()">👆 ${t('bio_signin')}</button><div class="err-text" id="bioMsg"></div>`;
}
async function bioSignIn(){
  const msg = $('bioMsg');
  if (!bioHasApi(sb.auth)){ if (msg) msg.textContent = t('bio_unavailable'); return; }
  if (msg) msg.textContent = '';
  try {
    const { data, error } = await sb.auth.signInWithPasskey();
    if (error) throw error;
    if (!data || !data.user) throw new Error('no session');
    await afterLogin(data.user);
  } catch (e) {
    logErr(e);
    if (bioErrKind(e) === 'notfound') bioSetFlag(0);
    const text = bioErrText(e);
    if (msg) msg.textContent = text; else toast(text, true);
  }
}
function bioWhen(s){ try { return new Date(s).toLocaleString(); } catch (e) { return String(s); } }
async function bioSheet(){
  if (!bioHasApi(sb.auth)){ openSheet(t('bio_title'), `<p class="muted">${t('bio_unavailable')}</p>`); return; }
  let passkeys = null, pkErr = null;
  try {
    const { data, error } = await sb.auth.passkey.list();
    if (error) throw error;
    passkeys = Array.isArray(data) ? data : ((data && data.passkeys) || []);
  } catch (e) { pkErr = e; }
  const rows = passkeys === null ? '' : (passkeys.length ? passkeys.map(p => {
    const name = p.friendly_name || p.friendlyName || 'Passkey';
    const last = p.last_used_at || p.lastUsedAt;
    return `<div class="menu-row"><span>👆 <b>${esc(String(name))}</b><small class="muted" style="display:block;font-size:12px">${last ? t('bio_last_used') + ': ' + esc(bioWhen(last)) : ''}</small></span><button class="btn ghost small" onclick="bioDelete('${esc(String(p.id))}')">${t('bio_remove')}</button></div>`;
  }).join('') : `<div class="empty">${t('bio_none')}</div>`);
  openSheet(t('bio_title'), `<div class="box"><b>👆 ${t('bio_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${t('bio_sub')}</p>${pkErr ? `<p class="muted" style="font-size:13px">${esc(bioErrText(pkErr))}</p>` : rows}<div style="margin-top:10px"><button class="btn" style="width:100%" onclick="bioRegister()">${t('bio_register')}</button></div></div>`);
}
async function bioRegister(){
  if (!bioHasApi(sb.auth)) return toast(t('bio_unavailable'), true);
  try {
    const { error } = await sb.auth.registerPasskey();
    if (error) throw error;
    bioSetFlag(1);
    toast(t('bio_registered')); closeSheet(); await bioSheet();
  } catch (e) { logErr(e); toast(bioErrText(e), true); }
}
async function bioDelete(id){
  if (!window.confirm(t('bio_confirm_delete'))) return;
  try {
    if (!sb.auth.passkey || typeof sb.auth.passkey.delete !== 'function') return toast(t('bio_unavailable'), true);
    const { error } = await sb.auth.passkey.delete({ passkeyId: id });
    if (error) throw error;
    toast(t('bio_deleted'));
    try {
      const { data } = await sb.auth.passkey.list();
      const left = Array.isArray(data) ? data : ((data && data.passkeys) || []);
      if (!left.length) bioSetFlag(0);
    } catch (e) { /* flag stays; server is source of truth on next sign-in */ }
    closeSheet(); await bioSheet();
  } catch (e) { logErr(e); toast(bioErrText(e), true); }
}

    ur:{ agree:'اکاؤنٹ بنا کر آپ ہماری {t} اور {p} سے اتفاق کرتے ہیں۔', terms:'شرائط', privacy:'پرائیویسی پالیسی', links:'پرائیویسی پالیسی اور شرائط',
         del:'میرا اکاؤنٹ ختم کریں', del_q:'اکاؤنٹ ختم کریں؟ آپ کی ذاتی معلومات مٹا دی جائیں گی۔ پرانے آرڈر آپ کے نام کے بغیر ریکارڈ میں رہیں گے۔ یہ واپس نہیں ہو سکتا۔',
         del_reason:'آپ کیوں جا رہے ہیں؟ (اختیاری)', del_done:'درخواست بھیج دی گئی۔ Dera سات دن میں اکاؤنٹ ختم کر دے گا۔' }
  };
  const tt = (lang, k) => L[lang === 'ur' ? 'ur' : 'en'][k];
  const url = (lang, part) => 'legal.html?lang=' + (lang === 'ur' ? 'ur' : 'en') + '#' + part;
  function agree(lang){
    return `<div class="muted" style="font-size:13px;margin-top:10px;text-align:center">${tt(lang, 'agree').replace('{t}', `<a href="${url(lang, 'terms')}" target="_blank" rel="noopener">${tt(lang, 'terms')}</a>`).replace('{p}', `<a href="${url(lang, 'privacy')}" target="_blank" rel="noopener">${tt(lang, 'privacy')}</a>`)}</div>`;
  }
  function links(lang){
    return `<a class="btn ghost" style="margin-bottom:10px;display:block;text-align:center;text-decoration:none" href="${url(lang, 'privacy')}" target="_blank" rel="noopener">📄 ${tt(lang, 'links')}</a>`;
  }
  let cfg = null;
  function init(c){ cfg = c; }
  async function del(){
    const lang = cfg.lang();
    if (!await uiConfirm(tt(lang, 'del_q'))) return;
    const why = await uiPrompt(tt(lang, 'del_reason'), ''); if (why === null) return;
    const { error } = await cfg.sb.rpc('request_account_deletion', { p_note:why || null });
    if (error) return cfg.toast(error.message, true);

  }
  return { init, agree, links, del };
})();

// ================= BACK BUTTON (same code in all four apps) =================
// Phone back button: closes the open popup first, then goes to the main tab, then asks "press back again to exit".
const BackNav = (() => {
  let cfg = null, pushed = 0, internal = 0, armed = false, armTimer = null, pushHash = [];
  const present = () => cfg.overlays.filter(([sel]) => document.querySelector(sel));
  function onMutate(){
    const n = present().length;
    while (pushed < n){ pushHash.push(location.hash); history.pushState({ wmov:pushed + 1 }, '', location.href); pushed++; }
    if (pushed > n){
      const extra = pushed - n; pushed = n;
      const h = pushHash.splice(n).pop();
      // Closed by a button (same page): remove our extra history steps. Closed because the page changed: leave history alone.
      if (h === location.hash && history.state && history.state.wmov){ internal++; history.go(-extra); }
    }
  }
  function guard(){ history.pushState({ wmg:1 }, '', location.href); }
  function onPop(ev){
    if (internal > 0){ internal--; return; }
    const st = ev.state || {};
    const open = present();
    if (open.length){
      // user pressed back while a popup is open: close the top one
      pushed = Math.max(0, pushed - 1); pushHash.pop();
      const [sel, close] = open[open.length - 1];
      try { close ? close() : document.querySelector(sel).remove(); } catch (e) { const el = document.querySelector(sel); if (el) el.remove(); }
      return;
    }
    if (st.wmov){ internal++; history.back(); return; }         // leftover popup step: skip it
    if (!st.wmb) return;                                          // normal page change (hash links) is handled by the app
    if (cfg.back && cfg.back()){ guard(); return; }               // went to main tab / home
    if (armed){ return; }                                         // second press: nothing left, phone closes the app
    armed = true; cfg.toast(cfg.exitMsg());
    clearTimeout(armTimer); armTimer = setTimeout(() => { armed = false; if (history.state && history.state.wmb) guard(); }, 2200);
  }
  function init(c){
    if (cfg) return; cfg = c;
    history.replaceState({ wmb:1 }, '', location.href); guard();
    window.addEventListener('popstate', onPop);
    new MutationObserver(onMutate).observe(document.body, { childList:true });
  }
  return { init };
})();

// ================= REPORTS: Excel and PDF (Shop app and Admin) =================
const Report = (() => {
  let xlsxP = null;
  function loadXlsx(){
    if (window.XLSX) return Promise.resolve(window.XLSX);
    if (!xlsxP) xlsxP = new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload = () => res(window.XLSX); s.onerror = () => { xlsxP = null; rej(new Error('xlsx')); }; document.head.appendChild(s); });
    return xlsxP;
  }
  function download(blob, name){ const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); }
  // sheets: [{ name, rows:[[header...], [cells...]] }]
  async function excel(file, sheets){
    try {
      const X = await loadXlsx(); const wb = X.utils.book_new();
      sheets.forEach(sh => { const ws = X.utils.aoa_to_sheet(sh.rows); ws['!cols'] = (sh.rows[0] || []).map((_, i) => ({ wch:Math.min(40, Math.max(10, ...sh.rows.map(r => String(r[i] ?? '').length + 2))) })); X.utils.book_append_sheet(wb, ws, sh.name.slice(0, 31)); });
      X.writeFile(wb, file + '.xlsx');
    } catch (e) {
      // Fallback: CSV opens in Excel too
      const sh = sheets[0]; const csv = sh.rows.map(r => r.map(c => { const v = String(c ?? ''); return /[",\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }).join(',')).join('\n');
      download(new Blob(['﻿' + csv], { type:'text/csv;charset=utf-8' }), file + '.csv');
    }
  }
  const esc2 = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  // Printable page: title, subtitle, blocks of { heading, rows:[[label, value]] } and optional table { head:[], rows:[[]] }
  function pdf(o){
    const old = document.getElementById('rptWrap'); if (old) old.remove();
    const w = document.createElement('div'); w.id = 'rptWrap';
    w.style.cssText = 'position:fixed;inset:0;z-index:9500;background:rgba(0,0,0,.5);overflow:auto;padding:16px';
    const kv = rows => rows.map(([a, b, bold]) => `<tr${bold ? ' style="font-weight:800;border-top:2px solid #111"' : ''}><td>${esc2(a)}</td><td style="text-align:right">${esc2(b)}</td></tr>`).join('');
    const tbl = t => `<table class="rt"><thead><tr>${t.head.map(h => `<th>${esc2(h)}</th>`).join('')}</tr></thead><tbody>${t.rows.map(r => `<tr>${r.map((c, i) => `<td${i >= (t.numFrom ?? 99) ? ' style="text-align:right"' : ''}>${esc2(c)}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
    w.innerHTML = `<style>
      #rptWrap .pg{max-width:800px;overflow-wrap:anywhere;margin:0 auto;background:#fff;color:#111;border-radius:12px;padding:24px;font:14px/1.5 system-ui,sans-serif}
      #rptWrap h1{margin:0;font-size:22px} #rptWrap h2{font-size:16px;margin:18px 0 6px}
      #rptWrap table{width:100%;border-collapse:collapse} #rptWrap td,#rptWrap th{padding:5px 6px;border-bottom:1px solid #ddd;text-align:left;vertical-align:top}
      #rptWrap .rt{font-size:12px;min-width:520px} #rptWrap .rt th{white-space:nowrap} #rptWrap .rt th{background:#f0f3ee}
      #rptWrap .nb{max-width:800px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:10px}
      @media (max-width:520px){#rptWrap{padding:10px}#rptWrap .pg{padding:16px}#rptWrap h1{font-size:19px}}
      @media print{#rptWrap .rt{min-width:0}body>*:not(#rptWrap){display:none!important}#rptWrap{position:static!important;background:#fff!important;padding:0!important;overflow:visible!important}#rptWrap .nb{display:none!important}#rptWrap .pg{border-radius:0;padding:0}}
    </style>
    <div class="pg"><div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px"><div><h1>${esc2(o.title)}</h1><div style="color:#555">${esc2(o.subtitle || '')}</div></div>
      <div style="text-align:right"><b style="font-size:18px">Dera<span style="color:#F2A900">.</span></b><div style="color:#555;font-size:12px">Kallar Kahar · ${esc2(new Date().toLocaleString('en-GB', { day:'numeric', month:'short', year:'numeric', hour:'2-digit', minute:'2-digit' }))}</div></div></div>
      ${(o.blocks || []).map(b => `<h2>${esc2(b.heading)}</h2><table>${kv(b.rows)}</table>`).join('')}
      ${o.table ? `<h2>${esc2(o.table.heading || '')}</h2><div style="overflow-x:auto;-webkit-overflow-scrolling:touch">${tbl(o.table)}</div>` : ''}
      ${o.note ? `<p style="color:#555;font-size:12px;margin-top:16px">${esc2(o.note)}</p>` : ''}</div>
    <div class="nb"><button class="btn" onclick="window.print()">${esc2(o.printLabel || 'Print or save as PDF')}</button><button class="btn ghost" style="background:#fff" onclick="document.getElementById('rptWrap').remove()">${esc2(o.closeLabel || 'Close')}</button></div>`;
    document.body.appendChild(w);
  }
  return { excel, pdf };
})();
// ================= PAYMENT RECEIPTS (Admin, Shop and Rider apps) =================
// Shows each payment as a row; tap a row to see a full receipt (time, method, transaction ID, who paid, note) that can be printed or saved as PDF.
const Receipt = (() => {
  const M = { cash:['💵', 'Cash', 'نقد'], jazzcash:['📱', 'JazzCash', 'جاز کیش'], easypaisa:['📱', 'Easypaisa', 'ایزی پیسہ'], bank:['🏦', 'Bank transfer', 'بینک ٹرانسفر'], other:['🧾', 'Other', 'دیگر'] };
  const W = {
    en:{ receipt:'Payment receipt', deposit:'Cash deposit receipt', no:'Receipt no.', amount:'Amount', on:'Paid on', got_on:'Received on', method:'Payment method', ref:'Transaction ID', by:'Paid by', to:'Paid to', from:'Received from', recv_by:'Received by', period:'For orders', orders:'Orders', note:'Note', status:'Status', paid:'Paid ✓', recv:'Received ✓', print:'Print or save as PDF', close:'Close', n_orders:'orders', details:'Payment details', bd:'Pay breakdown', salary:'Monthly salary', delivery:'Delivery pay + tips', overtime:'Overtime', bonus:'Bonus', fines:'Fines', id_fee:'Rider ID fee (monthly)', month_pay:'Month pay', paid_before:'Paid before', this_pay:'This payment', left:'Still to pay after this', shop_earning:'Shop earning', shop_fee:'Monthly fee', monthly:'monthly', once:'one time', inst:'installment {k} of {n}', foot:'This receipt is made by the Dera app. Keep it for your records.' },
    ur:{ receipt:'ادائیگی کی رسید', deposit:'نقد جمع کرانے کی رسید', no:'رسید نمبر', amount:'رقم', on:'ادائیگی کا وقت', got_on:'وصولی کا وقت', method:'طریقہ', ref:'ٹرانزیکشن آئی ڈی', by:'ادا کرنے والا', to:'وصول کنندہ', from:'جمع کرانے والا', recv_by:'وصول کرنے والا', period:'آرڈرز کی مدت', orders:'آرڈرز', note:'نوٹ', status:'حالت', paid:'ادا ہو گیا ✓', recv:'وصول ہو گیا ✓', print:'پرنٹ یا PDF محفوظ کریں', close:'بند کریں', n_orders:'آرڈرز', details:'ادائیگی کی تفصیل', bd:'تنخواہ کی تفصیل', salary:'ماہانہ تنخواہ', delivery:'ڈیلیوری کی کمائی + ٹپ', overtime:'اوور ٹائم', bonus:'بونس', fines:'جرمانے', id_fee:'رائیڈر آئی ڈی فیس (ماہانہ)', month_pay:'مہینے کی تنخواہ', paid_before:'پہلے ادا ہوا', this_pay:'یہ ادائیگی', left:'اس کے بعد باقی', shop_earning:'دکان کی کمائی', shop_fee:'ماہانہ فیس', monthly:'ماہانہ', once:'ایک بار', inst:'قسط {k} از {n}', foot:'یہ رسید Dera ایپ نے بنائی ہے۔ اپنے ریکارڈ کے لیے رکھیں۔' }
  };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  const rs = n => 'Rs ' + Math.round(Number(n) || 0).toLocaleString('en-US');
  const method = (m, ur) => { const x = M[m] || M.other; return x[0] + ' ' + (ur ? x[2] : x[1]); };
  const no = n => '#' + String(n || 0).padStart(5, '0');
  const full = ts => new Date(ts).toLocaleString('en-GB', { weekday:'short', day:'numeric', month:'short', year:'numeric', hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Karachi' });
  const short = ts => new Date(ts).toLocaleString('en-GB', { day:'numeric', month:'short', hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Karachi' });
  const day = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' });
  const dm = d => new Date(d + 'T00:00:00').toLocaleDateString('en-GB', { day:'numeric', month:'short' });
  const iso = x => x ? '\u2066' + x + '\u2069' : '';   // keeps dates in the right order in Urdu
  const period = p => p.period_start ? iso(p.period_start === p.period_end || !p.period_end ? day(p.period_start) : day(p.period_start) + ' – ' + day(p.period_end)) : '';
  const reg = {};
  let styled = false;
  function style(){
    if (styled) return; styled = true;
    const s = document.createElement('style');
    s.textContent = `.rcpt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:start;background:var(--surface,#fff);border:1px solid var(--line,#e2e8e1);border-radius:16px;padding:12px;margin:0 0 8px;cursor:pointer;color:inherit;font:inherit}
      .rcpt:active{transform:scale(.99)}
      .rcpt .ri{width:40px;height:40px;border-radius:12px;background:var(--soft,#e8f3ec);display:grid;place-items:center;font-size:20px;flex:none}
      .rcpt .rm{flex:1;min-width:0}.rcpt .rm b{font-size:16px}
      .rcpt .rs{font-size:13px;color:var(--muted,#64736a);line-height:1.45;margin-top:2px}
      .rcpt .rn{font-size:13px;margin-top:4px;background:var(--field,#f3f6f2);border-radius:8px;padding:4px 8px;display:inline-block;max-width:100%;overflow-wrap:anywhere}
      .rcpt .rt{font-size:12px;color:var(--muted,#64736a);text-align:end;flex:none;white-space:nowrap}
      .rcpt .rt u{display:block;text-decoration:none;color:var(--green,#0e7a4d);font-weight:700;margin-top:6px}`;
    document.head.appendChild(s);
  }
  // p: payouts or cash_handovers row. o: { kind:'payout'|'handover', ur:bool, to:'Shop or rider name' }
  function row(p, o){
    style(); o = o || {}; reg[p.id] = { p, o };
    const L = W[o.ur ? 'ur' : 'en'];
    const per = p.period_start ? (p.period_end && p.period_end !== p.period_start ? dm(p.period_start) + ' – ' + dm(p.period_end) : dm(p.period_start)) : '';
    const sub = [per ? `<bdi dir="ltr">${esc(per)}</bdi>` : '', esc(method(p.method, o.ur)), p.orders_count ? `<bdi>${p.orders_count} ${esc(L.n_orders)}</bdi>` : ''].filter(Boolean).join(' · ');
    return `<button type="button" class="rcpt" onclick="Receipt.open('${p.id}')"><span class="ri">${(M[p.method] || M.other)[0]}</span>
      <span class="rm"><b>${rs(p.amount)}</b><div class="rs">${sub}${p.reference ? '<br>' + esc(L.ref) + ': <bdi dir="ltr">' + esc(p.reference) + '</bdi>' : ''}</div>${p.note ? `<div class="rn">📝 ${esc(p.note)}</div>` : ''}</span>
      <span class="rt"><bdi dir="ltr">${esc(short(p.created_at))}</bdi><u>${o.ur ? 'رسید ›' : 'Receipt ›'}</u></span></button>`;
  }
  function list(rows, o, empty){ return (rows || []).map(p => row(p, o)).join('') || `<div class="empty">${esc(empty || '')}</div>`; }
  function open(id){
    const r = reg[id]; if (!r) return; const { p, o } = r; const L = W[o.ur ? 'ur' : 'en'];
    const dep = o.kind === 'handover';
    const rows = [[L.no, iso(no(p.receipt_no))], [L.amount, rs(p.amount), true], [dep ? L.got_on : L.on, iso(full(p.created_at))], [L.method, method(p.method, o.ur)]];
    if (p.reference) rows.push([L.ref, iso(p.reference)]);
    if (dep){ rows.push([L.from, o.to || ''], [L.recv_by, p.received_by_name || 'Dera']); }
    else { rows.push([L.by, (p.paid_by_name || 'Dera') + ' · Dera'], [L.to, o.to || '']); }
    if (p.period_start) rows.push([L.period, period(p)]);
    if (p.orders_count) rows.push([L.orders, String(p.orders_count)]);
    rows.push([L.status, dep ? L.recv : L.paid]);
    if (p.note) rows.push([L.note, p.note]);
    const blocks = [{ heading:L.details, rows }];
    const b = p.breakdown;
    if (b && Array.isArray(b.lines) && b.lines.length){
      const part = x => { if (x.kind === 'installment'){ const m = String(x.p || '').match(/(\d+) of (\d+)/); return m ? L.inst.replace('{k}', m[1]).replace('{n}', m[2]) : ''; } return x.kind === 'monthly' ? L.monthly : x.kind === 'once' ? L.once : ''; };
      const val = a => (Number(a) < 0 ? '−' : '') + rs(Math.abs(Number(a) || 0));
      const br = b.lines.map(x => [x.k === 'charge' ? '🧾 ' + x.t + (part(x) ? ' (' + part(x) + ')' : '') : (L[x.k] || x.k) + (x.m ? ' · ' + iso(new Date(String(x.m).slice(0, 10) + 'T00:00:00').toLocaleDateString('en-GB', { month:'short', year:'numeric' })) : '') + (x.n ? ' (' + x.n + ')' : ''), val(x.a)]);
      const shopPay = b.lines[0] && b.lines[0].k === 'shop_earning';
      if (!shopPay) br.push([L.month_pay, val(b.net), true]);
      if (Number(b.paid_before)) br.push([L.paid_before, rs(b.paid_before)]);
      br.push([L.this_pay, rs(p.amount), true]);
      if (!shopPay) br.push([L.left, rs(Math.max(0, Number(b.net) - Number(b.paid_before || 0) - Number(p.amount)))]);
      blocks.push({ heading:L.bd + (b.month ? ' · ' + iso(new Date(b.month + 'T00:00:00').toLocaleDateString('en-GB', { month:'long', year:'numeric' })) : ''), rows:br });
    }
    Report.pdf({ title:(dep ? L.deposit : L.receipt) + ' ' + no(p.receipt_no), subtitle:o.to || '', blocks, note:L.foot, printLabel:L.print, closeLabel:L.close });
  }
  return { row, list, open, method, M };
})();
function hideSplash(){
  pfmMark('ready');
  const sp = document.getElementById('splash');
  if (!sp || sp.dataset.done) return;
  sp.dataset.done = '1';
  const t0 = window.__splashT || Date.now();
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 900 - (Date.now() - t0)));
}

  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await afterLogin(session.user); else showAuth();
  } catch (e) { logErr(e); showAuth(t('error')); }
