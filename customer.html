<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F6F4A">
<title>Wanhar Mart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Noto+Naskh+Arabic:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#1E2B25; --muted:#66746C; --line:#DDE3DB; --soft:#EAF1EC;
  --green:#1F6F4A; --green-dark:#175539; --marigold:#F2A900; --danger:#B3261E; --deal:#D1432F;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#111A16; --surface:#1A2620; --ink:#E7EFE9; --muted:#93A59A; --line:#2B3A32; --soft:#1F3129; --green:#3FA774; --green-dark:#2F8F60; --danger:#F08A82; --deal:#F0826F; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang=ur] body{font-family:"Noto Naskh Arabic","Bricolage Grotesque",system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:var(--green);color:#fff}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.02em}
html[lang=ur] .brand{font-family:"Bricolage Grotesque",sans-serif}
.brand b{color:var(--marigold)}
.actions-top{display:flex;gap:8px;align-items:center}
.pillbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:14px}
.auth .pillbtn{border-color:var(--line);background:var(--surface);color:var(--ink)}
.searchbox{position:relative;margin-top:10px}
.searchbox input{width:100%;border:0;border-radius:12px;padding:12px 14px 12px 40px;font-size:16px;background:var(--surface);color:var(--ink)}
html[dir=rtl] .searchbox input{padding:12px 40px 12px 14px}
.searchbox svg{position:absolute;top:50%;left:12px;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
html[dir=rtl] .searchbox svg{left:auto;right:12px}
main{padding:14px 16px 120px}
h1{font-size:26px;letter-spacing:-.01em;margin:6px 0 12px;line-height:1.2}
h2{font-size:20px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2 a,h2 button{font-size:14px;color:var(--green);font-weight:700;background:none;border:0;cursor:pointer}
.muted{color:var(--muted)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.btn{display:block;width:100%;background:var(--green);color:#fff;border:0;border-radius:12px;padding:15px 16px;font-weight:700;cursor:pointer;text-align:center;font-size:17px}
.btn:active{background:var(--green-dark)}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--green)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.btn.gold{background:var(--marigold);color:#1E2B25}
.btn[disabled]{opacity:.5}
.btn.inline{display:inline-block;width:auto;padding:10px 18px}
input[type=text],input[type=password],input[type=email],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:14px 0 5px;font-weight:600;font-size:14px}
/* Home */
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.catchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;background:none;border:0;cursor:pointer;padding:0}
.catchip .ic{width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--green);overflow:hidden}
.catchip .ic img{width:100%;height:100%;object-fit:cover}
.catchip span{font-size:12px;font-weight:600;text-align:center;line-height:1.2;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hscroll .gcard{flex:none;width:150px}
.banner{border-radius:18px;background:linear-gradient(135deg,var(--green),#0F766E);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;overflow:hidden}
.banner b{font-size:22px;display:block;line-height:1.2}
.banner .big{font-size:42px;font-weight:800;color:var(--marigold);flex:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
@media (min-width:560px){.grid2{grid-template-columns:repeat(3,1fr)}}
.gcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:block}
.gimg{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);margin-bottom:6px}
.gimg img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:6px;left:6px;background:var(--deal);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px}
html[dir=rtl] .off{left:auto;right:6px}
.gname{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.gprice{font-weight:800;margin-top:4px;color:var(--deal)}
.gprice.plain{color:var(--ink)}
.strike{text-decoration:line-through;color:var(--muted);font-weight:400;font-size:12px;margin-inline-start:4px}
.gmeta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.gmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qadd{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--green);color:#fff;border:0;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
html[dir=rtl] .qadd{right:auto;left:8px}
.heart{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:0;display:grid;place-items:center;cursor:pointer;z-index:1;color:#999;font-size:17px}
.heart.on{color:var(--deal)}
html[dir=rtl] .heart{right:auto;left:12px}
.shopcard{flex:none;width:130px;text-align:center}
.shopcard .logo{width:130px;height:90px;border-radius:14px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);position:relative}
.shopcard .logo img{width:100%;height:100%;object-fit:cover}
.shopcard .nm{font-weight:700;font-size:14px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.closedtag{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px}
.sortbar{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.chip2{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.chip2.on{background:var(--green);border-color:var(--green);color:#fff}
.rcard{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rcard.closed{opacity:.62}
.rimg{width:84px;height:84px;border-radius:14px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;font-size:30px;color:var(--muted)}
.rimg img{width:100%;height:100%;object-fit:cover}
.rbody{flex:1;min-width:0}
.rname{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rdesc{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;gap:12px;color:var(--muted);font-size:13px;margin-top:4px;flex-wrap:wrap}
.star{color:var(--marigold);font-weight:800}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--green)}
.badge.closed{background:var(--muted)}
/* Shop page */
.hero{border-radius:18px;overflow:hidden;background:var(--green);color:#fff;margin-bottom:6px}
.hero-img{height:170px;background:var(--green) center/cover no-repeat;display:grid;place-items:center;font-size:64px;font-weight:800;color:rgba(255,255,255,.55)}
.hero-info{padding:14px 16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px}
.hero-info h1{margin:0 0 4px}
.closed-note{background:var(--surface);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:12px;margin:12px 0;font-weight:600}
.cattabs{position:sticky;top:54px;z-index:4;background:var(--paper);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:6px 0 0}
.cat{margin:24px 0 4px;font-size:20px;font-weight:800;scroll-margin-top:130px}
.item{display:flex;gap:14px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.item.off-stock{opacity:.55}
.item-text{flex:1;min-width:0}
.item-name{font-weight:700}
.item-desc{color:var(--muted);font-size:14px;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-price{font-weight:700;margin-top:4px}
.item-media{position:relative;width:104px;height:100px;flex:none}
.tile{width:104px;height:84px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.ctl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}
.add{background:var(--surface);color:var(--green);border:1px solid var(--green);border-radius:999px;padding:6px 20px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.stepper{display:inline-flex;align-items:center;background:var(--green);color:#fff;border-radius:999px;overflow:hidden}
.stepper button{background:none;border:0;color:#fff;width:36px;height:34px;font-size:20px;cursor:pointer}
.stepper b{min-width:24px;text-align:center}
.soldout{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
/* Product page */
.dimg{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--line);margin-bottom:12px}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dimg .ph{width:100%;height:100%;display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--muted)}
.dprice{font-size:26px;font-weight:800;color:var(--deal)}
.dprice.plain{color:var(--ink)}
.save{display:inline-block;background:rgba(209,67,47,.12);color:var(--deal);font-weight:800;border-radius:8px;padding:2px 8px;font-size:14px;margin-inline-start:8px}
.shopstrip{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.shopstrip .thumb{width:44px;height:44px;border-radius:10px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.shopstrip .thumb img{width:100%;height:100%;object-fit:cover}
.buybar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:10px 12px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.buybar .in{display:flex;gap:10px;width:100%;max-width:616px;align-items:center}
/* Cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:none;justify-content:center;padding:0 12px 10px}
.cartbar a{display:flex;justify-content:space-between;width:100%;max-width:616px;background:var(--green);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:640px;margin:0 auto}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-weight:600;font-size:12px;color:var(--muted);border-top:3px solid transparent}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{color:var(--green);border-top-color:var(--marigold)}
.nav .cnt{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--marigold);color:#1E2B25;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
/* Cart, checkout, orders */
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:19px}
.line.disc{color:var(--deal);font-weight:700}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.cartrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cartrow:last-child{border-bottom:0}
.cartrow .thumb{width:56px;height:56px;border-radius:10px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.cartrow .thumb img{width:100%;height:100%;object-fit:cover}
.promo{display:flex;gap:8px}
.promo input{flex:1;text-transform:uppercase}
.promo button{flex:none;width:auto;padding:0 18px}
.progress{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--marigold)}
.pill{font-size:12px;font-weight:700;padding:2px 10px;border-radius:999px;color:#fff;background:var(--green)}
.pill.bad{background:var(--danger)}
.pill.wait{background:#B7791F}
.track{list-style:none;margin:16px 0;padding:0}
.track li{position:relative;display:flex;gap:14px;align-items:center;padding:0 0 22px;color:var(--muted);font-weight:600}
.track li i{width:18px;height:18px;border-radius:50%;background:var(--line);flex:none;position:relative;z-index:1}
.track li::before{content:"";position:absolute;inset-inline-start:8px;top:18px;bottom:0;width:2px;background:var(--line)}
.track li:last-child{padding-bottom:0}
.track li:last-child::before{display:none}
.track li.done{color:var(--ink)}
.track li.done i{background:var(--green)}
.track li.done::before{background:var(--green)}
.track li.now{color:var(--ink);font-size:18px}
.track li.now i{background:var(--marigold);box-shadow:0 0 0 5px rgba(242,169,0,.28)}
.statushero{background:var(--green);color:#fff;border-radius:18px;padding:18px;margin:10px 0}
.statushero b{display:block;font-size:24px;line-height:1.2}
.banner2{border-radius:12px;padding:12px;margin:12px 0;font-weight:700}
.waitwarn{background:rgba(179,38,30,.1);border:2px solid var(--danger);border-radius:14px;padding:14px;margin:12px 0}
.waitwarn .clock{font-size:30px;font-weight:800;color:var(--danger);font-variant-numeric:tabular-nums}
.alertpop .ico{width:64px;height:64px;border-radius:50%;background:rgba(179,38,30,.12);color:var(--danger);display:grid;place-items:center;font-size:32px;margin:0 auto 10px}
.alertpop .ico.ok{background:rgba(242,169,0,.2);color:#B7791F}
.alertpop p{text-align:center;font-size:18px;font-weight:700;margin:0 0 6px}
.arrived{background:var(--marigold);color:#1E2B25;border-radius:14px;padding:14px;margin:12px 0;font-weight:800;font-size:18px}
.banner2.bad{background:var(--surface);border:1px solid var(--danger);color:var(--danger)}
.orow{display:flex;gap:12px;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.orow .r{text-align:end;font-weight:700}
.orow small{display:block;color:var(--muted);font-weight:400}
.addr-item{border-bottom:1px solid var(--line);padding:12px 0}
.addr-select{display:flex;gap:12px;align-items:flex-start;cursor:pointer}
.addr-select input{margin-top:5px;width:20px;height:20px;flex:none}
.addr-actions2{display:flex;gap:18px;margin-top:8px;margin-inline-start:32px}
.stars button{background:none;border:0;font-size:32px;line-height:1;cursor:pointer;color:var(--line);padding:2px 3px}
.stars button.on{color:var(--marigold)}
.toast{position:fixed;left:50%;bottom:140px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:12px 16px;border-radius:12px;z-index:60;max-width:90%;font-weight:600;text-align:center}
.toast.err{background:var(--danger);color:#fff}
.auth{max-width:400px;margin:0 auto;padding:9vh 20px 30px}
.auth .brand{font-size:44px;color:var(--ink)}
.err-text{color:var(--danger);margin-top:12px;min-height:22px;font-weight:600}
.link{background:none;border:0;color:var(--green);text-decoration:underline;cursor:pointer;padding:12px 0;font-weight:600}
.ver{font-size:12px;color:var(--muted);font-weight:600}
.menu-row{display:flex;justify-content:space-between;align-items:center;padding:15px 2px;border-bottom:1px solid var(--line);width:100%;background:none;border-left:0;border-right:0;border-top:0;cursor:pointer;font-weight:600;text-align:start}
.sheet-back{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
.sheet-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sheet-head h3{margin:0;font-size:20px}
.x{background:none;border:0;font-size:28px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
:focus-visible{outline:3px solid var(--marigold);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>

const t = (k, v) => {
  let s = (I18N[state.lang] && I18N[state.lang][k]) || I18N.en[k] || k;
  if (v) for (const x in v) s = s.replace('{' + x + '}', v[x]);
  return s;
};
function applyLang(){ document.documentElement.lang = state.lang; document.documentElement.dir = state.lang === 'ur' ? 'rtl' : 'ltr'; }
function toast(msg, isErr){
  const el = document.createElement('div'); el.className = 'toast' + (isErr ? ' err' : ''); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}
function niceErr(e){ const m = (e && e.message) || ''; return /blocked/i.test(m) ? t('blocked') : (m || t('error')); }
async function run(fn){ try { return await fn(); } catch (e) { logErr(e); toast(niceErr(e), true); } }

// ---- Cart ----
const cartCount = () => state.cart.items.reduce((n, i) => n + i.qty, 0);
const cartSubtotal = () => state.cart.items.reduce((n, i) => n + i.price * i.qty, 0);
function saveCart(){ state.promoRes = null; ls.set('kh_cart', state.cart); updateCartUI(); }
function cartRestaurant(){ return state.restaurants.find(r => r.id === state.cart.rid); }
function cartFee(){ const r = cartRestaurant(); return num(r && r.zone ? r.zone.delivery_fee : 0); }
function cartMin(){ const r = cartRestaurant(); return num(r && r.zone ? r.zone.min_order : 0); }
const cartDiscount = () => state.promoRes && state.promoRes.ok ? num(state.promoRes.discount) : 0;

function normalizePhone(p){
  let d = String(p || '').replace(/\D/g, '');
  if (d.startsWith('92') && d.length === 12) d = '0' + d.slice(2);
  if (d.startsWith('3') && d.length === 10) d = '0' + d;
  return /^03\d{9}$/.test(d) ? d : null;
}
const isFav = id => state.favs.includes(id);

let pollTimer = null;
function stopPoll(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
const LOGIN_ROUTES = ['checkout', 'orders', 'order', 'account'];
async function route(soft){
  stopPoll();
  const h = location.hash.replace(/^#\/?/, '');
  const p = h.split('/');
  const name = p[0] || 'home';
  if (!state.user && LOGIN_ROUTES.includes(name)){ state.pending = location.hash; return showAuth(); }
  if (!$('view')) renderShell();
  currentRoute = name; highlightNav(name); updateCartUI();
  const v = $('view'); if (!v) return;
  if (!soft) v.innerHTML = `<div class="empty">${t('loading')}</div>`;
  try {
    if (name === 'home') await showHome();
    else if (name === 'shops') await showShops();
    else if (name === 'c') await showCategory(decodeURIComponent(p[1] || ''));
    else if (name === 'r') await showRestaurant(p[1]);
    else if (name === 'p') await showProduct(p[1]);
    else if (name === 'cart') await showCart();
    else if (name === 'checkout') await showCheckout();
    else if (name === 'orders') await showOrders();
    else if (name === 'order') await showOrder(p[1]);
    else if (name === 'account') await showAccount();
    else if (name === 'saved') await showSaved();
    else return nav('/');
  } catch (e) {
    logErr(e);
    if (!soft) v.innerHTML = `<div class="empty">${esc(niceErr(e))}<br><br><button class="btn inline" onclick="route()">${t('retry')}</button></div>`;
  }
  if (!soft) window.scrollTo(0, 0);
}
window.addEventListener('hashchange', () => { closeSheet(); route(); });

async function loadProducts(){

    sb.from('menu_items').select('id,name,price,compare_price,photo_url,description,restaurant_id,category_id,is_available,is_featured,created_at,category:menu_categories(name),restaurants!inner(id,name,logo_url,is_open,is_active)')

function sortProducts(list){
  const l = list.slice();
  if (state.sort === 'best') l.sort((a, b) => sold(b.id) - sold(a.id) || (b.is_featured - a.is_featured));
  if (state.sort === 'new') l.sort((a, b) => new Date(b.created_at) - new Date(a.created_at));
  if (state.sort === 'low') l.sort((a, b) => num(a.price) - num(b.price));
  if (state.sort === 'high') l.sort((a, b) => num(b.price) - num(a.price));
  return l;
}

const TRACK = ['placed','accepted','preparing','ready','picked_up','delivered'];
function trackerHtml(o){
  if (o.status === 'cancelled' || o.status === 'rejected') return `<div class="banner2 bad">${t('st_' + o.status)}${o.reject_reason ? ': ' + esc(o.reject_reason) : ''}</div>`;
  let cur = o.status === 'rider_assigned' ? 3 : TRACK.indexOf(o.status);
  if (o.status === 'delivered') cur = TRACK.length;
  return `<ol class="track">` + TRACK.map((s, i) => {
    const cls = i < cur ? 'done' : (i === cur ? 'now' : '');
    const label = (s === 'ready' && o.status === 'rider_assigned') ? t('st_rider_assigned') : t('st_' + s);
    return `<li class="${cls}"><i></i><span>${label}</span></li>`;
  }).join('') + `</ol>`;
}
function starsHtml(kind, val){ return [1, 2, 3, 4, 5].map(n => `<button type="button" class="${n <= val ? 'on' : ''}" onclick="A.setStar('${kind}',${n})" aria-label="${n}">★</button>`).join(''); }
function ratingHtml(o, review){
  if (review) return `<div class="box"><b>${t('rate_thanks')}</b><div style="font-size:24px;color:var(--marigold)">${'★'.repeat(review.restaurant_rating || 0)}</div></div>`;
  state.rate = { r:0, d:0 };
  return `<div class="box"><b>${t('rate_title')}</b>
    <div class="line" style="align-items:center"><span>${t('rate_food')}</span><span class="stars" id="stars-r">${starsHtml('r', 0)}</span></div>
    ${o.rider_id ? `<div class="line" style="align-items:center"><span>${t('rate_rider')}</span><span class="stars" id="stars-d">${starsHtml('d', 0)}</span></div>` : ''}

    <div style="margin-top:12px"><button class="btn" onclick="A.sendRating('${o.id}')">${t('rate_send')}</button></div></div>`;
}

    <div style="display:grid;gap:10px;margin-top:10px">${rider.phone ? `<a class="btn ghost" href="tel:${esc(rider.phone)}">${t('call_rider')} ${esc(rider.phone)}</a>` : ''}
    ${rider.lat ? `<a class="btn gold" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${rider.lat},${rider.lng}">${t('track_rider')}</a>` : ''}</div></div>` : '';
  const items = o.order_items.map(i => `<div class="line"><span>${i.quantity} × ${esc(i.name)}</span><span>${money(i.price * i.quantity)}</span></div>`).join('');
  const heroKey = 'hero_' + o.status;
  $('view').innerHTML = `
    ${I18N.en[heroKey] ? `<div class="statushero"><span style="opacity:.85">${esc(o.restaurant ? o.restaurant.name : '')} · #${esc(o.id.slice(-4).toUpperCase())}</span><b>${t(heroKey)}</b>${eta ? `<span style="opacity:.9">${t('ready_by', { time:eta })}</span>` : ''}</div>` : `<h1>${esc(o.restaurant ? o.restaurant.name : t('order_no'))}</h1>`}
    <div class="muted">${when(o.created_at)}</div>
    ${waitHtml}
    ${trackerHtml(o)}
    ${riderBox}
    <div class="box"><b>${t('order_items')}</b>${items}
      <div class="line"><span class="muted">${t('subtotal')}</span><span>${money(o.subtotal)}</span></div>
      <div class="line"><span class="muted">${t('delivery_fee')}</span><span>${money(o.delivery_fee)}</span></div>
      ${num(o.discount) ? `<div class="line disc"><span>${t('discount')} ${esc(o.promo_code || '')}</span><span>−${money(o.discount)}</span></div>` : ''}
      <div class="line total"><span>${t('total')}</span><span>${money(o.total)}</span></div>
      <div class="muted">${t('cod')}</div></div>
    <div class="box"><b>${t('delivered_to')}</b><div class="muted">${esc(o.address_text || '')}</div></div>
    <div style="display:grid;gap:10px;margin-top:10px">
      ${o.rider_id ? `<button class="btn ghost" onclick='Chat.open(${JSON.stringify(o.id)}, "cr", null)'>💬 ${t('chat_rider')}</button>` : ''}
      <button class="btn ghost" onclick='Chat.open(${JSON.stringify(o.id)}, "cs", null)'>💬 ${t('chat_shop')}</button>

// ================= ACTIONS =================
let searchTimer = null;
const A = {
  toggleLang(onAuth){
    state.lang = state.lang === 'ur' ? 'en' : 'ur'; ls.set('kh_lang', state.lang); applyLang();
    if (onAuth) showAuth(); else { renderShell(); route(); }
  },
  switchAuth(){ state.authMode = state.authMode === 'signup' ? 'login' : 'signup'; showAuth(); },
  async submitAuth(e){
    e.preventDefault();
    const signup = state.authMode === 'signup';
    const email = $('a_email').value.trim(); const pw = $('a_pw').value;
    const msg = $('authMsg'); msg.style.color = ''; msg.textContent = '';
    if (!email || !pw){ msg.textContent = t('enter_all'); return; }
    if (pw.length < 6){ msg.textContent = t('short_pw'); return; }
    let name = '', phone = '';
    if (signup){
      name = $('a_name').value.trim(); phone = normalizePhone($('a_phone').value);
      if (!name){ msg.textContent = t('enter_all'); return; }
      if (!phone){ msg.textContent = t('bad_phone'); return; }
    }
    const btn = $('authBtn'); btn.disabled = true; btn.textContent = t('loading');
    try {
      if (signup){
        const { data, error } = await sb.auth.signUp({ email, password:pw, options:{ data:{ full_name:name } } });
        if (error) throw error;
        if (!data.session){ state.authMode = 'login'; showAuth(t('confirm_email'), true); return; }
        await sb.from('profiles').update({ full_name:name, phone }).eq('id', data.user.id);
        await afterLogin(data.user);
      } else {
        const { data, error } = await sb.auth.signInWithPassword({ email, password:pw });
        if (error) throw error; await afterLogin(data.user);
      }
    } catch (err) {
      logErr(err);
      const m = /invalid login/i.test(err.message || '') ? t('bad_login') : (err.message || t('error'));
      const el = $('authMsg'); if (el) el.textContent = m;
      const b = $('authBtn'); if (b){ b.disabled = false; b.textContent = signup ? t('signup') : t('login'); }
    }
  },
  async logout(){
    Chat.stop(); Chat.close(); await sb.auth.signOut(); stopPoll();
    if (channel){ sb.removeChannel(channel); channel = null; }
    state.user = null; state.profile = null; state.addresses = []; state.authMode = 'login';
    replaceHash('#/'); renderShell(); route();
  },
  guestBack(){ state.pending = null; state.authMode = 'login'; replaceHash('#/'); renderShell(); route(); },
  search(v){
    state.homeQuery = v;
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      if (currentRoute === 'shops'){ showShops(); return; }
      if (currentRoute !== 'home'){ nav('/'); return; }
      const el = $('homeBody'); if (el) el.innerHTML = homeBody();
    }, 200);
  },
  setSort(s){
    state.sort = s;
    if (currentRoute === 'c') route(true); else { const el = $('homeBody'); if (el) el.innerHTML = homeBody(); }
  },
  shopSearch(v){ state.shopQuery = v; const el = $('menuBody'); if (el) el.innerHTML = menuBody(); },
  fav(id, btn){
    const i = state.favs.indexOf(id); if (i > -1) state.favs.splice(i, 1); else state.favs.push(id);
    ls.set('kh_favs', state.favs);
    document.querySelectorAll(`button.heart[onclick*="${id}"]`).forEach(b => { b.classList.toggle('on', isFav(id)); b.textContent = isFav(id) ? '♥' : '♡'; });
  },
  addToCart(it, qty){
    if (state.cart.rid && state.cart.rid !== it.restaurant_id && state.cart.items.length){
      if (!confirm(t('other_rest_msg'))) return false;
      state.cart = { rid:null, items:[], note:'' };
    }
    state.cart.rid = it.restaurant_id;
    const ex = state.cart.items.find(c => c.id === it.id);
    if (ex) ex.qty += qty; else state.cart.items.push({ id:it.id, name:it.name, price:num(it.price), qty });
    saveCart(); return true;
  },
  add(id){
    const it = getItem(id); if (!it) return;
    if (A.addToCart(it, 1)){ const c = $('ctl-' + id); if (c) c.innerHTML = ctlHtml(it); }
  },
  quickAdd(id){
    const it = state.itemsCache[id]; if (!it) return;
    if (A.addToCart(it, 1)) toast(`${it.name} ✓  ${t('view_cart')}: ${cartCount()}`);
  },
  qty(d){ state.qty = Math.max(1, Math.min(50, state.qty + d)); const el = $('qtyN'); if (el) el.textContent = state.qty; },
  addQty(id){ const it = state.itemsCache[id]; if (!it) return; if (A.addToCart(it, state.qty)){ toast(`${it.name} × ${state.qty} ✓`); state.qty = 1; const el = $('qtyN'); if (el) el.textContent = 1; } },
  chg(id, d){
    const c = state.cart.items.find(x => x.id === id); if (!c) return;
    c.qty += d;
    if (c.qty <= 0) state.cart.items = state.cart.items.filter(x => x.id !== id);
    if (!state.cart.items.length){ state.cart.rid = null; state.cart.note = ''; }
    saveCart();
    if (currentRoute === 'cart') drawCart();
    else { const it = getItem(id); const el = $('ctl-' + id); if (it && el) el.innerHTML = ctlHtml(it); }
  },
  setNote(v){ state.cart.note = v; ls.set('kh_cart', state.cart); },
  async applyPromo(){
    const code = (state.promo || '').trim(); if (!code) return;
    await run(async () => {
      const d = need(await sb.rpc('check_promo', { p_code:code, p_subtotal:cartSubtotal() }));
      state.promoRes = d && d[0] ? d[0] : { ok:false, message:t('error') }; drawCart();
    });
  },
  clearPromo(){ state.promo = ''; state.promoRes = null; drawCart(); },
  showAddrForm(){ state.editAddr = null; state.newCoords = null; openSheet(t('add_address'), addressForm()); },
  editAddress(id){
    const a = state.addresses.find(x => x.id === id); if (!a) return;
    state.editAddr = id; state.newCoords = null; openSheet(t('edit') + ': ' + (a.label || t('address')), addressForm(a));
  },
  useLocation(){
    if (!navigator.geolocation) return toast(t('location_denied'), true);
    const btn = $('locBtn'); if (btn) btn.textContent = t('loading');
    navigator.geolocation.getCurrentPosition(
      pos => { state.newCoords = { lat:pos.coords.latitude, lng:pos.coords.longitude }; const b = $('locBtn'); if (b) b.textContent = t('location_added'); },

let actx = null;
function unlockAudio(){ try { if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) {} }
document.addEventListener('pointerdown', unlockAudio);
function ring(){
  try { if (actx && actx.state === 'running'){ const o = actx.createOscillator(), g = actx.createGain(); o.type = 'square'; o.frequency.value = 880; g.gain.value = 0.15; o.connect(g); g.connect(actx.destination); o.start(); setTimeout(() => { o.frequency.value = 660; }, 200); setTimeout(() => { o.frequency.value = 880; }, 400); setTimeout(() => o.stop(), 650); } } catch (e) {}
  try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}
function askNotify(){ try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} }
function sysNotify(msg){
  try { if ('Notification' in window && Notification.permission === 'granted' && document.visibilityState !== 'visible') new Notification('Wanhar Mart', { body:msg, tag:'wm-order' }); } catch (e) {}
}
const seenAlerts = new Set(ls.get('kh_seen_alerts', []));
function markSeen(k){ seenAlerts.add(k); ls.set('kh_seen_alerts', Array.from(seenAlerts).slice(-200)); }
const alertQueue = [];
function pushAlert(key, msg, orderId, isInfo){
  if (seenAlerts.has(key) || alertQueue.some(a => a.key === key)) return;
  alertQueue.push({ key, msg, orderId, isInfo }); sysNotify(msg); ring(); showNextAlert();
}
function showNextAlert(){
  if ($('alertSheet') || !alertQueue.length) return;
  const a = alertQueue[0];
  const back = document.createElement('div'); back.className = 'sheet-back'; back.id = 'alertSheet';
  back.innerHTML = `<div class="sheet alertpop" role="alertdialog" aria-modal="true"><div class="ico ${a.isInfo ? 'ok' : ''}">${a.isInfo ? '🛵' : '!'}</div>
    <p>${esc(a.msg)}</p><div class="muted" style="text-align:center">${t('a_title')} #${esc(a.orderId.slice(-4).toUpperCase())}</div>
    <div style="display:grid;gap:10px;margin-top:14px"><span id="alertCall"></span>
    <button class="btn" onclick="A.alertOpen()">${t('open_order')}</button><button class="btn ghost" onclick="A.alertOk()">${t('ok')}</button></div></div>`;
  document.body.appendChild(back);
  sb.rpc('order_rider_info', { p_order_id:a.orderId }).then(({ data }) => { const r = data && data[0]; const el = $('alertCall'); if (el && r && r.phone) el.innerHTML = `<a class="btn gold" href="tel:${esc(r.phone)}">${t('call_rider')} ${esc(r.phone)}</a>`; });
}
function closeAlert(){ const a = alertQueue.shift(); if (a) markSeen(a.key); const el = $('alertSheet'); if (el) el.remove(); setTimeout(showNextAlert, 300); return a; }
A.alertOk = () => { closeAlert(); };
A.alertOpen = () => { const a = closeAlert(); if (a) nav('/order/' + a.orderId); };
let checking = false;
async function checkAlerts(){
  if (!state.user || checking) return; checking = true;
  try {
    const since = new Date(Date.now() - 3 * 3600e3).toISOString();
    const { data:ords } = await sb.from('orders').select('id,status,arrived_at,failed_delivery,created_at')
      .eq('customer_id', state.user.id).gte('created_at', since).order('created_at', { ascending:false }).limit(20);
    const list = ords || []; if (!list.length) return;
    list.forEach(o => {
      if (o.status === 'picked_up' && o.arrived_at) pushAlert('arr-' + o.id, t('m_arrived'), o.id, true);
      if (o.failed_delivery) pushAlert('fail-' + o.id, t('m_failed'), o.id);
    });
    const live = list.filter(o => !FINAL.includes(o.status)).map(o => o.id);
    if (live.length){
      const { data:iss } = await sb.from('order_issues').select('id,order_id,kind,reported_by').in('order_id', live).eq('status', 'open');
      (iss || []).filter(i => i.kind !== 'chat_help' && i.reported_by !== state.user.id).forEach(i => pushAlert('iss-' + i.id, t('m_' + i.kind), i.order_id));
    }
  } catch (e) { logErr(e); } finally { checking = false; }
}
setInterval(checkAlerts, 20000);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkAlerts(); });

let channel = null;
function subscribeOrders(){
  try {
    if (channel) sb.removeChannel(channel);
    channel = sb.channel('my-orders').on('postgres_changes',
      { event:'*', schema:'public', table:'orders', filter:'customer_id=eq.' + state.user.id },
      () => { checkAlerts(); if (currentRoute === 'order' || currentRoute === 'orders') route(true); }
    ).on('postgres_changes', { event:'INSERT', schema:'public', table:'order_issues' },
      () => { checkAlerts(); if (currentRoute === 'order') route(true); }
    ).subscribe();
  } catch (e) { console.warn('Live updates are off', e); }
  checkAlerts();
}

    const n = Object.values(unread).reduce((a, b) => a + b, 0);
    document.querySelectorAll('#chatN').forEach(el => { el.textContent = n; el.style.display = n ? 'grid' : 'none'; });
    if (cfg && cfg.onUnread) cfg.onUnread(n);
  }
  function init(c){
    cfg = c; stop();
    chan = sb.channel('chat-' + me()).on('postgres_changes', { event:'INSERT', schema:'public', table:'messages' }, p => onMsg(p.new)).subscribe();
    refresh();
  }
  function stop(){ if (chan){ try { sb.removeChannel(chan); } catch (x) {} chan = null; } }
  async function refresh(){
    if (!me()) return;
    const since = new Date(Date.now() - 7 * 864e5).toISOString();
    const { data } = await sb.from('messages').select('id,order_id,thread,user_id,sender_id,created_at').gte('created_at', since).neq('sender_id', me()).order('created_at', { ascending:false }).limit(400);
    unread = {};
    (data || []).forEach(m => { seenIds.add(m.id); const k = keyOf(m); if (m.created_at > seenTs(k) && (!cur || cur.k !== k)) unread[k] = (unread[k] || 0) + 1; });
    paintBadge();
  }
  function onMsg(m){
    if (!m || seenIds.has(m.id)) return; seenIds.add(m.id);
    const k = keyOf(m);
    if (cur && cur.k === k){ if (!cur.msgs.some(x => x.id === m.id)) cur.msgs.push(m); draw(); setSeen(k, m.created_at); return; }
    if (m.sender_id !== me()){
      unread[k] = (unread[k] || 0) + 1; paintBadge();
      if (cfg.ding) cfg.ding();
      if (cfg.toast) cfg.toast('💬 ' + tr('new_msg') + ': ' + fmt(m).slice(0, 70));
      if ($('inboxList')) inbox();
    }
  }
  function shell(title, inner, extra){
    close();
    const w = document.createElement('div'); w.className = 'chatwrap'; w.id = 'chatWrap';
    w.addEventListener('click', ev => { if (ev.target === w) close(); });
    w.innerHTML = `<div class="chatbox" role="dialog" aria-modal="true"><div class="chathead"><b>${e(title)}</b>${extra || ''}<button onclick="Chat.close()" aria-label="Close">&times;</button></div>${inner}</div>`;
    document.body.appendChild(w);
  }
  function close(){ cur = null; const w = document.getElementById('chatWrap'); if (w) w.remove(); }
  async function inbox(){
    const since = new Date(Date.now() - 14 * 864e5).toISOString();
    const { data } = await sb.from('messages').select('*').gte('created_at', since).order('created_at', { ascending:false }).limit(cfg.role === 'admin' ? 800 : 300);
    const groups = {};
    (data || []).forEach(m => { const k = keyOf(m); if (!groups[k]) groups[k] = { k, last:m, order_id:m.order_id, thread:m.thread, user_id:m.user_id }; });
    let names = {};
    const uids = [...new Set(Object.values(groups).filter(g => g.user_id).map(g => g.user_id))];
    if (cfg.role === 'admin' && uids.length){ const p = await sb.from('profiles').select('id,full_name,role').in('id', uids); (p.data || []).forEach(x => { names[x.id] = (x.full_name || '') + ' (' + x.role + ')'; }); }
    const rows = Object.values(groups).map(g => {
      const n = unread[g.k] || 0; const title = label(g.thread, g.order_id, names[g.user_id]);
      return `<button class="chatrow" onclick='Chat.open(${e(JSON.stringify(g.order_id))}, ${e(JSON.stringify(g.thread))}, ${e(JSON.stringify(g.user_id))}, ${e(JSON.stringify(title))})'>
        <span class="av">${g.thread.startsWith('sup') ? '★' : e(title[0])}</span>
        <span class="tx"><div><b>${e(title)}</b></div><div class="muted" style="font-size:14px">${g.last.sender_id === me() && g.last.sender_role !== 'system' ? e(tr('you')) + ': ' : ''}${e(fmt(g.last))}</div><div class="muted" style="font-size:12px">${hm(g.last.created_at)}</div></span>
        ${n ? `<span class="ub">${n}</span>` : ''}</button>`;
    }).join('');
    const sup = cfg.role === 'admin' ? '' : `<button class="chatrow" onclick='Chat.open(null, "sup", ${e(JSON.stringify(me()))}, ${e(JSON.stringify(tr('support')))})'><span class="av">★</span><span class="tx"><div><b>${e(tr('support'))}</b></div><div class="muted" style="font-size:14px">${e(tr('support_sub'))}</div></span></button>`;
    if (document.getElementById('inboxList')) document.getElementById('inboxList').innerHTML = sup + (rows || `<div class="muted" style="text-align:center;padding:30px">${e(tr('no_chats'))}</div>`);
    else shell(tr('messages'), `<div class="chatlist" id="inboxList">${sup}${rows || `<div class="muted" style="text-align:center;padding:30px">${e(tr('no_chats'))}</div>`}</div>`);
  }
  async function open(orderId, thread, userId, title){
    const k = (orderId || '') + '|' + thread + '|' + (userId || '');
    cur = { orderId, thread, userId, k, msgs:[] };
    const qk = 'q_' + cfg.role + '_' + (thread.startsWith('sup') ? 'sup' : thread);
    const quick = (L[lang()][qk] || L.en[qk] || []);
    shell(title || label(thread, orderId), `<div class="msgs" id="msgs"><div class="muted" style="text-align:center">…</div></div>
      ${quick.length ? `<div class="quick">${quick.map(q => `<button onclick='Chat.send(${e(JSON.stringify(q))})'>${e(q)}</button>`).join('')}</div>` : ''}
      <div class="chatin"><textarea id="chatText" rows="1" placeholder="${e(tr('write'))}" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();Chat.send();}"></textarea><button onclick="Chat.send()">${e(tr('send'))}</button></div>`,
      (cfg.role !== 'admin' && orderId && ['cr','cs','rs'].includes(thread)) ? `<button class="askbtn" onclick="Chat.askJoin()">🛟 ${e(tr('ask_join'))}</button>` : '');
    cur = { orderId, thread, userId, k, msgs:[] };
    let q = sb.from('messages').select('*').eq('thread', thread).order('created_at').limit(300);
    q = orderId ? q.eq('order_id', orderId) : q.is('order_id', null);
    if (!orderId) q = q.eq('user_id', userId);
    const { data } = await q;
    if (!cur || cur.k !== k) return;
    cur.msgs = data || []; cur.msgs.forEach(m => seenIds.add(m.id));
    draw();
    if (cur.msgs.length) setSeen(k, cur.msgs[cur.msgs.length - 1].created_at);
    delete unread[k]; paintBadge();
  }
  function fmt(m){
    if (m.sender_role !== 'system') return String(m.body);
    const parts = String(m.body).split('|');
    if (parts[0] === 'join_request') return tr('sys_req').replace('{w}', tr(parts[1] || '')) + (parts.slice(2).join('|') ? ': ' + parts.slice(2).join('|') : '');
    if (parts[0] === 'joined') return tr('sys_joined');
    return String(m.body);
  }
  async function askJoin(){
    if (!cur || !cur.orderId) return;
    const reason = prompt(tr('ask_reason'), ''); if (reason === null) return;
    const { error } = await sb.rpc('request_support', { p_order_id:cur.orderId, p_thread:cur.thread, p_reason:reason });
    if (error){ if (cfg.toast) cfg.toast(error.message, true); return; }
    if (cfg.toast) cfg.toast(tr('ask_sent'));
    const k = cur.k; let q = sb.from('messages').select('*').eq('thread', cur.thread).eq('order_id', cur.orderId).order('created_at').limit(300);
    const { data } = await q; if (cur && cur.k === k){ cur.msgs = data || []; cur.msgs.forEach(x => seenIds.add(x.id)); draw(); }
  }
  function draw(){
    const box = document.getElementById('msgs'); if (!box || !cur) return;
    box.innerHTML = cur.msgs.map(m => {
      if (m.sender_role === 'system') return `<div class="sysmsg">🛟 ${e(fmt(m))}<small>${hm(m.created_at)}</small></div>`;
      const mine = m.sender_id === me();
      return `<div class="bub ${mine ? 'mine' : ''}">${mine ? '' : `<span class="who">${e(tr(m.sender_role))}</span>`}${e(m.body)}<small>${hm(m.created_at)}</small></div>`;
    }).join('') || `<div class="muted" style="text-align:center;padding:30px">${e(tr('no_chats'))}</div>`;
    box.scrollTop = box.scrollHeight;
  }
  async function send(text){
    if (!cur) return;
    const ta = document.getElementById('chatText');
    const body = (text || (ta && ta.value) || '').trim(); if (!body) return;
    if (ta && !text) ta.value = '';
    const { data:id, error } = await sb.rpc('send_message', { p_order_id:cur.orderId, p_thread:cur.thread, p_body:body, p_user_id:cur.userId });
    if (error){ if (cfg.toast) cfg.toast(error.message, true); if (ta && !text) ta.value = body; return; }
    const m = { id, order_id:cur.orderId, thread:cur.thread, user_id:cur.userId, sender_id:me(), sender_role:cfg.role, body, created_at:new Date().toISOString() };
    seenIds.add(id); cur.msgs.push(m); draw(); setSeen(cur.k, m.created_at);
  }
  return { init, stop, refresh, button, inbox, open, close, send, label, askJoin };
})();

(async function boot(){
  applyLang();
  try {
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await afterLogin(session.user);
    else { if (!location.hash || location.hash === '#') replaceHash('#/'); renderShell(); route(); }
  } catch (e) { logErr(e); showAuth(t('error')); }
})();
</script>
