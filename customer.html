async function groupAfterPay(g){
  const d = await groupLoad(g.code);
  const payers = groupPayers(d.items);
  if (!payers.length) return;
  const feeShares = groupFeeSplit(d.g.delivery_fee, payers.length);
  const totals = groupMemberTotals(d.items, feeShares, payers);
  let allOk = true;
  payers.forEach(id => {
    const s = groupMemberPaySums(d.payments, id);
    const b = groupPayBadge(s.paid, s.cod, s.checking, totals[id].total);
    if (!['paid', 'cod', 'walletcod'].includes(b)) allOk = false;
  });
  const next = allOk ? 'ready' : 'paying';
  if (d.g.status !== next){ await sb.from('group_orders').update({ status:next }).eq('id', d.g.id); }
}

    if (method === 'cod'){ rows.push({ group_id:d.g.id, member_id:state.user.id, method:'cod', amount:share, status:'cod' }); }
    else if (method === 'online'){
      if (!tid || tid.length < 6) return toast(t('grp_tid_need'), true);
      rows.push({ group_id:d.g.id, member_id:state.user.id, method:'online', amount:share, status:'checking', tid });
    } else if (method === 'wallet'){
      if (wamt <= 0 || wamt > share) return toast(t('grp_wallet_bad'), true);
      if (wamt >= share) rows.push({ group_id:d.g.id, member_id:state.user.id, method:'wallet', amount:share, status:'paid' });
      else { rows.push({ group_id:d.g.id, member_id:state.user.id, method:'wallet', amount:wamt, status:'paid' }); rows.push({ group_id:d.g.id, member_id:state.user.id, method:'cod', amount:share - wamt, status:'cod' }); }
    } else if (method === 'onlinecod'){
      if (!tid || tid.length < 6 || oamt <= 0 || oamt >= share) return toast(t('grp_tid_need'), true);
      rows.push({ group_id:d.g.id, member_id:state.user.id, method:'online', amount:oamt, status:'checking', tid });
      rows.push({ group_id:d.g.id, member_id:state.user.id, method:'cod', amount:share - oamt, status:'cod' });
    }
    const ins = await sb.from('group_order_payments').insert(rows);
    if (ins.error) throw ins.error;
    await groupAfterPay(d.g);
    toast(t('grp_paid_msg')); await groupShow(code);
  });
}


// ================= FAMILY ACCOUNTS (Feature 3) =================
// Separate accounts, shared addresses + family orders. Money is NOT shared:
// each member pays their own orders; there is no shared family wallet.
// Shared addresses are copied to the member's own addresses at checkout so
// quote_cart (which takes an addresses-table id) quotes the exact fee —
// never a silently estimated fee, never a fallback to the member's address.
function familyCodeGen(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
function familyIsBackendError(e){
  const m = String((e && (e.message || e.error_description)) || e || '').toLowerCase();
  return /42p01|pgrst205|does not exist|relation .* does not exist|schema cache|table .* not found/i.test(m) || (e && (e.code === '42P01' || e.code === 'PGRST205'));
}
function familyCanRemoveMember(viewerId, family, memberId){
  if (!family || !viewerId) return false;
  return family.owner_id === viewerId && memberId !== family.owner_id;
}
function familyCanLeave(viewerId, family, memberCount){
  if (!family || !viewerId) return false;
  if (family.owner_id === viewerId) return memberCount <= 1;
  return true;
}
function familyOrderVisible(order, memberNames, sharedTexts){
  if (!order) return false;
  const names = (memberNames || []).map(x => String(x || '').trim().toLowerCase()).filter(Boolean);
  const texts = (sharedTexts || []).map(x => String(x || '').trim().toLowerCase()).filter(Boolean);
  if (order.receiver_name && names.includes(String(order.receiver_name).trim().toLowerCase())) return true;
  if (order.address_text && texts.includes(String(order.address_text).trim().toLowerCase())) return true;
  return false;
}
function familySharedAddressUsable(a){
  return !!(a && a.address_text && String(a.address_text).trim());
}
async function familyLoadMy(){
  try {
    const mr = await sb.from('family_members').select('family_id,role').eq('user_id', state.user.id);
    if (mr.error) throw mr.error;
    const fids = [...new Set((mr.data || []).map(x => x.family_id))];
    let families = [], members = [], shared = [], profiles = {};
    if (fids.length){
      const fr = await sb.from('families').select('*').in('id', fids).order('created_at', { ascending:false });
      if (fr.error) throw fr.error;
      families = fr.data || [];
      const mem = await sb.from('family_members').select('*').in('family_id', fids).order('joined_at');
      if (mem.error) throw mem.error;
      members = mem.data || [];
      const adr = await sb.from('family_addresses').select('*').in('family_id', fids).order('created_at');
      if (!adr.error) shared = adr.data || [];
      const ids = [...new Set(members.map(m => m.user_id))];
      if (ids.length){ const pr = await sb.from('profiles').select('id,full_name,phone').in('id', ids); if (!pr.error) (pr.data || []).forEach(p => { profiles[p.id] = p; }); }
    }
    const membersWithNames = members.map(m => Object.assign({}, m, { full_name:(profiles[m.user_id] || {}).full_name || '', phone:(profiles[m.user_id] || {}).phone || '' }));
    state.famData = { families, memberships:mr.data || [], members, membersWithNames, profiles, shared };
    return state.famData;
  } catch (e) {
    if (familyIsBackendError(e)){ state.famData = { pending:true, families:[], members:[], membersWithNames:[], shared:[] }; return state.famData; }
    throw e;
  }
}

// ================= SECURITY (Feature 6: Passkeys + security screen) =================
// Native Supabase passkeys (verified in the bundled supabase-js 2.118.0, the same
// @2 the app loads): sb.auth.registerPasskey(), sb.auth.signInWithPasskey() and
// sb.auth.passkey.{list,update,delete}. Credentials are verified by Supabase Auth
// itself; no credential private key, password or session token is ever stored in
// user_devices (labels + a per-browser device key only).
function secHasPasskeyApi(authObj){ return !!(authObj && typeof authObj.signInWithPasskey === 'function' && typeof authObj.registerPasskey === 'function'); }
function secIsBackendError(e){ const m = String((e && e.code) || '') + ' ' + String((e && e.message) || ''); return /42P01|PGRST205/i.test(m); }
function secPwCheck(cur, nw, cf){
  if (!cur) return 'sec_reauth_fail';
  if (!nw || nw.length < 6) return 'sec_pw_short';
  if (nw !== cf) return 'sec_pw_mismatch';
  if (nw === cur) return 'sec_pw_same';
  return '';
}
function secPkErrKind(err){
  const code = String((err && err.code) || '');
  const msg = String((err && err.message) || '');
  if (code === 'passkey_disabled') return 'disabled';
  if (code === 'webauthn_credential_exists') return 'exists';
  if (/credential_not_found|not found|no passkey/i.test(msg)) return 'notfound';
  return '';
}
function secDeviceLabelFromUA(ua, platform){
  const u = String(ua || '');
  let os = 'Browser';
  if (/android/i.test(u)) os = 'Android';
  else if (/iphone/i.test(u)) os = 'iPhone';
  else if (/ipad/i.test(u)) os = 'iPad';
  else if (/windows/i.test(u)) os = 'Windows';
  else if (/macintosh|mac os/i.test(u)) os = 'Mac';
  else if (/linux/i.test(u)) os = 'Linux';
  else if (platform) os = String(platform);
  let br = 'Browser';
  if (/edg/i.test(u)) br = 'Edge';
  else if (/opr|opera/i.test(u)) br = 'Opera';
  else if (/chrome|crios/i.test(u)) br = 'Chrome';
  else if (/firefox|fxios/i.test(u)) br = 'Firefox';
  else if (/safari/i.test(u)) br = 'Safari';
  return os + ' · ' + br;
}
function secDeviceKey(){
  let k = null;
  try { k = ls.get('kh_device', null); } catch (e) { k = null; }
  if (!k){ k = 'dev_' + Math.random().toString(36).slice(2) + Date.now().toString(36); try { ls.set('kh_device', k); } catch (e) {} }
  return k;
}
async function secUpsertDevice(){
  try {
    if (!state.user) return;
    await sb.from('user_devices').upsert({ user_id: state.user.id, device_key: secDeviceKey(), device_label: secDeviceLabelFromUA(navigator.userAgent || '', navigator.platform || ''), last_seen_at: new Date().toISOString() }, { onConflict: 'user_id,device_key' });
  } catch (e) { /* devices list is best-effort; login must never fail because of it */ }
}
async function secLoadDevices(){
  try {
    const { data, error } = await sb.from('user_devices').select('*').eq('user_id', state.user.id).order('last_seen_at', { ascending: false });
    if (error) throw error;
    return { rows: data || [], pending: false };
  } catch (e) {
    if (secIsBackendError(e)) return { rows: [], pending: true };
    throw e;
  }
}

async function secChangePw(){
  const cur = ($('sec_cur') && $('sec_cur').value) || '';
  const nw = ($('sec_new') && $('sec_new').value) || '';
  const cf = ($('sec_cf') && $('sec_cf').value) || '';
  const bad = secPwCheck(cur, nw, cf);
  if (bad) return toast(t(bad), true);
  try {
    const email = state.user && state.user.email;
    if (!email) throw new Error('no email');
    const { error: reErr } = await sb.auth.signInWithPassword({ email, password: cur });
    if (reErr) throw reErr;
    const { error } = await sb.auth.updateUser({ password: nw });
    if (error) throw error;
    ['sec_cur', 'sec_new', 'sec_cf'].forEach(id => { const el = $(id); if (el) el.value = ''; });
    toast(t('sec_pw_changed'));
  } catch (e) {
    logErr(e);
    const m = String((e && e.message) || '');
    toast(/invalid login|invalid.*password|incorrect/i.test(m) ? t('sec_reauth_fail') : niceErr(e), true);
  }
}

const REFUND_ACTIVE_STATUSES = ['requested','reviewing','approved','escalated'];
function refundRequestHtml(o, request, loadError){
  if (loadError) return `<div class="box" style="margin-top:12px"><b>${t('rf_title')}</b><div class="muted" style="margin-top:6px">${t('rf_load_fail')}: ${esc(loadError)}</div></div>`;
  const active = request && REFUND_ACTIVE_STATUSES.includes(request.status);
  const history = request ? `<div class="box" style="margin-top:12px"><b>${t('rf_full')} · ${esc(String(request.status || 'unknown').replaceAll('_',' '))}</b><div class="muted" style="font-size:14px;margin-top:6px">${t('rf_requested')} ${esc(when(request.requested_at))}${request.reason ? `<br>${t('rf_reason')}: ${esc(request.reason)}` : ''}</div>${request.admin_note ? `<div style="margin-top:8px"><b>${t('rf_admin_note')}</b><div class="muted">${esc(request.admin_note)}</div></div>` : ''}${request.external_reference ? `<div class="muted" style="font-size:13px;margin-top:6px">${t('rf_reference')}: ${esc(request.external_reference)}</div>` : ''}</div>` : '';
  if (active || !['delivered','cancelled'].includes(o.status)) return history;
  return `${history}<div class="box" style="margin-top:12px"><b>${t('rf_ask')}</b><p class="muted" style="font-size:14px;margin:5px 0 10px">${t('rf_note')}</p><button type="button" class="btn ghost" id="refundOpenBtn" onclick="A.toggleRefundForm()">${t('rf_btn')}</button><div id="refundFormWrap" hidden><label class="f" for="refundReason">${t('rf_reason_lbl')}</label><textarea id="refundReason" minlength="8" maxlength="2000" required placeholder="${t('rf_ph')}"></textarea><div id="refundError" class="closed-note" role="alert" hidden></div><button type="button" id="refundSubmitBtn" class="btn" style="margin-top:10px" onclick="A.submitRefundRequest('${esc(o.id)}')">${t('rf_submit')}</button></div></div>`;
}
function toggleRefundForm(){
  const wrap = document.getElementById('refundFormWrap');
  if (!wrap) return;
  wrap.hidden = !wrap.hidden;
  if (!wrap.hidden) document.getElementById('refundReason')?.focus();
}
async function submitRefundRequest(orderId){
  const button = document.getElementById('refundSubmitBtn'), reasonEl = document.getElementById('refundReason'), errorEl = document.getElementById('refundError');
  if (!state.user) { if (errorEl) { errorEl.textContent = t('rf_signin'); errorEl.hidden = false; } return; }
  if (!state.curOrder || state.curOrder.id !== orderId || !['delivered','cancelled'].includes(state.curOrder.status)) return;
  const reason = reasonEl && reasonEl.value.trim();
  if (!reason || reason.length < 8 || reason.length > 2000) { if (errorEl) { errorEl.textContent = t('rf_len'); errorEl.hidden = false; } reasonEl?.focus(); return; }
  if (button) { button.disabled = true; button.textContent = t('rf_submitting'); }
  if (errorEl) errorEl.hidden = true;
  try {
    const { data, error } = await sb.rpc('customer_create_refund_request', { p_order_id:orderId, p_reason:reason });
    if (error) throw error;
    if (!data) throw new Error(t('rf_not_created'));
    await showOrder(orderId);
  } catch (e) {
    if (errorEl) { errorEl.textContent = e && e.message ? e.message : t('rf_submit_fail'); errorEl.hidden = false; }
    if (button) { button.disabled = false; button.textContent = t('rf_submit'); }
  }
}

// ---- Delivery time and complaints about the rider ----
const tAt = ts => new Date(ts).toLocaleTimeString('en-GB', { hour:'numeric', minute:'2-digit', hour12:true, timeZone:'Asia/Karachi' });
function arriveLine(o){
  if (o.order_type === 'pickup' || o.order_type === 'dinein') return '';
  if (o.status === 'picked_up' && o.rider_due_at) return `<span style="display:block;opacity:.95;font-weight:700;margin-top:4px">🛵 ${t('arrive_by', { t:tAt(o.rider_due_at) })}</span>`;
  if (o.deliver_by && !FINAL.includes(o.status)) return `<span style="display:block;opacity:.9;margin-top:4px">🕒 ${t('deliver_around', { t:tAt(o.deliver_by) })}</span>`;
  return '';
}
function complainHtml(o, c){
  if (!o.rider_id) return '';
  if (c) return `<div class="box" style="margin-top:12px"><b>📣 ${t('cmp_status')}: ${t('cmp_' + c.kind)}</b><div class="muted" style="font-size:14px;margin-top:4px">${c.status === 'rejected' ? esc(t('cmp_rejected', { n:c.admin_note || '—' })) : t('cmp_' + c.status)}</div></div>`;
  const hrs = num((state.cmpRules && state.cmpRules.hours) || 24);
  if (!o.delivered_at || Date.now() - new Date(o.delivered_at).getTime() > hrs * 3600000) return '';
  return `<button class="btn warn" style="margin-top:12px" onclick="A.complainForm('${esc(o.id)}')">⚠️ ${t('cmp_btn')}</button>`;
}
// ---- Live tracking map ----
let track = null, riderTimer = null;
const showTrackMap = o => !['pickup','dinein'].includes(o.order_type) && !FINAL.includes(o.status) && ((o.address_lat != null) || (o.restaurant && o.restaurant.lat != null));
async function mountTrackMap(o, rider){
  const slot = $('mapSlot'); if (!slot) return;
  if (track && track.id === o.id && track.el){ slot.appendChild(track.el); setTimeout(() => track.map.invalidateSize(), 50); if (rider && rider.lat) updateRiderPin(rider); return; }
  let L; try { L = await loadLeaflet(); } catch (e) { slot.innerHTML = `<div class="muted">${t('map_fail')}</div>`; return; }
  if (!$('mapSlot')) return;
  if (track && track.map){ try { track.map.remove(); } catch (e) {} }
  const el = document.createElement('div'); el.className = 'mapbox'; $('mapSlot').appendChild(el);
  const pts = [];
  const map = baseMap(L, el, o.address_lat != null ? [o.address_lat, o.address_lng] : [o.restaurant.lat, o.restaurant.lng], 15);
  if (o.restaurant && o.restaurant.lat != null){ L.marker([o.restaurant.lat, o.restaurant.lng], { icon:pinIcon(L, '🏪', '#0F766E') }).addTo(map).bindTooltip(t('shop_word')); pts.push([o.restaurant.lat, o.restaurant.lng]); }
  if (o.address_lat != null){ L.marker([o.address_lat, o.address_lng], { icon:pinIcon(L, '🏠', '#1F6F4A') }).addTo(map).bindTooltip(t('you')); pts.push([o.address_lat, o.address_lng]); }
  track = { id:o.id, el, map, L, rider:null };
  if (rider && rider.lat){ updateRiderPin(rider); pts.push([rider.lat, rider.lng]); }
  if (pts.length > 1) map.fitBounds(pts, { padding:[40, 40], maxZoom:16 });
  setTimeout(() => map.invalidateSize(), 250);
}
function updateRiderPin(r){
  if (!track || !track.map) return;
  const ll = [r.lat, r.lng];
  if (!track.rider) track.rider = track.L.marker(ll, { icon:pinIcon(track.L, '🛵', '#F2A900'), zIndexOffset:1000 }).addTo(track.map).bindTooltip(t('rider_word'));
  else track.rider.setLatLng(ll);
  const o = state.curOrder; const k = document.querySelector('.rkm');
  if (k && o && o.address_lat != null) k.textContent = '🛵 ' + t('rider_km', { km:kmBetween(r.lat, r.lng, o.address_lat, o.address_lng).toFixed(1) });
  const rb = document.getElementById('retaBox');
  if (rb && o) { const h = etacEtaInner(o, r); rb.innerHTML = h; rb.style.display = h ? '' : 'none'; }
}

// ---- Courier ETA (Feature 8): same model as shopEta — haversine distance
// at the region rider speed (state.settings.rider_speed_kmh, fallback 20
// km/h). Display only: never touches totals, promise, dispatch or backend.
function etacSpeed(){ return num(state.settings && state.settings.rider_speed_kmh) || 20; }
function etacEtaMin(aLat, aLng, bLat, bLng){
  if (aLat == null || aLng == null || bLat == null || bLng == null) return null;
  const d = kmBetween(Number(aLat), Number(aLng), Number(bLat), Number(bLng));
  if (!Number.isFinite(d)) return null;
  return Math.max(1, Math.ceil(d / etacSpeed() * 60));
}
function etacEtaInner(o, rider){
  if (!o || o.order_type !== 'delivery') return '';
  if (!['rider_assigned', 'picked_up'].includes(o.status)) return '';
  if (!rider) return '';
  const picked = o.status === 'picked_up';
  const tLat = picked ? o.address_lat : (o.restaurant && o.restaurant.lat);
  const tLng = picked ? o.address_lng : (o.restaurant && o.restaurant.lng);
  if (tLat == null || tLng == null) return '';
  if (rider.lat == null || rider.lng == null) return `🛵 ${t('etac_updating')}`;
  if (!rider.location_updated_at) return `🛵 ${t('etac_updating')}`;
  const age = Date.now() - new Date(rider.location_updated_at).getTime();
  if (!Number.isFinite(age) || age > 120000) return `🛵 ${t('etac_updating')}`;
  const m = etacEtaMin(rider.lat, rider.lng, tLat, tLng);
  if (m == null) return '';
  return `🛵 ${t(picked ? 'etac_to_you' : 'etac_to_shop', { n:m })}`;
}

let actx = null;

  try { if (navigator.vibrate) navigator.vibrate([400, 150, 400, 150, 400]); } catch (e) {}
}

function ensureBubble(){
  let b = $('orderBubble');

  b.id = 'orderBubble';
  b.innerHTML = `🛵<span class="ebadge"></span><span class="blabel">${t('your_order') || 'Your order'}</span>`;
  document.body.appendChild(b);
  // drag logic
  let sx=0, sy=0, bx=0, by=0, dragging=false, moved=0;
  const pos = () => ({ x: parseFloat(b.dataset.x || (innerWidth - 96)), y: parseFloat(b.dataset.y || 320) });
  const setPos = (x, y) => {
    x = Math.max(8, Math.min(innerWidth - 82, x));
    y = Math.max(80, Math.min(innerHeight - 170, y));
    b.dataset.x = x; b.dataset.y = y;
    b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.right = 'auto'; b.style.bottom = 'auto';
  };
  try { const saved = JSON.parse(ls.get('kh_bubble_pos') || 'null'); if (saved) { b.dataset.x = saved.x; b.dataset.y = saved.y; } } catch(e){}
  const p0 = pos(); setPos(p0.x, p0.y);
  b.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; sx = e.clientX; sy = e.clientY;
    const p = pos(); bx = p.x; by = p.y;
    try { b.setPointerCapture(e.pointerId); } catch(e2){}
    b.style.cursor = 'grabbing';
  });
  b.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 8) setPos(bx + dx, by + dy);
  });
  const end = e => {
    if (!dragging) return; dragging = false; b.style.cursor = 'grab';
    try { ls.set('kh_bubble_pos', JSON.stringify({ x: parseFloat(b.dataset.x), y: parseFloat(b.dataset.y) })); } catch(e2){}
    b.dataset.moved = moved;
  };
  b.addEventListener('pointerup', end);
  b.addEventListener('pointercancel', end);
  b.addEventListener('click', e => {
    e.stopPropagation();
    if (parseFloat(b.dataset.moved || 0) < 12 && bubbleOrder){

  });

}

// On app open, the signed-in user's FCM token is saved in device_tokens,
// so the Admin app can send pushes. No error here ever blocks login.
function handleCallPush(d){
  try {
    if (!d || d.type !== 'call') return false;
    const rec = { thread: d.thread, orderId: d.orderId || null, ts: Date.now() };
    try { localStorage.setItem('dera_pending_call', JSON.stringify(rec)); } catch (e) {}
    try { if (typeof Chat !== 'undefined' && Chat.consumePendingCall) Chat.consumePendingCall(); } catch (e) {}
    return true;
  } catch (e) { return false; }

const FCM = {
  app: 'customer',
  done: false,
  async register(uid){
    try {
      if (this.done) return; this.done = true;
      const Cap = window.Capacitor;
      const PN = Cap && Cap.Plugins && Cap.Plugins.PushNotifications;
      if (!PN || !uid) return;
      const saved = new Promise((res) => {
        try {
          PN.addListener('registration', async (tok) => {
            try {
              if (tok && tok.value) await sb.from('device_tokens').upsert({ user_id: uid, token: tok.value, platform: 'android', app: FCM.app, updated_at: new Date().toISOString() }, { onConflict: 'token' });
            } catch (e) {}
            res();
          });
          PN.addListener('registrationError', () => res());
        } catch (e) { res(); }
        setTimeout(res, 10000);
      });
      const perm = await PN.requestPermissions();
      if (!perm || perm.receive === 'denied') return;
      await PN.register();
      await saved;
      try {
        PN.addListener('pushNotificationReceived', async (n) => {
          try {
            try { if (n && n.data) handleCallPush(n.data); } catch (e) {}
            const LN = Cap.Plugins.LocalNotifications;
            if (!LN || !n) return;
            await LN.schedule({ notifications: [{ id: Date.now() % 2147483647, title: n.title || 'Dera', body: n.body || '', extra: n.data || {} }] });
          } catch (e) {}
        });
      } catch (e) {}
      try {
        PN.addListener('pushNotificationActionPerformed', (a) => {
          try {
            try { if (a && a.notification && a.notification.data) handleCallPush(a.notification.data); } catch (e) {}
            const p = a && a.notification && a.notification.data && a.notification.data.path;
            if (p) location.hash = p;
          } catch (e) {}
        });
      } catch (e) {}
    } catch (e) {}
  }
};

      resolve(false);
    };
  });
}
async function tfaGate(){
  if (!tfaHasApi()) return true;
  let st; try { st = await tfaStatus(); } catch(e){ st = { error:e }; }
  if (st.error) return await tfaStatusErrorGate();
  if (!st.verified || !st.verified.length) return true;
  let aal = null;
  try { const r = await sb.auth.mfa.getAuthenticatorAssuranceLevel(); if (r.error) throw r.error; aal = r.data; } catch(e){ return await tfaStatusErrorGate(); }
  if (aal && aal.currentLevel === 'aal2') return true;
  return await tfaPrompt(st.verified[0].id);
}
async function tfaSheet(){
  const st = await tfaStatus();
  if (!st.api){ openSheet(tfaL('tfa_title'), `<p class="muted">${tfaL('tfa_unavailable')}</p>`); return; }
  if (st.error){ openSheet(tfaL('tfa_title'), `<p class="muted">${tfaL('tfa_status_err')}</p><button class="btn" style="width:100%" onclick="tfaSheet()">${tfaL('tfa_retry')}</button>`); return; }
  if (st.verified.length){
    openSheet(tfaL('tfa_title'), `<div class="box"><b>🔐 ${tfaL('tfa_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${tfaL('tfa_on')}</p><button class="btn warn" style="width:100%" onclick="tfaDisableAsk()">${tfaL('tfa_disable')}</button></div><p class="muted" style="font-size:13px">${tfaL('tfa_recovery')}</p>`);
    return;
  }
  openSheet(tfaL('tfa_title'), `<div class="box"><b>🔐 ${tfaL('tfa_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${tfaL('tfa_sub')}</p>${st.unverified.length ? `<p class="muted" style="font-size:13px">${tfaL('tfa_unfinished')}</p>` : ''}<button class="btn" style="width:100%" onclick="tfaEnrollStart()">${tfaL('tfa_setup')}</button></div><p class="muted" style="font-size:13px">${tfaL('tfa_recovery')}</p>`);
}
async function tfaEnrollStart(){
  try {
    const st = await tfaStatus();
    if (st.verified.length) return tfaSheet();
    for (const f of (st.unverified || [])){ try { await sb.auth.mfa.unenroll({ factorId: f.id }); } catch(e){} }
    const { data, error } = await sb.auth.mfa.enroll({ factorType: 'totp' });
    if (error) throw error;
    state.tfaPending = { id: data.id, secret: (data.totp && data.totp.secret) || '', qr: (data.totp && data.totp.qr_code) || '' };
    tfaEnrollSheet();
  } catch(e){ toast((e && e.message) || tfaL('tfa_status_err'), true); }
}
function tfaEnrollSheet(){
  const p = state.tfaPending; if (!p) return tfaSheet();
  openSheet(tfaL('tfa_title'), `<div class="box"><p class="muted" style="font-size:13px;margin:0 0 10px">${tfaL('tfa_scan')}</p><div id="tfaQr" style="text-align:center"></div><p class="muted" style="font-size:13px;margin:10px 0 4px">${tfaL('tfa_secret')}</p><div style="word-break:break-all;font-family:monospace">${p.secret || '—'}</div><input id="tfaEnrollCode" inputmode="numeric" autocomplete="one-time-code" placeholder="${tfaL('tfa_code')}" style="width:100%;padding:12px;font-size:18px;letter-spacing:4px;text-align:center;margin-top:12px"><div id="tfaMsg" class="muted" style="font-size:13px;margin-top:8px;min-height:18px"></div><button class="btn" style="width:100%;margin-top:8px" onclick="tfaVerifyEnroll()">${tfaL('tfa_verify')}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="tfaCancelEnroll()">${tfaL('tfa_cancel')}</button></div>`);
  const q = document.getElementById('tfaQr'); if (q && p.qr) q.innerHTML = p.qr;
}
async function tfaCancelEnroll(){
  const p = state.tfaPending; state.tfaPending = null;
  if (p){ try { await sb.auth.mfa.unenroll({ factorId: p.id }); } catch(e){} }
  tfaSheet();
}
async function tfaVerifyEnroll(){
  const p = state.tfaPending; if (!p) return tfaSheet();
  const inp = document.getElementById('tfaEnrollCode'), msg = document.getElementById('tfaMsg');
  const code = (inp && inp.value || '').trim();
  if (!/^\d{6}$/.test(code)){ if (msg) msg.textContent = tfaL('tfa_enter_code'); return; }
  try {
    const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId: p.id });
    if (chErr) throw chErr;
    const { error } = await sb.auth.mfa.verify({ factorId: p.id, challengeId: ch.id, code });
    if (error) throw error;
    state.tfaPending = null; toast(tfaL('tfa_enabled')); tfaSheet();
  } catch(e){ if (msg) msg.textContent = tfaL('tfa_wrong'); }
}
function tfaDisableAsk(){
  openSheet(tfaL('tfa_title'), `<div class="box"><p class="muted" style="font-size:13px;margin:0 0 10px">${tfaL('tfa_disable_ask')}</p><input id="tfaDisCode" inputmode="numeric" autocomplete="one-time-code" placeholder="${tfaL('tfa_code')}" style="width:100%;padding:12px;font-size:18px;letter-spacing:4px;text-align:center"><div id="tfaDisMsg" class="muted" style="font-size:13px;margin-top:8px;min-height:18px"></div><button class="btn warn" style="width:100%;margin-top:8px" onclick="tfaDisableVerify()">${tfaL('tfa_disable')}</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="tfaSheet()">${tfaL('tfa_cancel')}</button></div>`);
}
async function tfaDisableVerify(){
  const inp = document.getElementById('tfaDisCode'), msg = document.getElementById('tfaDisMsg');
  const code = (inp && inp.value || '').trim();
  if (!/^\d{6}$/.test(code)){ if (msg) msg.textContent = tfaL('tfa_enter_code'); return; }
  try {
    const st = await tfaStatus(); const f = st.verified[0];
    if (!f) return tfaSheet();
    const { data: ch, error: chErr } = await sb.auth.mfa.challenge({ factorId: f.id });
    if (chErr) throw chErr;
    const { error } = await sb.auth.mfa.verify({ factorId: f.id, challengeId: ch.id, code });
    if (error) throw error;
    await sb.auth.mfa.unenroll({ factorId: f.id });
    toast(tfaL('tfa_disabled')); tfaSheet();
  } catch(e){ if (msg) msg.textContent = tfaL('tfa_wrong'); }
}
function tfaSecHtml(st){
  if (!st || !st.api) return `<div class="box"><b>🔐 ${tfaL('tfa_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${tfaL('tfa_unavailable')}</p></div>`;
  if (st.error) return `<div class="box"><b>🔐 ${tfaL('tfa_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${tfaL('tfa_status_err')}</p><button class="btn ghost" onclick="tfaSheet()">${tfaL('tfa_manage')}</button></div>`;
  const on = st.verified.length > 0;
  return `<div class="box"><b>🔐 ${tfaL('tfa_title')}</b><p class="muted" style="font-size:13px;margin:5px 0">${on ? tfaL('tfa_on') : tfaL('tfa_sub')}</p><button class="btn ghost" onclick="tfaSheet()">${tfaL('tfa_manage')}</button></div><p class="muted" style="font-size:13px">${tfaL('tfa_recovery')}</p>`;
}

      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        ${needPush && !iosHint ? `<button data-a="on" style="${btn};background:var(--brand);color:#fff;flex:1">${tt('on')}</button>` : ''}
        ${deferred ? `<button data-a="inst" style="${btn};background:var(--marigold,#F2A900);color:#1E2B25;flex:1">${tt('install')}</button>` : ''}
        <button data-a="later" style="${btn};background:transparent;color:var(--muted,#66746C)">${tt('later')}</button></div>`;
    el.addEventListener('click', ev => { const a = ev.target.closest('button') && ev.target.closest('button').dataset.a; if (a === 'on') turnOn(); else if (a === 'inst') install(); else if (a === 'later') later(); });
    document.body.appendChild(el);
  }
  async function init(c){
    cfg = c;
    if (!('serviceWorker' in navigator)) return;
    try { await reg(); } catch (e) { return; }
    // Already allowed before: refresh the saved subscription quietly for this account
    if (supported() && Notification.permission === 'granted'){ try { await subscribe(); } catch (e) {} }
    setTimeout(show, 2500);
  }
  async function logout(){
    try {
      const r = await navigator.serviceWorker.getRegistration(); const sub = r && await r.pushManager.getSubscription();
      if (sub && cfg) await cfg.sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    } catch (e) {}
    hide();
  }
  return { init, logout, turnOn, show, enabled:() => supported() && Notification.permission === 'granted' };
})();

    en:{ agree:'By creating an account you agree to our {t} and {p}.', terms:'Terms', privacy:'Privacy Policy', links:'Privacy Policy and Terms',
         del:'Delete my account', del_q:'Delete your account? We will remove your personal data. Your past orders stay in our records without your name. This cannot be undone.',
         del_reason:'Why are you leaving? (optional)', del_done:'Request sent. Dera will delete your account within 7 days.' },
    ur:{ agree:'اکاؤنٹ بنا کر آپ ہماری {t} اور {p} سے اتفاق کرتے ہیں۔', terms:'شرائط', privacy:'پرائیویسی پالیسی', links:'پرائیویسی پالیسی اور شرائط',
         del:'میرا اکاؤنٹ ختم کریں', del_q:'اکاؤنٹ ختم کریں؟ آپ کی ذاتی معلومات مٹا دی جائیں گی۔ پرانے آرڈر آپ کے نام کے بغیر ریکارڈ میں رہیں گے۔ یہ واپس نہیں ہو سکتا۔',
         del_reason:'آپ کیوں جا رہے ہیں؟ (اختیاری)', del_done:'درخواست بھیج دی گئی۔ Dera سات دن میں اکاؤنٹ ختم کر دے گا۔' }
  };
  const tt = (lang, k) => L[lang === 'ur' ? 'ur' : 'en'][k];
  const url = (lang, part) => 'legal.html?lang=' + (lang === 'ur' ? 'ur' : 'en') + '#' + part;
  function agree(lang){
    return `<div class="muted" style="font-size:13px;margin-top:10px;text-align:center">${tt(lang, 'agree').replace('{t}', `<a href="${url(lang, 'terms')}" target="_blank" rel="noopener">${tt(lang, 'terms')}</a>`).replace('{p}', `<a href="${url(lang, 'privacy')}" target="_blank" rel="noopener">${tt(lang, 'privacy')}</a>`)}</div>`;
  }
  function links(lang){
    return `<a class="btn ghost" style="margin-bottom:10px;display:block;text-align:center;text-decoration:none" href="${url(lang, 'privacy')}" target="_blank" rel="noopener">📄 ${tt(lang, 'links')}</a>`;
  }
  let cfg = null;
  function init(c){ cfg = c; }
  async function del(){
    const lang = cfg.lang();
    if (!await uiConfirm(tt(lang, 'del_q'))) return;
    const why = await uiPrompt(tt(lang, 'del_reason'), ''); if (why === null) return;
    const { error } = await cfg.sb.rpc('request_account_deletion', { p_note:why || null });
    if (error) return cfg.toast(error.message, true);
    cfg.toast(tt(lang, 'del_done'));
  }
  return { init, agree, links, del };
})();

// ================= BACK BUTTON (same code in all four apps) =================
// Phone back button: closes the open popup first, then goes to the main tab, then asks "press back again to exit".
const BackNav = (() => {
  let cfg = null, pushed = 0, internal = 0, armed = false, armTimer = null, pushHash = [];
  const present = () => cfg.overlays.filter(([sel]) => document.querySelector(sel));
  function onMutate(){
    const n = present().length;
    while (pushed < n){ pushHash.push(location.hash); history.pushState({ wmov:pushed + 1 }, '', location.href); pushed++; }
    if (pushed > n){
      const extra = pushed - n; pushed = n;
      const h = pushHash.splice(n).pop();
      // Closed by a button (same page): remove our extra history steps. Closed because the page changed: leave history alone.
      if (h === location.hash && history.state && history.state.wmov){ internal++; history.go(-extra); }
    }
  }
  function guard(){ history.pushState({ wmg:1 }, '', location.href); }
  function onPop(ev){
    if (internal > 0){ internal--; return; }
    const st = ev.state || {};
    const open = present();
    if (open.length){
      // user pressed back while a popup is open: close the top one
      pushed = Math.max(0, pushed - 1); pushHash.pop();
      const [sel, close] = open[open.length - 1];
      try { close ? close() : document.querySelector(sel).remove(); } catch (e) { const el = document.querySelector(sel); if (el) el.remove(); }
      return;
    }
    if (st.wmov){ internal++; history.back(); return; }         // leftover popup step: skip it
    if (!st.wmb) return;                                          // normal page change (hash links) is handled by the app
    if (cfg.back && cfg.back()){ guard(); return; }               // went to main tab / home
    if (armed){ return; }                                         // second press: nothing left, phone closes the app
    armed = true; cfg.toast(cfg.exitMsg());
    clearTimeout(armTimer); armTimer = setTimeout(() => { armed = false; if (history.state && history.state.wmb) guard(); }, 2200);
  }
  function init(c){
    if (cfg) return; cfg = c;
    history.replaceState({ wmb:1 }, '', location.href); guard();
    window.addEventListener('popstate', onPop);
    new MutationObserver(onMutate).observe(document.body, { childList:true });
  }
  return { init };
})();

let obIdx = 0;
function showOnboard(){
  hideSplash();
  const slides = [['🛍️','ob1t','ob1d'],['👥','ob2t','ob2d'],['🎁','ob3t','ob3d'],['🛵','ob4t','ob4d']];
  const ov = document.createElement('div');
  ov.className = 'obover'; ov.id = 'obover';
  const paint = () => {
    ov.innerHTML = `<button class="obskip" onclick="obGo(-1)">${t('ob_skip')}</button>
    <div class="obbody" id="obbody">${slides.map(([e,tk,dk],i) => `<div class="obslide"><div class="obemo">${e}</div><h2>${t(tk)}</h2><p>${t(dk)}</p></div>`).join('')}</div>
    <div class="obfoot"><div class="obdots">${slides.map((_,i) => `<i class="${i===obIdx?'on':''}"></i>`).join('')}</div>
    <button class="btn" onclick="obGo(1)">${t(obIdx === slides.length-1 ? 'ob_start' : 'ob_next')}</button></div>`;
    const bb = document.getElementById('obbody');
    bb.scrollLeft = obIdx * bb.clientWidth;
    bb.addEventListener('scroll', () => { const i = Math.round(bb.scrollLeft / Math.max(1, bb.clientWidth)); if (i !== obIdx){ obIdx = i; paint(); } }, { passive:true });
  };
  window.obGo = d => {
    if (d < 0 || obIdx === slides.length-1){ try { ls.set('kh_onboard', 1); } catch(e){} document.getElementById('obover').remove(); bootMain(); return; }
    obIdx++; paint();
  };
  document.body.appendChild(ov); paint();
}
// Feature 40 (grouping fix): boot-safety helpers. cgf_timeout bounds every boot await;
// cgf_retryCard is the visible fail-open screen when the backend cannot be reached at all.
function cgf_timeout(ms){ return new Promise(r => setTimeout(() => r('timeout'), ms)); }
function cgf_retryCard(title, msg){
  const app = document.getElementById('app');
  if (app) app.innerHTML = `<div style="padding:48px 20px;text-align:center"><div style="font-size:48px">📶</div><h2 style="margin:12px 0 6px">${title}</h2><p style="color:#666;margin:0 0 20px">${msg}</p><button onclick="location.reload()" style="padding:12px 28px;border:0;border-radius:12px;background:#0f7a4d;color:#fff;font-weight:700;font-size:16px;cursor:pointer">↻ ${state.lang === 'ur' ? 'دوبارہ کوشش کریں' : 'Try again'}</button></div>`;
}
function hideSplash(){
  window.__bootDone = true;
  pfmMark('ready');
  const sp = document.getElementById('splash');
  if (!sp || sp.dataset.done) return;
  sp.dataset.done = '1';
  const t0 = window.__splashT || Date.now();
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 900 - (Date.now() - t0)));
}
async function bootMain(){
  // Feature 40: no backend, no boot. The Supabase client itself failed to build
  // (CDN blocked/failed) — fail open to a visible retry instead of a stuck splash.
  if (!sb){ try { hideSplash(); } catch (e) {} cgf_retryCard(state.lang === 'ur' ? 'ڈیرہ لوڈ نہیں ہوا' : 'Could not load Dera', state.lang === 'ur' ? 'انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔' : 'Check your internet connection and try again.'); return; }
  try {
    // Feature 30: boot queries run in parallel (same queries, same fallbacks, same state before either branch)
    // Feature 40: every boot await is bounded — a stalled network must never hold the splash forever.
    const pfmQSettings = (async () => { try {
      const { data:rs } = await sb.from('region_settings').select('key,value').in('key', ['rider_speed_kmh']);
      state.settings = {}; (rs || []).forEach(x => { state.settings[x.key] = x.value; });
    } catch(e){ state.settings = {}; } })();
    const pfmQZones = (async () => { try {
      const { data:az } = await sb.from('zones').select('id,name,center_lat,center_lng,radius_km,extra_circles,is_active').eq('is_active', true);
      state.allZones = az || [];
      const { data:zc } = await sb.from('zone_charges').select('from_zone_id,to_zone_id,delivery_fee');
      state.zoneCharges = {}; (zc || []).forEach(c => { state.zoneCharges[c.from_zone_id + '|' + c.to_zone_id] = c.delivery_fee; });
      const { data:rgs } = await sb.from('regions').select('id,name,center_lat,center_lng,radius_km,extra_circles').eq('is_active', true);
      state.allRegions = rgs || [];
    } catch(e){ state.allZones = []; state.zoneCharges = {}; state.allRegions = []; } })();
    const pfmQRiders = (async () => { try {
      const { count } = await sb.from('riders').select('id', { count:'exact', head:true }).eq('is_online', true).eq('is_approved', true);
      state.ridersOnline = count || 0;
    } catch(e){ state.ridersOnline = -1; } })();
    const pfmQSession = sb.auth.getSession();
    await Promise.race([Promise.all([pfmQSettings, pfmQZones, pfmQRiders, pfmQSession]), cgf_timeout(15000)]);
    let session = null;
    try { const res = await Promise.race([pfmQSession, cgf_timeout(15000).then(() => ({ data: { session: null } }))]); session = res && res.data && res.data.session; } catch (e) { session = null; }
    if (session){
      let loginOk = false;
      try { await Promise.race([afterLogin(session.user).then(() => { loginOk = true; }), cgf_timeout(15000)]); } catch (e) {}
      if (!loginOk){ try { renderShell(); route(); } catch (e) {} }
    }
    else { if (!location.hash || location.hash === '#') replaceHash('#/'); renderShell(); route(); }
  } catch (e) { logErr(e); showAuth(t('error')); }
  hideSplash();
}
(async function boot(){ pfmMark('boot');
  try { const rp = new URLSearchParams(location.search).get('ref'); if (rp) ls.set('kh_ref', rp.trim().toUpperCase().slice(0, 32)); } catch (e) {}
  applyLang();
  let seen = 0; try { seen = ls.get('kh_onboard', 0); } catch(e){}
  if (!seen) showOnboard(); else bootMain();
})();
</script>
<script>
// Feature 40 watchdog: if the main script died (CDN failure, early fault) the splash
// would otherwise sit forever. 60s is longer than the 45s worst-case bounded boot
// (15s queries + 15s session + 15s login), so a healthy slow-network boot never trips
// it. Fires only while the splash is still up and hideSplash never ran (__bootDone unset).
setTimeout(function(){
  try {
    if (window.__bootDone) return;
    var sp = document.getElementById('splash');
    if (!sp) return;
    sp.style.display = 'none';
    var app = document.getElementById('app');
    if (app) app.innerHTML = '<div style="padding:48px 20px;text-align:center;font-family:sans-serif"><div style="font-size:48px">📶</div><h2 style="margin:12px 0 6px">Could not load Dera</h2><p style="color:#666;margin:0 0 4px">Check your internet connection and try again.</p><p style="color:#666;margin:0 0 20px">انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔</p><button onclick="location.reload()" style="padding:12px 28px;border:0;border-radius:12px;background:#0f7a4d;color:#fff;font-weight:700;font-size:16px;cursor:pointer">↻ Try again · دوبارہ کوشش کریں</button></div>';
  } catch (e) {}
}, 60000);
</script>
