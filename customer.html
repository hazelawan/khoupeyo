<style>
/* ===== Splash launch screen ===== */
#splash{position:fixed;inset:0;z-index:10000;background:linear-gradient(160deg,#FFF9F2 0%,#FFEDDD 55%,#FFE3CB 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease;overflow:hidden}
#splash.out{opacity:0;pointer-events:none}
.sp-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:spDrift 5s ease-in-out infinite alternate}
.sp-blob.b1{width:340px;height:340px;background:#FFD9B8;top:-90px;right:-90px}
.sp-blob.b2{width:300px;height:300px;background:#FFE9D2;bottom:-80px;left:-80px;animation-delay:-2.5s;animation-direction:alternate-reverse}
@keyframes spDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,20px) scale(1.08)}}
.sp-icon{width:118px;height:118px;border-radius:32px;background:linear-gradient(140deg,#F08A3C,#D95F16);display:flex;align-items:center;justify-content:center;font-size:58px;box-shadow:0 18px 44px rgba(217,95,22,.38);position:relative;z-index:2;opacity:0;transform:scale(.4);animation:spPop .7s cubic-bezier(.34,1.56,.64,1) .25s forwards}
@keyframes spPop{to{opacity:1;transform:scale(1)}}
.sp-word{margin-top:26px;font-size:38px;font-weight:800;color:#20242b;letter-spacing:-.5px;z-index:2;display:flex}
.sp-word span{opacity:0;transform:translateY(26px);display:inline-block;animation:spRise .55s cubic-bezier(.22,1,.36,1) forwards}
.sp-word span.dot{color:#E8722A}
@keyframes spRise{to{opacity:1;transform:none}}
.sp-tag{margin-top:10px;font-size:13px;color:#8a7a68;letter-spacing:2.5px;text-transform:uppercase;z-index:2;opacity:0;animation:spFade .8s ease 1.5s forwards}
@keyframes spFade{to{opacity:1}}
.sp-load{position:absolute;bottom:84px;width:150px;height:5px;border-radius:4px;background:rgba(232,114,42,.16);z-index:2;overflow:hidden;opacity:0;animation:spFade .5s ease 1.7s forwards}
.sp-load i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#F08A3C,#E8722A);animation:spSlide 1.1s ease-in-out infinite}
@keyframes spSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
.sp-hills{position:absolute;bottom:-2px;left:0;width:100%;height:120px;z-index:1;opacity:0;animation:spFade 1s ease .9s forwards}
@media (prefers-color-scheme:dark){#splash{background:linear-gradient(160deg,#211912,#2A1F13)}.sp-word{color:#F5EDE2}.sp-tag{color:#A89880}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important}}

:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#1E2B25; --muted:#66746C; --line:#DDE3DB; --soft:#EAF1EC;
  --green:#1F6F4A; --green-dark:#175539; --marigold:#F2A900; --danger:#B3261E; --deal:#D1432F;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#111A16; --surface:#1A2620; --ink:#E7EFE9; --muted:#93A59A; --line:#2B3A32; --soft:#1F3129; --green:#3FA774; --green-dark:#2F8F60; --danger:#F08A82; --deal:#F0826F; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang=ur] body{font-family:"Noto Naskh Arabic","Bricolage Grotesque",system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:var(--brand);color:#fff}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.02em}
html[lang=ur] .brand{font-family:"Bricolage Grotesque",sans-serif}
.brand b{color:var(--marigold)}
.actions-top{display:flex;gap:8px;align-items:center}
.pillbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:14px}
.auth .pillbtn{border-color:var(--line);background:var(--surface);color:var(--ink)}
.searchbox{position:relative;margin-top:10px}
.searchbox input{width:100%;border:0;border-radius:12px;padding:12px 14px 12px 40px;font-size:16px;background:var(--surface);color:var(--ink)}
html[dir=rtl] .searchbox input{padding:12px 40px 12px 14px}
.searchbox svg{position:absolute;top:50%;left:12px;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
html[dir=rtl] .searchbox svg{left:auto;right:12px}
main{padding:14px 16px 120px}
h1{font-size:26px;letter-spacing:-.01em;margin:6px 0 12px;line-height:1.2}
h2{font-size:20px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2 a,h2 button{font-size:14px;color:var(--brand);font-weight:700;background:none;border:0;cursor:pointer}
.muted{color:var(--muted)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.btn{display:block;width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:15px 16px;font-weight:700;cursor:pointer;text-align:center;font-size:17px}
.btn:active{background:var(--brand-dark)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.cxbtn{flex:none;border:1.5px solid var(--danger);color:var(--danger);background:transparent;font-weight:700;font-size:12.5px;border-radius:99px;padding:4px 10px;cursor:pointer}
.cxstrip{display:flex;align-items:center;gap:10px;margin:2px 0 8px;background:var(--soft);border:1.5px solid var(--line);border-radius:11px;padding:5px 11px;font-size:13.5px}
.cxstep{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);background:var(--surface);font-weight:800;font-size:15px;line-height:1;cursor:pointer;flex:none}
.cxstep.off{border-color:var(--line);color:var(--muted)}
.btn.gold{background:var(--marigold);color:#1E2B25}
.btn[disabled]{opacity:.5}
.btn.inline{display:inline-block;width:auto;padding:10px 18px}
input[type=text],input[type=password],input[type=email],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:14px 0 5px;font-weight:600;font-size:14px}
/* Home */
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.catchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;background:none;border:0;cursor:pointer;padding:0}
.catchip .ic{width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--brand);overflow:hidden}
.catchip .ic img{width:100%;height:100%;object-fit:cover}
.catchip span{font-size:12px;font-weight:600;text-align:center;line-height:1.2;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hscroll .gcard{flex:none;width:150px}
.banner{border-radius:18px;background:linear-gradient(135deg,var(--brand),#D95F16);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;overflow:hidden}
.banner b{font-size:22px;display:block;line-height:1.2}
.banner .big{font-size:32px;font-weight:800;color:var(--marigold);flex:none;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
@media (min-width:560px){.grid2{grid-template-columns:repeat(3,1fr)}}
.gcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:block}
.gimg{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);margin-bottom:6px}
.gimg img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:6px;left:6px;background:var(--deal);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px}
html[dir=rtl] .off{left:auto;right:6px}
.gname{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.gprice{font-weight:800;margin-top:4px;color:var(--deal)}
.gprice.plain{color:var(--ink)}
.strike{text-decoration:line-through;color:var(--muted);font-weight:400;font-size:12px;margin-inline-start:4px}
.gmeta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.gmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qadd{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
html[dir=rtl] .qadd{right:auto;left:8px}
.heart{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:0;display:grid;place-items:center;cursor:pointer;z-index:1;color:#999;font-size:17px}

html[dir=rtl] .heart{right:auto;left:12px}
.shopcard{flex:none;width:130px;text-align:center}
.shopcard .logo{width:130px;height:90px;border-radius:14px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);position:relative}
.shopcard .logo img{width:100%;height:100%;object-fit:cover}
.shopcard .nm{font-weight:700;font-size:14px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.closedtag{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px}
.sortbar{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.chip2{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.chip2.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rcard{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rcard.closed{opacity:.62}
.rimg{width:84px;height:84px;border-radius:14px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;font-size:30px;color:var(--muted)}
.rimg img{width:100%;height:100%;object-fit:cover}
.rbody{flex:1;min-width:0}
.rname{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rdesc{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;gap:12px;color:var(--muted);font-size:13px;margin-top:4px;flex-wrap:wrap}
.star{color:var(--marigold);font-weight:800}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--brand)}
.badge.closed{background:var(--muted)}
/* Shop page */
.hero{border-radius:18px;overflow:hidden;background:var(--brand);color:#fff;margin-bottom:6px}
.hero-img{height:170px;background:var(--brand) center/cover no-repeat;display:grid;place-items:center;font-size:64px;font-weight:800;color:rgba(255,255,255,.55)}
.hero-info{padding:14px 16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px}
.hero-info h1{margin:0 0 4px}
.closed-note{background:var(--surface);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:12px;margin:12px 0;font-weight:600}
.cattabs{position:sticky;top:54px;z-index:4;background:var(--paper);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:6px 0 0}
.cat{margin:24px 0 4px;font-size:20px;font-weight:800;scroll-margin-top:130px}
.staffgroup{margin-bottom:18px}

.catcount{display:inline-block;background:var(--brand);color:#fff;font-size:12px;font-weight:700;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;padding:0 6px;margin-left:6px;vertical-align:middle}
.shoplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;gap:14px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.item.off-stock{opacity:.55}
.item-text{flex:1;min-width:0}
.item-name{font-weight:700}

.item-media{position:relative;width:104px;height:100px;flex:none}
.tile{width:104px;height:84px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.ctl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}
.add{background:var(--surface);color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:6px 20px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.stepper{display:inline-flex;align-items:center;background:var(--brand);color:#fff;border-radius:999px;overflow:hidden}
.stepper button{background:none;border:0;color:#fff;width:36px;height:34px;font-size:20px;cursor:pointer}
.stepper b{min-width:24px;text-align:center}
.soldout{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
/* Product page */
.dimg{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--line);margin-bottom:12px}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dimg .ph{width:100%;height:100%;display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--muted)}
.dprice{font-size:26px;font-weight:800;color:var(--deal)}
.dprice.plain{color:var(--ink)}
.save{display:inline-block;background:rgba(209,67,47,.12);color:var(--deal);font-weight:800;border-radius:8px;padding:2px 8px;font-size:14px;margin-inline-start:8px}
.shopstrip{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.shopstrip .thumb{width:44px;height:44px;border-radius:10px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.shopstrip .thumb img{width:100%;height:100%;object-fit:cover}
.buybar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:10px 12px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.buybar .in{display:flex;gap:10px;width:100%;max-width:616px;align-items:center}
/* Cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:none;justify-content:center;padding:0 12px 10px}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:640px;margin:0 auto;gap:6px;padding:8px 10px}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-weight:700;font-size:12px;color:var(--muted);border-radius:16px;transition:background .25s ease,color .25s ease,transform .15s ease}

.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.nav .cnt{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--marigold);color:#1E2B25;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav a.on .cnt{background:#fff;color:#1E2B25}
/* Cart, checkout, orders */
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:19px}
.line.disc{color:var(--deal);font-weight:700}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.cartrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cartrow:last-child{border-bottom:0}
.cartrow .thumb{width:56px;height:56px;border-radius:10px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.cartrow .thumb img{width:100%;height:100%;object-fit:cover}
.promo{display:flex;gap:8px}
.promo input{flex:1;text-transform:uppercase}
.promo button{flex:none;width:auto;padding:0 18px}
.progress{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--marigold)}
.micbtn{position:absolute;top:50%;right:6px;transform:translateY(-50%);border:0;background:transparent;font-size:20px;cursor:pointer;padding:4px 6px;z-index:2}html[dir=rtl] .micbtn{right:auto;left:6px}.searchbox input#q{padding-right:44px}html[dir=rtl] .searchbox input#q{padding-left:44px;padding-right:40px}.micbtn.on{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}.sugg{background:var(--surface,#fff);color:var(--ink);border-radius:16px;margin-top:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.sg-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px;font-size:14px}.sg-c{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.add.bell{margin-top:6px;min-width:0;padding:6px 10px}.add.bell.on{background:var(--brand);color:#fff}.sharebtn{flex:none;color:var(--brand)!important;border-color:var(--line)!important;background:var(--surface)!important}.faqq{border-bottom:1px solid var(--line);padding:10px 0}.faqq summary{font-weight:700;cursor:pointer}.faqq div{margin-top:6px;color:var(--muted)}
.support-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}.support-message{padding:10px 12px;border-radius:12px;background:var(--soft);margin:8px 0;white-space:pre-wrap;overflow-wrap:anywhere}.support-message.admin{background:rgba(31,111,74,.12)}.support-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.support-actions .btn{flex:1;min-width:135px}.support-status{font-size:12px;font-weight:700;text-transform:capitalize}
.revrow{border-bottom:1px solid var(--line);padding:8px 0}.stars.small button{font-size:22px;padding:0 1px}
.bkcard{background:var(--surface,#fff);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:0 0 10px}.bkcard.on{border:2px solid var(--brand)}.bkslots{display:flex;flex-wrap:wrap;gap:8px;max-height:220px;overflow:auto}.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}.chip{flex:none;border-radius:999px;padding:8px 14px;cursor:pointer;font-family:inherit}
/* booking slot picker polish */

/* ===== Dera design system v2 (shared by all apps) ===== */
:root{
  --paper:#F2F5F1; --surface:#FFFFFF; --ink:#13201A; --muted:#64736A; --line:#E2E8E1; --soft:#E8F3EC; --field:#F3F6F2;
  --green:#0E7A4D; --green-dark:#0A5E3B; --green-2:#17A56B; --marigold:#FFB302; --danger:#D63B2F; --deal:#E2472F;
  --r-sm:12px; --r:16px; --r-lg:22px;
  --sh-1:0 1px 2px rgba(19,40,28,.06),0 1px 1px rgba(19,40,28,.03);
  --sh-2:0 8px 22px rgba(19,40,28,.08),0 2px 6px rgba(19,40,28,.05);
  --sh-3:0 18px 44px rgba(19,40,28,.20),0 4px 12px rgba(19,40,28,.08);
  --grad:linear-gradient(135deg,#F08A3C 0%,#E8722A 55%,#D95F16 100%);
  --grad-gold:linear-gradient(135deg,#FFC23A,#FFA400);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0C1511; --surface:#16211B; --ink:#E8F0EA; --muted:#93A59A; --line:#243229; --soft:#18291F; --field:#1C2922;
    --green:#34B27A; --green-dark:#23915F; --green-2:#46C489; --danger:#FF8A7E; --deal:#FF8A70;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 22px rgba(0,0,0,.35); --sh-3:0 18px 44px rgba(0,0,0,.55);
    --grad:linear-gradient(135deg,#7A3F14 0%,#96541C 60%,#B0621F 100%); }
}
body{background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(232,114,42,.25)}
h1{font-weight:800;letter-spacing:-.025em}
h2{font-weight:800;letter-spacing:-.015em}
h3{font-weight:800}
/* Buttons */
.btn{background:var(--grad);border-radius:14px;box-shadow:0 6px 16px rgba(198,94,27,.25);transition:transform .12s var(--ease),box-shadow .2s,filter .2s;letter-spacing:.005em}
.btn:active{transform:scale(.98);filter:brightness(.95);background:var(--grad)}
.btn.ghost{background:var(--soft);color:var(--brand);border:1.5px solid transparent;box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.warn{background:rgba(214,59,47,.08);color:var(--danger);border:1.5px solid transparent;box-shadow:none}
.btn.gold{background:var(--grad-gold);color:#241a00;box-shadow:0 6px 16px rgba(255,170,0,.28)}
.btn[disabled]{opacity:.45;box-shadow:none;filter:grayscale(.3)}
/* Fields */
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s,background .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px rgba(232,114,42,.15)}
label.f{color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.01em}
/* Surfaces */
.card,.box{border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);background:var(--surface)}
.pill{border-radius:999px;font-weight:700;letter-spacing:.01em}
.muted{color:var(--muted)}
.empty{color:var(--muted)}
/* Sheets and popups */
.sheet-back{background:rgba(8,20,14,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:wmFade .2s ease both}
.sheet{border-radius:28px 28px 0 0;box-shadow:var(--sh-3);animation:wmUp .32s var(--ease) both;position:relative;padding-top:22px!important}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:9px;background:var(--line)}
.sheet-head h3{font-size:20px;letter-spacing:-.01em}
.x{border-radius:50%!important;background:var(--field)!important;width:36px;height:36px;display:grid;place-items:center;border:0!important}
.toast{border-radius:16px!important;box-shadow:var(--sh-3)!important;font-weight:700;animation:wmToast .35s var(--ease) both;backdrop-filter:blur(6px)}
/* draggable order bubble */
#orderBubble{position:fixed;z-index:55;width:74px;height:74px;border-radius:50%;background:var(--green,#0b5c2f);display:none;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.35);border:3px solid #fff;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#orderBubble.show{display:flex}
#orderBubble .ebadge{position:absolute;top:-10px;right:-14px;background:#E8A100;color:#3a2a00;font-weight:800;font-size:11px;border-radius:14px;padding:4px 8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#orderBubble .blabel{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap;pointer-events:none}
@keyframes wmFade{from{opacity:0}to{opacity:1}}
@keyframes wmUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes wmToast{from{transform:translate(-50%,16px) scale(.96);opacity:0}}
@keyframes wmPop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
/* Loading skeleton */
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--field) 37%,var(--line) 63%);background-size:400% 100%;animation:wmShim 1.3s ease infinite;border-radius:14px}
@keyframes wmShim{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* Switch */
.switch span{transition:background .2s}
/* Scrollbars */
*::-webkit-scrollbar{height:0;width:6px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Docked bottom navigation (full-width, like Foodpanda/Daraz) */
.nav{left:0!important;right:0!important;transform:none!important;width:100%!important;bottom:0!important;border-radius:0!important;
  border:0!important;border-top:1px solid var(--line)!important;box-shadow:0 -4px 20px rgba(0,0,0,.08)!important;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))!important;

/* ===== Dera design system v3 ===== */
:root{
  --paper:#FFF9F1; --surface:#FFFFFF; --ink:#12201A; --muted:#5E6D65; --line:#EFE4D8; --soft:#E5F1EA; --field:#FFF3E8;
  --green:#0B7D4F; --green-dark:#086640; --green-2:#14A064; --forest:#0B3A2B; --marigold:#FFB400; --danger:#D23B2E; --blue:#2463B5; --deal:#E2472F;
  --brand:#E8722A; --brand-dark:#C65E1B; --brand-2:#F0923F; --brand-deep:#B34E14;
  --r-sm:12px; --r:16px; --r-lg:24px;
  --sh-1:0 1px 2px rgba(16,32,24,.05);
  --sh-2:0 8px 20px -10px rgba(16,32,24,.22),0 1px 2px rgba(16,32,24,.05);
  --sh-3:0 24px 50px -14px rgba(8,28,20,.38);
  --grad:var(--brand); --grad-gold:var(--marigold);

// ================= THEME: LIGHT / DARK / AUTO (same code in all apps) =================
// The apps already have dark colours inside "@media (prefers-color-scheme: dark)". This switch turns
// those blocks always-on (Dark), always-off (Light) or back to following the phone (Auto).
const Theme = (() => {
  const KEY = 'kh_theme', DARK_Q = /prefers-color-scheme\s*:\s*dark/i, LIGHT_Q = /prefers-color-scheme\s*:\s*light/i;
  const known = new Map();   // rule -> its original media text (kept so the same rule object is found again)
  const get = () => { try { return localStorage.getItem(KEY) || 'light'; } catch (e) { return 'light'; } };
  function walk(rules, mode){
    for (const r of rules){
      if (r.media && r.cssRules){
        if (!known.has(r)) known.set(r, r.media.mediaText); const orig = known.get(r);
        const want = DARK_Q.test(orig) ? (mode === 'dark' ? 'all' : mode === 'light' ? 'not all' : orig)
                   : LIGHT_Q.test(orig) ? (mode === 'light' ? 'all' : mode === 'dark' ? 'not all' : orig) : null;
        if (want !== null && r.media.mediaText !== want){ try { r.media.mediaText = want; } catch (e) {} }
        if (r.cssRules) walk(r.cssRules, mode);
      }
    }
  }
  function apply(mode){
    mode = mode || get();
    for (const sh of document.styleSheets){ try { walk(sh.cssRules, mode); } catch (e) {} }
    const dark = mode === 'dark' || (mode === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches);
    document.documentElement.dataset.theme = dark ? 'dark' : 'light';
    document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
    const m = document.querySelector('meta[name=theme-color]'); if (m){ if (!m.dataset.light) m.dataset.light = m.content; m.content = dark ? '#0E1A14' : m.dataset.light; }
  }
  function set(mode){ try { localStorage.setItem(KEY, mode); } catch (e) {} apply(mode); document.querySelectorAll('.themesw button').forEach(b => b.classList.toggle('on', b.dataset.m === mode)); }
  function picker(lang){
    const ur = lang === 'ur'; const cur = get();
    const L = ur ? { t:'ایپ کا رنگ', light:'☀️ روشن', dark:'🌙 گہرا', auto:'📱 فون جیسا' } : { t:'App theme', light:'☀️ Light', dark:'🌙 Dark', auto:'📱 Auto' };
    return `<div class="themebox"><b>${L.t}</b><div class="themesw">${['light', 'dark', 'auto'].map(m => `<button type="button" data-m="${m}" class="${cur === m ? 'on' : ''}" onclick="Theme.set('${m}')">${L[m]}</button>`).join('')}</div></div>`;
  }
  // new <style> tags (chat, dialogs) get the same treatment
  try { new MutationObserver(ms => { if (get() !== 'auto' && ms.some(m => [...m.addedNodes].some(n => n.tagName === 'STYLE'))) apply(); }).observe(document.head, { childList:true }); } catch (e) {}
  try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (get() === 'auto') apply('auto'); }); } catch (e) {}
  const st = document.createElement('style');
  st.textContent = `.themebox{display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;margin:10px 0}
.themesw{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;background:var(--field,#F1F4F0);border-radius:12px;padding:4px}
.themesw button{border:0;background:transparent;color:var(--ink);border-radius:9px;padding:9px 4px;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.themesw button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15)}`;
  document.head.appendChild(st);
  apply();
  return { apply, set, get, picker };
})();

// uiConfirm / uiPrompt look like the app instead of the browser's grey "site says" box.
const UI = (() => {

  const DANGER = /\b(delete|remove|block|reject|disconnect|log ?out|take back|stop|cancel this|forfeit|reset)\b|حذف|ختم|بلاک|منسوخ/i;

    document.head.appendChild(s);
  }
  function open(msg, o){
    style();
    return new Promise(res => {
      const w = W(); const danger = o.danger ?? (!o.input && DANGER.test(msg));
      const d = document.createElement('div'); d.className = 'uidlg'; d.setAttribute('role', 'dialog'); d.setAttribute('aria-modal', 'true');
      d.innerHTML = `<div class="box"><div class="ic ${danger ? 'd' : ''}">${o.icon || (o.input ? '✏️' : danger ? '⚠️' : o.alert ? 'ℹ️' : '❓')}</div><div class="msg">${esc(msg)}</div>
        ${o.input ? `<input type="${o.type || 'text'}" value="${esc(o.value ?? '')}" ${o.type === 'number' ? 'inputmode="decimal"' : ''}>` : ''}
        <div class="bt ${o.alert ? 'one' : ''}">${o.alert ? '' : `<button type="button" class="no">${esc(o.cancel || w.cancel)}</button>`}<button type="button" class="yes ${danger ? 'd' : ''}">${esc(o.ok || w.ok)}</button></div></div>`;
      const prev = document.activeElement;
      const done = v => { d.remove(); document.removeEventListener('keydown', key, true); try { prev && prev.focus && prev.focus(); } catch (e) {} res(v); };
      const inp = d.querySelector('input');
      const ok = () => done(o.input ? inp.value : true);
      const no = () => done(o.input ? null : false);
      const key = e => { if (e.key === 'Escape'){ e.preventDefault(); e.stopPropagation(); no(); } else if (e.key === 'Enter' && (!inp || document.activeElement === inp)){ e.preventDefault(); ok(); } };
      d.querySelector('.yes').onclick = ok; const n = d.querySelector('.no'); if (n) n.onclick = no;
      d.addEventListener('click', e => { if (e.target === d && !o.alert) no(); });
      document.addEventListener('keydown', key, true);
      document.body.appendChild(d);
      setTimeout(() => { if (inp){ inp.focus(); inp.select(); } else d.querySelector('.yes').focus(); }, 30);
    });
  }
  const confirm = (msg, o) => open(String(msg ?? ''), Object.assign({}, o));
  const prompt = (msg, value, o) => open(String(msg ?? ''), Object.assign({ input:true, value:value ?? '' }, o));
  const alert = (msg, o) => open(String(msg ?? ''), Object.assign({ alert:true }, o));
  // show / hide password on every password field
  const EYE = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>';
  const EYE_OFF = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.5 10.5 0 0 1 12 5c6.4 0 10 7 10 7a17 17 0 0 1-3.2 4.1M6.6 6.6C3.8 8.4 2 12 2 12s3.6 7 10 7a9.8 9.8 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

  if (!lat || !lng || !zones.length) return null;
  const inCircle = (z, clat, clng, rkm) => kmBetween(lat, lng, Number(clat), Number(clng)) <= num(rkm || 5);
  // inside main circle or any extra circle?
  for (const z of zones){
    if (inCircle(z, z.center_lat, z.center_lng, z.radius_km)) return z.id;
    for (const c of (z.extra_circles || [])){
      if (inCircle(z, c.lat, c.lng, c.r)) return z.id;

const svcTrade = r => { const k = ((r && r.categories) || []).find(x => SERVICE_CATS.some(c => c.k === x)); const c = SERVICE_CATS.find(c => c.k === k); return c ? { k, label:c.i + ' ' + (state.lang === 'ur' ? c.ur : c.en) } : null; };

const shopDisc = (r, sub) => { const f = r && r.offer; if (!f || !f.on || !num(f.pct) || sub < num(f.min)) return 0; let d = Math.round(sub * Math.min(90, num(f.pct)) / 100); if (num(f.max) > 0) d = Math.min(d, num(f.max)); return d; };

function filterChips(){ return `<div class="typerow">${['all','offer','top','fast','pick','free'].map(k => `<button class="chip2 ${(state.shopF || 'all') === k ? 'on' : ''}" onclick="A.setShopF('${k}')">${t('f_' + k)}</button>`).join('')}</div>`; }

const winOff = i => { if (!i || !i.avail_from || !i.avail_to) return false; const f = String(i.avail_from).slice(0, 5), u = String(i.avail_to).slice(0, 5); if (f === u) return false; const nw = new Date(new Date().toLocaleString('en-US', { timeZone:'Asia/Karachi' })); const m = nw.getHours() * 60 + nw.getMinutes(); const fm = +f.slice(0, 2) * 60 + +f.slice(3), um = +u.slice(0, 2) * 60 + +u.slice(3); return fm <= um ? (m < fm || m >= um) : (m < fm && m >= um); };
const winBadge = i => i && i.avail_from && i.avail_to ? `<span class="leftb">⏰ ${t('win_only')} ${fmtWinT(i.avail_from)}–${fmtWinT(i.avail_to)}</span>` : '';

}

async function loadRecoData(){
  if (!state.user || state.recoLoaded) return;
  state.recoLoaded = true; state.recoBuys = {}; state.recoViews = {};
  try {
    const { data: orders } = await sb.from('orders').select('id, order_items(menu_item_id, quantity)').eq('customer_id', state.user.id).in('status', ['delivered', 'completed']).order('created_at', { ascending:false }).limit(60);
    (orders || []).forEach(o => (o.order_items || []).forEach(it => {
      if (!it.menu_item_id) return;
      const b = state.recoBuys[it.menu_item_id] || (state.recoBuys[it.menu_item_id] = { times:0, qty:0 });
      b.times += 1; b.qty += (it.quantity || 1);
    }));
  } catch (e) {}
  try {
    const { data: views } = await sb.from('product_views').select('menu_item_id').eq('user_id', state.user.id).order('created_at', { ascending:false }).limit(120);
    (views || []).forEach(v => { if (v.menu_item_id) state.recoViews[v.menu_item_id] = (state.recoViews[v.menu_item_id] || 0) + 1; });
    // Recently viewed: unique items, most recent first
    const seen = new Set(); state.recoRecent = [];
    (views || []).forEach(v => { if (v.menu_item_id && !seen.has(v.menu_item_id)){ seen.add(v.menu_item_id); state.recoRecent.push(v.menu_item_id); } });
    state.recoRecent = state.recoRecent.slice(0, 10);
  } catch (e) {}
}
function recoScore(p){
  if (!p || !p.id) return 0;
  const buys = (state.recoBuys || {})[p.id];
  let s = 0;
  if (buys) s += buys.times * 10;
  if (isFav(p.id)) s += 8;
  s += Math.min((state.recoViews || {})[p.id] || 0, 5) * 2;
  if (!buys && state.recoBuys){
    const shopIds = new Set();
    Object.keys(state.recoBuys).forEach(id => { const it = state.itemsCache[id]; if (it && it.restaurant_id) shopIds.add(it.restaurant_id); });
    if (shopIds.has(p.restaurant_id)) s += 5;
  }
  try {
    const hr = parseInt(new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Karachi', hour:'2-digit', hour12:false }).format(new Date()), 10);
    const nm = (p.name || '').toLowerCase();
    const morning = hr >= 6 && hr < 11, night = hr >= 19 || hr < 2;
    if (morning && /(nashta|breakfast|paratha|halwa|chai|tea|milk|bread|egg|omelet)/.test(nm)) s += 4;
    if (night && /(burger|pizza|fries|shawarma|broast|bbq|tikka|fast)/.test(nm)) s += 4;
  } catch (e) {}
  return s;
}
function recoSections(PR){
  if (!state.user) return '';
  const buys = state.recoBuys || {};
  const avail = p => p && p.is_available !== false;
  const withShop = p => { if (p && !p._shop && p.restaurant_id){ const r = (state.restaurants || []).find(x => x.id === p.restaurant_id); if (r) p._shop = r; } return p; };
  let html = '';
  // 1. Reorder: bought before, most frequent first
  const reorderIds = Object.keys(buys).sort((a, b) => buys[b].times - buys[a].times).slice(0, 10);
  const reorderItems = reorderIds.map(id => withShop(state.itemsCache[id] || PR.find(p => p.id === id))).filter(avail);
  if (reorderItems.length) html += `<h2>${t('reco_reorder')}</h2><div class="muted" style="font-size:12.5px;margin:-6px 0 8px">${t('reco_reorder_sub')}</div><div class="hscroll">${reorderItems.map(p => productCard(p, t('reco_times', { n: buys[p.id].times }))).join('')}</div>`;
  // 2. For you: scored, excluding already-bought
  const scored = PR.filter(p => avail(p) && !buys[p.id]).map(p => ({ p: withShop(p), s: recoScore(p) })).filter(x => x.s >= 8).sort((a, b) => b.s - a.s).slice(0, 10);
  if (scored.length){
    const maxS = scored[0].s || 1;
    html += `<h2>${t('reco_foryou')}</h2><div class="muted" style="font-size:12.5px;margin:-6px 0 8px">${t('reco_foryou_sub')}</div><div class="hscroll">${scored.map(x => productCard(x.p, `<span class="matchtag">${t('reco_match', { n: Math.min(99, Math.round(60 + 39 * x.s / maxS)) })}</span>`)).join('')}</div>`;
  }
  // 3. Popular near you: top sold items in region
  const popular = PR.filter(p => avail(p) && !buys[p.id] && sold(p.id) > 0).sort((a, b) => sold(b.id) - sold(a.id)).slice(0, 10);
  if (popular.length) html += `<h2>${t('reco_popular')}</h2><div class="muted" style="font-size:12.5px;margin:-6px 0 8px">${t('reco_popular_sub')}</div><div class="hscroll">${popular.map(p => productCard(withShop(p), t('reco_orders', { n: sold(p.id) }))).join('')}</div>`;
  // 4. Recently viewed
  const recent = (state.recoRecent || []).map(id => withShop(state.itemsCache[id] || PR.find(p => p.id === id))).filter(avail).slice(0, 10);
  if (recent.length) html += `<h2>${t('reco_recent')}</h2><div class="muted" style="font-size:12.5px;margin:-6px 0 8px">${t('reco_recent_sub')}</div><div class="hscroll">${recent.map(p => productCard(p)).join('')}</div>`;
  return html;
}

// Normalizes a pay_accounts jsonb (new {accounts:[...]} shape OR legacy

function payAccList(p){
  if (!p || typeof p !== 'object' || !p.on) return [];
  const out = [];
  const push = e => { if (e && (e.number || e.iban || e.raast_id || e.qr_url)) out.push(e); };
  if (Array.isArray(p.accounts)){
    for (const a of p.accounts){
      if (!a) continue;
      const type = String(a.type || '').toLowerCase();
      let label = a.label || '';
      if (!label){
        if (type === 'jazzcash') label = 'JazzCash';
        else if (type === 'easypaisa') label = 'Easypaisa';
        else if (type === 'bank') label = a.bank || 'Bank / Raast';
        else label = type ? type.charAt(0).toUpperCase() + type.slice(1) : 'Account';
      }
      push({ label, number:a.number || '', title:a.title || '', iban:a.iban || '', raast_id:a.raast_id || '', qr_url:a.qr_url || '' });
    }
    return out;
  }
  if (p.jazzcash) push({ label:'JazzCash', number:p.jazzcash.number || '', title:p.jazzcash.title || '', iban:'', raast_id:'', qr_url:'' });
  if (p.easypaisa) push({ label:'Easypaisa', number:p.easypaisa.number || '', title:p.easypaisa.title || '', iban:'', raast_id:'', qr_url:'' });
  if (p.bank) push({ label:(p.bank.bank || 'Bank / Raast'), number:'', title:p.bank.title || '', iban:p.bank.iban || '', raast_id:p.bank.raast_id || '', qr_url:'' });
  if (p.qr_url) push({ label:'QR', number:'', title:'', iban:'', raast_id:'', qr_url:p.qr_url });
  return out;
}

  if (active || !['delivered','cancelled'].includes(o.status)) return history;

}
function toggleRefundForm(){
  const wrap = document.getElementById('refundFormWrap');
  if (!wrap) return;
  wrap.hidden = !wrap.hidden;
  if (!wrap.hidden) document.getElementById('refundReason')?.focus();
}
async function submitRefundRequest(orderId){
  const button = document.getElementById('refundSubmitBtn'), reasonEl = document.getElementById('refundReason'), errorEl = document.getElementById('refundError');
  if (!state.user) { if (errorEl) { errorEl.textContent = 'Please sign in to submit a refund request.'; errorEl.hidden = false; } return; }
  if (!state.curOrder || state.curOrder.id !== orderId || !['delivered','cancelled'].includes(state.curOrder.status)) return;
  const reason = reasonEl && reasonEl.value.trim();
  if (!reason || reason.length < 8 || reason.length > 2000) { if (errorEl) { errorEl.textContent = 'Please enter a reason between 8 and 2000 characters.'; errorEl.hidden = false; } reasonEl?.focus(); return; }
  if (button) { button.disabled = true; button.textContent = 'Submitting…'; }
  if (errorEl) errorEl.hidden = true;
  try {
    const { data, error } = await sb.rpc('customer_create_refund_request', { p_order_id:orderId, p_reason:reason });
    if (error) throw error;
    if (!data) throw new Error('The request was not created. Please try again.');
    await showOrder(orderId);
  } catch (e) {
    if (errorEl) { errorEl.textContent = e && e.message ? e.message : 'Could not submit your request. Please try again.'; errorEl.hidden = false; }
    if (button) { button.disabled = false; button.textContent = 'Submit request'; }
  }
}

let track = null, riderTimer = null;
const showTrackMap = o => !['pickup','dinein'].includes(o.order_type) && !FINAL.includes(o.status) && ((o.address_lat != null) || (o.restaurant && o.restaurant.lat != null));
async function mountTrackMap(o, rider){
  const slot = $('mapSlot'); if (!slot) return;
  if (track && track.id === o.id && track.el){ slot.appendChild(track.el); setTimeout(() => track.map.invalidateSize(), 50); if (rider && rider.lat) updateRiderPin(rider); return; }
  let L; try { L = await loadLeaflet(); } catch (e) { slot.innerHTML = `<div class="muted">${t('map_fail')}</div>`; return; }
  if (!$('mapSlot')) return;
  if (track && track.map){ try { track.map.remove(); } catch (e) {} }
  const el = document.createElement('div'); el.className = 'mapbox'; $('mapSlot').appendChild(el);
  const pts = [];
  const map = baseMap(L, el, o.address_lat != null ? [o.address_lat, o.address_lng] : [o.restaurant.lat, o.restaurant.lng], 15);
  if (o.restaurant && o.restaurant.lat != null){ L.marker([o.restaurant.lat, o.restaurant.lng], { icon:pinIcon(L, '🏪', '#0F766E') }).addTo(map).bindTooltip(t('shop_word')); pts.push([o.restaurant.lat, o.restaurant.lng]); }
  if (o.address_lat != null){ L.marker([o.address_lat, o.address_lng], { icon:pinIcon(L, '🏠', '#1F6F4A') }).addTo(map).bindTooltip(t('you')); pts.push([o.address_lat, o.address_lng]); }
  track = { id:o.id, el, map, L, rider:null };
  if (rider && rider.lat){ updateRiderPin(rider); pts.push([rider.lat, rider.lng]); }
  if (pts.length > 1) map.fitBounds(pts, { padding:[40, 40], maxZoom:16 });
  setTimeout(() => map.invalidateSize(), 250);
}
function updateRiderPin(r){
  if (!track || !track.map) return;
  const ll = [r.lat, r.lng];
  if (!track.rider) track.rider = track.L.marker(ll, { icon:pinIcon(track.L, '🛵', '#F2A900'), zIndexOffset:1000 }).addTo(track.map).bindTooltip(t('rider_word'));
  else track.rider.setLatLng(ll);
  const o = state.curOrder; const k = document.querySelector('.rkm');
  if (k && o && o.address_lat != null) k.textContent = '🛵 ' + t('rider_km', { km:kmBetween(r.lat, r.lng, o.address_lat, o.address_lng).toFixed(1) });
}

const seenAlerts = new Set(ls.get('kh_seen_alerts', []));

let checking = false;
async function checkAlerts(){
  if (!state.user || checking) return; checking = true;
  try {
    const since = new Date(Date.now() - 3 * 3600e3).toISOString();
    const { data:ords } = await sb.from('orders').select('id,status,arrived_at,failed_delivery,created_at,delivered_at,customer_received_at,customer_disputed,rider_due_at,restaurant:restaurants(name)')
      .eq('customer_id', state.user.id).gte('created_at', since).order('created_at', { ascending:false }).limit(20);
    const list = ords || []; if (!list.length){ updateOrderBubble(null); return; }
    list.forEach(o => {
      if (o.status === 'picked_up' && o.arrived_at) pushAlert('arr-' + o.id, t('m_arrived'), o.id, true);
      if (o.failed_delivery) pushAlert('fail-' + o.id, t('m_failed'), o.id);
    });
    const del = list.find(o => o.status === 'delivered' && !o.customer_received_at && !o.customer_disputed && !seenAlerts.has('recv-' + o.id));
    if (del) showRecvPopup(del);
    const live = list.filter(o => !FINAL.includes(o.status)).map(o => o.id);
    updateOrderBubble(list.find(o => !FINAL.includes(o.status)) || null);
    if (live.length){
      const { data:iss } = await sb.from('order_issues').select('id,order_id,kind,reported_by').in('order_id', live).eq('status', 'open');
      (iss || []).filter(i => i.kind !== 'chat_help' && i.reported_by !== state.user.id).forEach(i => pushAlert('iss-' + i.id, t('m_' + i.kind), i.order_id));

}
/* ---- draggable order bubble ---- */
let bubbleOrder = null;
function bubbleEta(o){
  if (o.status === 'picked_up' && o.rider_due_at){
    const mins = Math.max(1, Math.round((new Date(o.rider_due_at) - Date.now()) / 60000));
    return '~' + mins + ' ' + t('minutes');
  }
  return null;
}
function ensureBubble(){
  let b = $('orderBubble');
  if (b) return b;
  b = document.createElement('div');
  b.id = 'orderBubble';
  b.innerHTML = `🛵<span class="ebadge"></span><span class="blabel">${t('your_order') || 'Your order'}</span>`;
  document.body.appendChild(b);
  // drag logic
  let sx=0, sy=0, bx=0, by=0, dragging=false, moved=0;
  const pos = () => ({ x: parseFloat(b.dataset.x || (innerWidth - 96)), y: parseFloat(b.dataset.y || 320) });
  const setPos = (x, y) => {
    x = Math.max(8, Math.min(innerWidth - 82, x));
    y = Math.max(80, Math.min(innerHeight - 170, y));
    b.dataset.x = x; b.dataset.y = y;
    b.style.left = x + 'px'; b.style.top = y + 'px'; b.style.right = 'auto'; b.style.bottom = 'auto';
  };
  try { const saved = JSON.parse(ls.get('kh_bubble_pos') || 'null'); if (saved) { b.dataset.x = saved.x; b.dataset.y = saved.y; } } catch(e){}
  const p0 = pos(); setPos(p0.x, p0.y);
  b.addEventListener('pointerdown', e => {
    dragging = true; moved = 0; sx = e.clientX; sy = e.clientY;
    const p = pos(); bx = p.x; by = p.y;
    try { b.setPointerCapture(e.pointerId); } catch(e2){}
    b.style.cursor = 'grabbing';
  });
  b.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - sx, dy = e.clientY - sy;
    moved = Math.max(moved, Math.abs(dx) + Math.abs(dy));
    if (moved > 8) setPos(bx + dx, by + dy);
  });
  const end = e => {
    if (!dragging) return; dragging = false; b.style.cursor = 'grab';
    try { ls.set('kh_bubble_pos', JSON.stringify({ x: parseFloat(b.dataset.x), y: parseFloat(b.dataset.y) })); } catch(e2){}
    b.dataset.moved = moved;
  };
  b.addEventListener('pointerup', end);
  b.addEventListener('pointercancel', end);
  b.addEventListener('click', e => {
    e.stopPropagation();
    if (parseFloat(b.dataset.moved || 0) < 12 && bubbleOrder){
      try { closeSheet(); } catch(e2){}
      nav('/order/' + bubbleOrder.id);
    }
    b.dataset.moved = 0;
  });
  return b;
}
function updateOrderBubble(activeOrder){
  const b = ensureBubble();
  bubbleOrder = activeOrder || null;
  if (!bubbleOrder){ b.classList.remove('show'); return; }
  const badge = b.querySelector('.ebadge');
  const eta = bubbleEta(bubbleOrder);
  badge.textContent = eta || ({ placed:'📝', accepted:'✅', preparing:'👨‍🍳', picked_up:'🛵', on_way:'🛵', arrived:'📍' }[bubbleOrder.status] || '🛵');
  badge.style.display = '';
  b.querySelector('.blabel').textContent = t('your_order') || 'Your order';
  b.classList.add('show');
}

// App khulne par login user ka FCM token device_tokens mein save hota hai,
// taake Admin app se push bheja ja sake. Koi error login ko kabhi nahi rokti.
function handleCallPush(d){
  try {
    if (!d || d.type !== 'call') return false;
    const rec = { thread: d.thread, orderId: d.orderId || null, ts: Date.now() };
    try { localStorage.setItem('dera_pending_call', JSON.stringify(rec)); } catch (e) {}
    try { if (typeof Chat !== 'undefined' && Chat.consumePendingCall) Chat.consumePendingCall(); } catch (e) {}
    return true;
  } catch (e) { return false; }
}
const FCM = {
  app: 'customer',
  done: false,
  async register(uid){
    try {
      if (this.done) return; this.done = true;
      const Cap = window.Capacitor;
      const PN = Cap && Cap.Plugins && Cap.Plugins.PushNotifications;
      if (!PN || !uid) return;
      const saved = new Promise((res) => {
        try {
          PN.addListener('registration', async (tok) => {
            try {
              if (tok && tok.value) await sb.from('device_tokens').upsert({ user_id: uid, token: tok.value, platform: 'android', app: FCM.app, updated_at: new Date().toISOString() }, { onConflict: 'token' });
            } catch (e) {}
            res();
          });
          PN.addListener('registrationError', () => res());
        } catch (e) { res(); }
        setTimeout(res, 10000);
      });
      const perm = await PN.requestPermissions();
      if (!perm || perm.receive === 'denied') return;
      await PN.register();
      await saved;
      try {
        PN.addListener('pushNotificationReceived', async (n) => {
          try {
            try { if (n && n.data) handleCallPush(n.data); } catch (e) {}
            const LN = Cap.Plugins.LocalNotifications;
            if (!LN || !n) return;
            await LN.schedule({ notifications: [{ id: Date.now() % 2147483647, title: n.title || 'Dera', body: n.body || '', extra: n.data || {} }] });
          } catch (e) {}
        });

  // ---- Voice calls (WebRTC, audio-only, in-app; NO phone numbers anywhere) ----

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      if (callSt) callSt.noAnsTimer = setTimeout(() => {
        try { if (callSt && callSt.state === 'calling') { callSend(callSt.orderId, callSt.thread, { type: 'hangup' }, callSt.peerKey); callEnd(tr('no_answer')); } } catch (x) {}
      }, CALL_NOANSWER_MS);
      const ok = await callSend(orderId, thread, { type: 'offer', sdp: offer, video: !!video }, peerKey);
      if (!ok) { callEnd(tr('call_failed')); return; }
      callPushNotify(orderId, thread, peerKey, !!video);
    } catch (x) { try { callEnd(tr('call_failed')); } catch (y) {} }
  }
  async function callOnSignal(orderId, thread, p, peerKey){
    try {
      if (!p || p.from === me()) return;
      const type = p.type;
      if (type === 'offer') {
        if (callSt && callSt.orderId === orderId && callSt.thread === thread && callSt.state === 'incoming' && (!thread.startsWith('sup') || !peerKey || !callSt.peerKey || callSt.peerKey === peerKey)) return;
        if (callSt) { await callSend(orderId, thread, { type: 'busy' }, peerKey); return; }
        if (orderId) {
          try {
            const { data: od } = await sb.from('orders').select('status').eq('id', orderId).single();
            if (od && ['delivered','cancelled'].includes(od.status)) { await callSend(orderId, thread, { type: 'decline' }, peerKey); return; }
          } catch (x) {}
        }
        const peerName = await callPeerName(orderId, thread);
        if (callSt) { await callSend(orderId, thread, { type: 'busy' }, peerKey); return; }
        callSt = { orderId, thread, state: 'incoming', peerName, muted: false, pendCand: [], durSec: null, offer: p.sdp, video: !!p.video, peerKey: peerKey || null, speaker: false };
        callShow();
        try { if (cfg.ding) cfg.ding(); } catch (x) {}
        if (callSt) callSt.ringTimer = setInterval(() => { try { if (callSt && callSt.state === 'incoming' && cfg.ding) cfg.ding(); } catch (x) {} }, 3000);
        return;
      }
      if (type === 'call-ready') {
        const cs = callSt;
        if (cs && cs.state === 'calling' && cs.orderId === orderId && cs.thread === thread && cs.pc && cs.pc.localDescription) {
          try { await callSend(orderId, thread, { type: 'offer', sdp: cs.pc.localDescription, video: !!cs.video }, cs.peerKey); } catch (x) {}
        }
        return;
      }
      const s = callSt;
      if (!s || s.orderId !== orderId || s.thread !== thread) return;
      if (thread && thread.startsWith('sup') && peerKey && s.peerKey && s.peerKey !== peerKey) return;
      if (type === 'answer') {
        if (s.state !== 'calling') return;
        if (s.noAnsTimer) { clearTimeout(s.noAnsTimer); s.noAnsTimer = null; }
        try {
          await s.pc.setRemoteDescription(p.sdp);
          if (s.state === 'calling') { s.state = 'connecting'; callShow(); }
          const q = s.pendCand; s.pendCand = [];
          for (const c of q) { try { await s.pc.addIceCandidate(c); } catch (x) {} }
        } catch (x) { callEnd(tr('call_failed')); }
        return;
      }
      if (type === 'ice-candidate') {
        try {
          if (!s.pc) { s.pendCand.push(p.candidate); return; }
          if (s.pc.remoteDescription) await s.pc.addIceCandidate(p.candidate);
          else s.pendCand.push(p.candidate);
        } catch (x) {}
        return;
      }
      if (type === 'hangup') { callEnd(s.state === 'in-call' ? tr('call_ended') : null); return; }
      if (type === 'decline') { if (s.state === 'calling') callEnd(tr('declined')); return; }
      if (type === 'busy') { if (s.state === 'calling') callEnd(tr('busy')); return; }
    } catch (x) {}
  }
  async function callAccept(){
    try {
      const s = callSt; if (!s || s.state !== 'incoming' || !s.offer) return;
      if (s.ringTimer) { clearInterval(s.ringTimer); s.ringTimer = null; }
      let stream;
      try { stream = await navigator.mediaDevices.getUserMedia({ audio: true, video: !!s.video }); }
      catch (x) { await callSend(s.orderId, s.thread, { type: 'decline' }, s.peerKey); callEnd(tr('mic_denied')); return; }
      if (!callSt || callSt !== s) { try { stream.getTracks().forEach(t => t.stop()); } catch (x) {} return; }
      s.stream = stream;
      const pc = callNewPc(s); s.pc = pc;
      stream.getTracks().forEach(t => pc.addTrack(t, stream));
      try {
        await pc.setRemoteDescription(s.offer);
        const ans = await pc.createAnswer();
        await pc.setLocalDescription(ans);
        if (s.state === 'incoming') { s.state = 'connecting'; callShow(); }
        const q = s.pendCand; s.pendCand = [];
        for (const c of q) { try { await pc.addIceCandidate(c); } catch (x) {} }
        const ok = await callSend(s.orderId, s.thread, { type: 'answer', sdp: ans }, s.peerKey);
        if (!ok) { callEnd(tr('call_failed')); return; }
      } catch (x) { callEnd(tr('call_failed')); }
    } catch (x) { try { callEnd(tr('call_failed')); } catch (y) {} }
  }
  async function callDecline(){
    try { const s = callSt; if (s && s.state === 'incoming') await callSend(s.orderId, s.thread, { type: 'decline' }, s.peerKey); } catch (x) {}
    callEnd(null);
  }
  async function callCancel(){
    try { const s = callSt; if (s && s.state === 'calling') await callSend(s.orderId, s.thread, { type: 'hangup' }, s.peerKey); } catch (x) {}
    callEnd(null);
  }
  async function callHangup(){
    try { const s = callSt; if (s) await callSend(s.orderId, s.thread, { type: 'hangup' }, s.peerKey); } catch (x) {}
    callEnd(null);
  }
  function callMute(){
    try {
      const s = callSt; if (!s || !s.stream) return;
      s.muted = !s.muted;
      s.stream.getAudioTracks().forEach(t => { t.enabled = !s.muted; });
      callShow();
    } catch (x) {}
  }
  async function callSpeaker(){
    try {
      const s = callSt; if (!s) return; s.speaker = !s.speaker;
      const el = s.remoteEl || document.getElementById('callRemoteV');
      if (el && el.setSinkId) {
        try {
          const devs = await navigator.mediaDevices.enumerateDevices();
          const outs = devs.filter(d => d.kind === 'audiooutput');
          const spk = outs.find(d => /speaker/i.test(d.label || ''));
          await el.setSinkId(s.speaker && spk ? spk.deviceId : 'default');
        } catch (x) {}
      } else if (cfg.toast && s.speaker) cfg.toast(tr('speaker_sys'));
      callShow();
    } catch (x) {}
  }
  return { init, stop, refresh, button, inbox, open, close, send, label, askJoin, sendPhoto, sendLoc, callStart, callAccept, callDecline, callCancel, callHangup, callMute, callSpeaker, consumePendingCall };
})();

// ================= PUSH + INSTALL (same code in all four apps) =================
const Push = (() => {
  const VAPID = 'BB7DLfT-2lWO5GdEBRw40xpz0jVcRYmXrjlzn84Z__HZODNrLJueYsar3rEAMUqSOCSVEOHApgJzEDrxLM2z6-E';
  const L = {
    en:{ title:'Turn on notifications', text:'Get new orders, messages and updates even when the app is closed.', on:'Turn on', later:'Later',
         install:'Install app', install_t:'Add to home screen', ios:'On iPhone: tap Share ⬆️ then “Add to Home Screen”, open the app from there, then turn on notifications.',
         done:'Notifications are on', blocked:'Notifications are blocked. Allow them in your browser settings for this site.', fail:'Could not turn on notifications' },
    ur:{ title:'نوٹیفکیشن آن کریں', text:'ایپ بند ہو تب بھی نئے آرڈر، میسج اور اپڈیٹس ملیں گے۔', on:'آن کریں', later:'بعد میں',
         install:'ایپ انسٹال کریں', install_t:'ہوم اسکرین پر لگائیں', ios:'آئی فون پر: Share ⬆️ دبائیں پھر “Add to Home Screen”، وہاں سے ایپ کھولیں، پھر نوٹیفکیشن آن کریں۔',
         done:'نوٹیفکیشن آن ہو گئے', blocked:'نوٹیفکیشن بند ہیں۔ براؤزر کی سیٹنگ میں اس سائٹ کے لیے اجازت دیں۔', fail:'نوٹیفکیشن آن نہیں ہو سکے' }
  };
  let cfg = null, deferred = null;
  const tt = k => (L[(cfg && cfg.lang && cfg.lang()) === 'ur' ? 'ur' : 'en'][k]);
  const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const isIOS = () => /iphone|ipad|ipod/i.test(navigator.userAgent);
  const b64 = s => { const p = '='.repeat((4 - s.length % 4) % 4); const r = atob((s + p).replace(/-/g, '+').replace(/_/g, '/')); return Uint8Array.from([...r].map(c => c.charCodeAt(0))); };
  const snoozed = () => { try { return Number(localStorage.getItem('kh_push_later') || 0) > Date.now(); } catch (e) { return false; } };

  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; show(); });
  window.addEventListener('appinstalled', () => { deferred = null; show(); });

  async function reg(){ return navigator.serviceWorker.register('sw.js'); }
  async function subscribe(){
    const r = await reg(); await navigator.serviceWorker.ready;
    let s = await r.pushManager.getSubscription();
    if (!s) s = await r.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64(VAPID) });
    const j = s.toJSON();
    const { error } = await cfg.sb.rpc('save_push_subscription', { p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_app:cfg.app });
    if (error) throw error;
  }
  async function turnOn(){
    try {
      const p = await Notification.requestPermission();
      if (p !== 'granted'){ cfg.toast(tt('blocked'), true); hide(); return; }
      await subscribe(); cfg.toast(tt('done')); hide();
    } catch (e) { cfg.toast(tt('fail') + ': ' + (e.message || e), true); }
  }
  async function install(){ if (!deferred) return; deferred.prompt(); try { await deferred.userChoice; } catch (e) {} deferred = null; show(); }
  function later(){ try { localStorage.setItem('kh_push_later', String(Date.now() + 3 * 864e5)); } catch (e) {} hide(); }
  function hide(){ const el = document.getElementById('pushCard'); if (el) el.remove(); }
  function show(){
    hide();
    if (!cfg || snoozed()) return;
    const needPush = !!cfg.me() && supported() && Notification.permission === 'default';
    const iosHint = isIOS() && !standalone();
    if (!needPush && !deferred && !iosHint) return;
    const el = document.createElement('div'); el.id = 'pushCard';
    el.setAttribute('role', 'dialog');
    el.style.cssText = 'position:fixed;left:12px;right:12px;bottom:calc(84px + env(safe-area-inset-bottom));z-index:9000;max-width:460px;margin:0 auto;background:var(--surface,#fff);color:var(--ink,#1E2B25);border:1px solid var(--line,#DDE3DB);border-radius:18px;padding:14px 14px 12px;box-shadow:0 12px 32px rgba(0,0,0,.22);font-size:15px';
    const btn = 'border:0;border-radius:12px;padding:11px 14px;font:inherit;font-weight:800;cursor:pointer';
    el.innerHTML = `<div style="display:flex;gap:10px;align-items:flex-start"><div style="font-size:26px;line-height:1">🔔</div><div style="flex:1">
      <b style="font-size:16px">${needPush ? tt('title') : tt('install_t')}</b>
      <div style="color:var(--muted,#66746C);margin-top:2px">${iosHint ? tt('ios') : tt('text')}</div></div></div>
      <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap">
        ${needPush && !iosHint ? `<button data-a="on" style="${btn};background:var(--brand);color:#fff;flex:1">${tt('on')}</button>` : ''}
        ${deferred ? `<button data-a="inst" style="${btn};background:var(--marigold,#F2A900);color:#1E2B25;flex:1">${tt('install')}</button>` : ''}
        <button data-a="later" style="${btn};background:transparent;color:var(--muted,#66746C)">${tt('later')}</button></div>`;
    el.addEventListener('click', ev => { const a = ev.target.closest('button') && ev.target.closest('button').dataset.a; if (a === 'on') turnOn(); else if (a === 'inst') install(); else if (a === 'later') later(); });
    document.body.appendChild(el);
  }
  async function init(c){
    cfg = c;
    if (!('serviceWorker' in navigator)) return;
    try { await reg(); } catch (e) { return; }
    // Already allowed before: refresh the saved subscription quietly for this account
    if (supported() && Notification.permission === 'granted'){ try { await subscribe(); } catch (e) {} }
    setTimeout(show, 2500);
  }
  async function logout(){
    try {
      const r = await navigator.serviceWorker.getRegistration(); const sub = r && await r.pushManager.getSubscription();
      if (sub && cfg) await cfg.sb.from('push_subscriptions').delete().eq('endpoint', sub.endpoint);
    } catch (e) {}
    hide();
  }
  return { init, logout, turnOn, show, enabled:() => supported() && Notification.permission === 'granted' };
})();

  };

// ================= BACK BUTTON (same code in all four apps) =================
// Phone back button: closes the open popup first, then goes to the main tab, then asks "press back again to exit".
const BackNav = (() => {
  let cfg = null, pushed = 0, internal = 0, armed = false, armTimer = null, pushHash = [];
  const present = () => cfg.overlays.filter(([sel]) => document.querySelector(sel));
  function onMutate(){
    const n = present().length;
    while (pushed < n){ pushHash.push(location.hash); history.pushState({ wmov:pushed + 1 }, '', location.href); pushed++; }
    if (pushed > n){
      const extra = pushed - n; pushed = n;
      const h = pushHash.splice(n).pop();
      // Closed by a button (same page): remove our extra history steps. Closed because the page changed: leave history alone.
      if (h === location.hash && history.state && history.state.wmov){ internal++; history.go(-extra); }
    }
  }
  function guard(){ history.pushState({ wmg:1 }, '', location.href); }
  function onPop(ev){
    if (internal > 0){ internal--; return; }
    const st = ev.state || {};
    const open = present();
    if (open.length){
      // user pressed back while a popup is open: close the top one
      pushed = Math.max(0, pushed - 1); pushHash.pop();
      const [sel, close] = open[open.length - 1];
      try { close ? close() : document.querySelector(sel).remove(); } catch (e) { const el = document.querySelector(sel); if (el) el.remove(); }
      return;
    }
    if (st.wmov){ internal++; history.back(); return; }         // leftover popup step: skip it
    if (!st.wmb) return;                                          // normal page change (hash links) is handled by the app
    if (cfg.back && cfg.back()){ guard(); return; }               // went to main tab / home
    if (armed){ return; }                                         // second press: nothing left, phone closes the app
    armed = true; cfg.toast(cfg.exitMsg());
    clearTimeout(armTimer); armTimer = setTimeout(() => { armed = false; if (history.state && history.state.wmb) guard(); }, 2200);
  }
  function init(c){
    if (cfg) return; cfg = c;
    history.replaceState({ wmb:1 }, '', location.href); guard();
    window.addEventListener('popstate', onPop);
    new MutationObserver(onMutate).observe(document.body, { childList:true });
  }
  return { init };
})();

let obIdx = 0;
function showOnboard(){
  hideSplash();
  const slides = [['🛍️','ob1t','ob1d'],['📅','ob2t','ob2d'],['🛵','ob3t','ob3d']];
  const ov = document.createElement('div');
  ov.className = 'obover'; ov.id = 'obover';
  const paint = () => {
    ov.innerHTML = `<button class="obskip" onclick="obGo(-1)">${t('ob_skip')}</button>
    <div class="obbody" id="obbody">${slides.map(([e,tk,dk],i) => `<div class="obslide"><div class="obemo">${e}</div><h2>${t(tk)}</h2><p>${t(dk)}</p></div>`).join('')}</div>
    <div class="obfoot"><div class="obdots">${slides.map((_,i) => `<i class="${i===obIdx?'on':''}"></i>`).join('')}</div>
    <button class="btn" onclick="obGo(1)">${t(obIdx === slides.length-1 ? 'ob_start' : 'ob_next')}</button></div>`;
    const bb = document.getElementById('obbody');
    bb.scrollLeft = obIdx * bb.clientWidth;
    bb.addEventListener('scroll', () => { const i = Math.round(bb.scrollLeft / Math.max(1, bb.clientWidth)); if (i !== obIdx){ obIdx = i; paint(); } }, { passive:true });
  };
  window.obGo = d => {
    if (d < 0 || obIdx === slides.length-1){ try { ls.set('kh_onboard', 1); } catch(e){} document.getElementById('obover').remove(); bootMain(); return; }
    obIdx++; paint();
  };
  document.body.appendChild(ov); paint();
}
function hideSplash(){
  const sp = document.getElementById('splash');
  if (!sp || sp.dataset.done) return;
  sp.dataset.done = '1';
  const t0 = window.__splashT || Date.now();
  setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 500); }, Math.max(0, 1900 - (Date.now() - t0)));
}
async function bootMain(){
  try {
    // load global settings (rider speed) + rider availability
    try {
      const { data:rs } = await sb.from('region_settings').select('key,value').in('key', ['rider_speed_kmh']);
      state.settings = {}; (rs || []).forEach(x => { state.settings[x.key] = x.value; });
    } catch(e){ state.settings = {}; }
    try {
      const { data:az } = await sb.from('zones').select('id,name,center_lat,center_lng,radius_km,extra_circles,is_active').eq('is_active', true);
      state.allZones = az || [];
      const { data:zc } = await sb.from('zone_charges').select('from_zone_id,to_zone_id,delivery_fee');
      state.zoneCharges = {}; (zc || []).forEach(c => { state.zoneCharges[c.from_zone_id + '|' + c.to_zone_id] = c.delivery_fee; });
      const { data:rgs } = await sb.from('regions').select('id,name,center_lat,center_lng,radius_km,extra_circles').eq('is_active', true);
      state.allRegions = rgs || [];
    } catch(e){ state.allZones = []; state.zoneCharges = {}; state.allRegions = []; }
    try {
      const { count } = await sb.from('riders').select('id', { count:'exact', head:true }).eq('is_online', true).eq('is_approved', true);
      state.ridersOnline = count || 0;
    } catch(e){ state.ridersOnline = -1; }
    const { data:{ session } } = await sb.auth.getSession();
    if (session) await afterLogin(session.user);
    else { if (!location.hash || location.hash === '#') replaceHash('#/'); renderShell(); route(); }
  } catch (e) { logErr(e); showAuth(t('error')); }
  hideSplash();
}
(async function boot(){
  try { const rp = new URLSearchParams(location.search).get('ref'); if (rp) ls.set('kh_ref', rp.trim().toUpperCase().slice(0, 32)); } catch (e) {}
  applyLang();
  let seen = 0; try { seen = ls.get('kh_onboard', 0); } catch(e){}
  if (!seen) showOnboard(); else bootMain();
})();
