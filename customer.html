<style>
/* ===== Splash launch screen ===== */
#splash{position:fixed;inset:0;z-index:10000;background:linear-gradient(160deg,#FFF9F2 0%,#FFEDDD 55%,#FFE3CB 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;transition:opacity .45s ease;overflow:hidden}
#splash.out{opacity:0;pointer-events:none}
.sp-blob{position:absolute;border-radius:50%;filter:blur(70px);opacity:.5;animation:spDrift 5s ease-in-out infinite alternate}
.sp-blob.b1{width:340px;height:340px;background:#FFD9B8;top:-90px;right:-90px}
.sp-blob.b2{width:300px;height:300px;background:#FFE9D2;bottom:-80px;left:-80px;animation-delay:-2.5s;animation-direction:alternate-reverse}
@keyframes spDrift{from{transform:translate(0,0) scale(1)}to{transform:translate(24px,20px) scale(1.08)}}
.sp-icon{width:118px;height:118px;border-radius:32px;background:linear-gradient(140deg,#F08A3C,#D95F16);display:flex;align-items:center;justify-content:center;font-size:58px;box-shadow:0 18px 44px rgba(217,95,22,.38);position:relative;z-index:2;opacity:0;transform:scale(.4);animation:spPop .7s cubic-bezier(.34,1.56,.64,1) .25s forwards}
@keyframes spPop{to{opacity:1;transform:scale(1)}}
.sp-word{margin-top:26px;font-size:38px;font-weight:800;color:#20242b;letter-spacing:-.5px;z-index:2;display:flex}
.sp-word span{opacity:0;transform:translateY(26px);display:inline-block;animation:spRise .55s cubic-bezier(.22,1,.36,1) forwards}
.sp-word span.dot{color:#E8722A}
@keyframes spRise{to{opacity:1;transform:none}}
.sp-tag{margin-top:10px;font-size:13px;color:#8a7a68;letter-spacing:2.5px;text-transform:uppercase;z-index:2;opacity:0;animation:spFade .8s ease 1.5s forwards}
@keyframes spFade{to{opacity:1}}
.sp-load{position:absolute;bottom:84px;width:150px;height:5px;border-radius:4px;background:rgba(232,114,42,.16);z-index:2;overflow:hidden;opacity:0;animation:spFade .5s ease 1.7s forwards}
.sp-load i{display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,#F08A3C,#E8722A);animation:spSlide 1.1s ease-in-out infinite}
@keyframes spSlide{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
.sp-hills{position:absolute;bottom:-2px;left:0;width:100%;height:120px;z-index:1;opacity:0;animation:spFade 1s ease .9s forwards}
@media (prefers-color-scheme:dark){#splash{background:linear-gradient(160deg,#211912,#2A1F13)}.sp-word{color:#F5EDE2}.sp-tag{color:#A89880}}
@media (prefers-reduced-motion:reduce){#splash *{animation-duration:.01s!important}}

:root{
  --paper:#F4F6F1; --surface:#FFFFFF; --ink:#1E2B25; --muted:#66746C; --line:#DDE3DB; --soft:#EAF1EC;
  --green:#1F6F4A; --green-dark:#175539; --marigold:#F2A900; --danger:#B3261E; --deal:#D1432F;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#111A16; --surface:#1A2620; --ink:#E7EFE9; --muted:#93A59A; --line:#2B3A32; --soft:#1F3129; --green:#3FA774; --green-dark:#2F8F60; --danger:#F08A82; --deal:#F0826F; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--paper);color:var(--ink);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
html[lang=ur] body{font-family:"Noto Naskh Arabic","Bricolage Grotesque",system-ui,sans-serif;line-height:1.7}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
#app{max-width:640px;margin:0 auto;min-height:100vh;padding-top:env(safe-area-inset-top,0px)}
.top{position:sticky;top:0;z-index:5;padding:10px 16px;background:var(--brand);color:#fff}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{font-weight:800;font-size:24px;letter-spacing:-.02em}
html[lang=ur] .brand{font-family:"Bricolage Grotesque",sans-serif}
.brand b{color:var(--marigold)}
.actions-top{display:flex;gap:8px;align-items:center}
.pillbtn{border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 13px;font-weight:600;cursor:pointer;font-size:14px}
.auth .pillbtn{border-color:var(--line);background:var(--surface);color:var(--ink)}
.searchbox{position:relative;margin-top:10px}
.searchbox input{width:100%;border:0;border-radius:12px;padding:12px 14px 12px 40px;font-size:16px;background:var(--surface);color:var(--ink)}
html[dir=rtl] .searchbox input{padding:12px 40px 12px 14px}
.searchbox svg{position:absolute;top:50%;left:12px;transform:translateY(-50%);width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2}
html[dir=rtl] .searchbox svg{left:auto;right:12px}
main{padding:14px 16px 120px}
h1{font-size:26px;letter-spacing:-.01em;margin:6px 0 12px;line-height:1.2}
h2{font-size:20px;margin:22px 0 10px;display:flex;justify-content:space-between;align-items:center;gap:10px}
h2 a,h2 button{font-size:14px;color:var(--brand);font-weight:700;background:none;border:0;cursor:pointer}
.muted{color:var(--muted)}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.btn{display:block;width:100%;background:var(--brand);color:#fff;border:0;border-radius:12px;padding:15px 16px;font-weight:700;cursor:pointer;text-align:center;font-size:17px}
.btn:active{background:var(--brand-dark)}
.btn.ghost{background:transparent;color:var(--brand);border:1px solid var(--brand)}
.btn.warn{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.cxbtn{flex:none;border:1.5px solid var(--danger);color:var(--danger);background:transparent;font-weight:700;font-size:12.5px;border-radius:99px;padding:4px 10px;cursor:pointer}
.cxstrip{display:flex;align-items:center;gap:10px;margin:2px 0 8px;background:var(--soft);border:1.5px solid var(--line);border-radius:11px;padding:5px 11px;font-size:13.5px}
.cxstep{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--green);color:var(--green);background:var(--surface);font-weight:800;font-size:15px;line-height:1;cursor:pointer;flex:none}
.cxstep.off{border-color:var(--line);color:var(--muted)}
.btn.gold{background:var(--marigold);color:#1E2B25}
.btn[disabled]{opacity:.5}
.btn.inline{display:inline-block;width:auto;padding:10px 18px}
input[type=text],input[type=password],input[type=email],input[type=tel],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:13px;font-size:16px}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:14px 0 5px;font-weight:600;font-size:14px}
/* Home */
.cats{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.catchip{flex:none;display:flex;flex-direction:column;align-items:center;gap:6px;width:76px;background:none;border:0;cursor:pointer;padding:0}
.catchip .ic{width:64px;height:64px;border-radius:18px;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--brand);overflow:hidden}
.catchip .ic img{width:100%;height:100%;object-fit:cover}
.catchip span{font-size:12px;font-weight:600;text-align:center;line-height:1.2;max-width:76px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hscroll{display:flex;gap:12px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch}
.hscroll .gcard{flex:none;width:150px}
.banner{border-radius:18px;background:linear-gradient(135deg,var(--brand),#D95F16);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:6px;overflow:hidden}
.banner b{font-size:22px;display:block;line-height:1.2}
.banner .big{font-size:32px;font-weight:800;color:var(--marigold);flex:none;white-space:nowrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:4px 0 14px}
@media (min-width:560px){.grid2{grid-template-columns:repeat(3,1fr)}}
.gcard{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:8px;display:block}
.gimg{position:relative;width:100%;aspect-ratio:1/1;border-radius:10px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);margin-bottom:6px}
.gimg img{width:100%;height:100%;object-fit:cover}
.off{position:absolute;top:6px;left:6px;background:var(--deal);color:#fff;font-size:12px;font-weight:800;padding:2px 7px;border-radius:6px}
html[dir=rtl] .off{left:auto;right:6px}
.gname{font-weight:600;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.gprice{font-weight:800;margin-top:4px;color:var(--deal)}
.gprice.plain{color:var(--ink)}
.strike{text-decoration:line-through;color:var(--muted);font-weight:400;font-size:12px;margin-inline-start:4px}
.gmeta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.gmeta span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qadd{position:absolute;bottom:8px;right:8px;width:34px;height:34px;border-radius:50%;background:var(--brand);color:#fff;border:0;font-size:22px;line-height:1;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.2)}
html[dir=rtl] .qadd{right:auto;left:8px}
.heart{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:rgba(255,255,255,.9);border:0;display:grid;place-items:center;cursor:pointer;z-index:1;color:#999;font-size:17px}
.heart.on{color:var(--deal)}
html[dir=rtl] .heart{right:auto;left:12px}
.price-alert{position:absolute;top:44px;left:12px;width:32px;height:32px;border:1px solid var(--line);border-radius:50%;background:rgba(255,255,255,.94);display:grid;place-items:center;cursor:pointer;z-index:1;color:#999;font-size:15px;box-shadow:var(--sh-1)}
.price-alert.on{color:var(--brand);border-color:var(--brand)}
html[dir=rtl] .price-alert{left:auto;right:12px}
.shopcard{flex:none;width:130px;text-align:center}
.shopcard .logo{width:130px;height:90px;border-radius:14px;background:var(--line);overflow:hidden;display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);position:relative}
.shopcard .logo img{width:100%;height:100%;object-fit:cover}
.shopcard .nm{font-weight:700;font-size:14px;margin-top:6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.closedtag{position:absolute;inset:auto 0 0 0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;font-weight:700;padding:2px}
.sortbar{display:flex;gap:8px;overflow-x:auto;margin:0 0 10px;padding-bottom:4px}
.chip2{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer;font-size:14px}
.chip2.on{background:var(--brand);border-color:var(--brand);color:#fff}
.rcard{display:flex;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.rcard.closed{opacity:.62}
.rimg{width:84px;height:84px;border-radius:14px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;font-size:30px;color:var(--muted)}
.rimg img{width:100%;height:100%;object-fit:cover}
.rbody{flex:1;min-width:0}
.rname{font-weight:700;font-size:18px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.rdesc{color:var(--muted);font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;gap:12px;color:var(--muted);font-size:13px;margin-top:4px;flex-wrap:wrap}
.star{color:var(--marigold);font-weight:800}
.badge{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;color:#fff;background:var(--brand)}
.badge.closed{background:var(--muted)}
/* Shop page */
.hero{border-radius:18px;overflow:hidden;background:var(--brand);color:#fff;margin-bottom:6px}
.hero-img{height:170px;background:var(--brand) center/cover no-repeat;display:grid;place-items:center;font-size:64px;font-weight:800;color:rgba(255,255,255,.55)}
.hero-info{padding:14px 16px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:0;border-radius:0 0 18px 18px}
.hero-info h1{margin:0 0 4px}
.closed-note{background:var(--surface);border:1px solid var(--danger);color:var(--danger);border-radius:12px;padding:12px;margin:12px 0;font-weight:600}
.cattabs{position:sticky;top:54px;z-index:4;background:var(--paper);display:flex;gap:8px;overflow-x:auto;padding:10px 0;margin:6px 0 0}
.cat{margin:24px 0 4px;font-size:20px;font-weight:800;scroll-margin-top:130px}
.staffgroup{margin-bottom:18px}
.staffgroup-h{font-size:16px;font-weight:800;margin:14px 0 8px;padding:8px 12px;background:var(--field);border-radius:12px;display:flex;align-items:center;gap:8px}
.catcount{display:inline-block;background:var(--brand);color:#fff;font-size:12px;font-weight:700;min-width:24px;height:24px;line-height:24px;text-align:center;border-radius:12px;padding:0 6px;margin-left:6px;vertical-align:middle}
.shoplist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;gap:14px;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--line)}
.item.off-stock{opacity:.55}
.item-text{flex:1;min-width:0}
.item-name{font-weight:700}
.item-desc{color:var(--muted);font-size:14px;margin:2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.item-price{font-weight:700;margin-top:4px}
.item-media{position:relative;width:104px;height:100px;flex:none}
.tile{width:104px;height:84px;border-radius:14px;background:var(--line);display:grid;place-items:center;font-weight:800;font-size:28px;color:var(--muted);overflow:hidden}
.tile img{width:100%;height:100%;object-fit:cover}
.ctl{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap}
.add{background:var(--surface);color:var(--brand);border:1px solid var(--brand);border-radius:999px;padding:6px 20px;font-weight:700;cursor:pointer;box-shadow:0 1px 0 var(--line)}
.stepper{display:inline-flex;align-items:center;background:var(--brand);color:#fff;border-radius:999px;overflow:hidden}
.stepper button{background:none;border:0;color:#fff;width:36px;height:34px;font-size:20px;cursor:pointer}
.stepper b{min-width:24px;text-align:center}
.soldout{font-size:13px;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:999px}
/* Product page */
.dimg{position:relative;width:100%;aspect-ratio:1/1;border-radius:16px;overflow:hidden;background:var(--line);margin-bottom:12px}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dimg .ph{width:100%;height:100%;display:grid;place-items:center;font-size:56px;font-weight:800;color:var(--muted)}
.dprice{font-size:26px;font-weight:800;color:var(--deal)}
.dprice.plain{color:var(--ink)}
.save{display:inline-block;background:rgba(209,67,47,.12);color:var(--deal);font-weight:800;border-radius:8px;padding:2px 8px;font-size:14px;margin-inline-start:8px}
.shopstrip{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;margin:14px 0}
.shopstrip .thumb{width:44px;height:44px;border-radius:10px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.shopstrip .thumb img{width:100%;height:100%;object-fit:cover}
.buybar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;justify-content:center;padding:10px 12px;background:linear-gradient(to top,var(--paper) 70%,transparent)}
.buybar .in{display:flex;gap:10px;width:100%;max-width:616px;align-items:center}
/* Cart bar + nav */
.cartbar{position:fixed;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:6;display:none;justify-content:center;padding:0 12px 10px}
.cartbar a{display:flex;justify-content:space-between;width:100%;max-width:616px;background:var(--brand);color:#fff;border-radius:14px;padding:14px 18px;font-weight:700;box-shadow:0 4px 14px rgba(0,0,0,.22)}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav-in{display:flex;max-width:640px;margin:0 auto;gap:6px;padding:8px 10px}
.nav a{position:relative;flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-weight:700;font-size:12px;color:var(--muted);border-radius:16px;transition:background .25s ease,color .25s ease,transform .15s ease}
.nav a:active{transform:scale(.96)}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a.on{background:var(--marigold);color:#1E2B25;box-shadow:0 4px 12px rgba(242,169,0,.35)}
.nav .cnt{position:absolute;top:4px;left:50%;margin-left:6px;background:var(--marigold);color:#1E2B25;font-size:11px;font-weight:800;min-width:18px;height:18px;border-radius:9px;display:grid;place-items:center;padding:0 4px}
.nav a.on .cnt{background:#fff;color:#1E2B25}
/* Cart, checkout, orders */
.line{display:flex;justify-content:space-between;gap:12px;padding:6px 0}
.line.total{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-weight:800;font-size:19px}
.line.disc{color:var(--deal);font-weight:700}
.box{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;margin:12px 0}
.cartrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cartrow:last-child{border-bottom:0}
.cartrow .thumb{width:56px;height:56px;border-radius:10px;background:var(--line);overflow:hidden;flex:none;display:grid;place-items:center;font-weight:800;color:var(--muted)}
.cartrow .thumb img{width:100%;height:100%;object-fit:cover}
.promo{display:flex;gap:8px}
.promo input{flex:1;text-transform:uppercase}
.promo button{flex:none;width:auto;padding:0 18px}
.progress{height:8px;background:var(--line);border-radius:5px;overflow:hidden;margin:8px 0}
.progress i{display:block;height:100%;background:var(--marigold)}
.micbtn{position:absolute;top:50%;right:6px;transform:translateY(-50%);border:0;background:transparent;font-size:20px;cursor:pointer;padding:4px 6px;z-index:2}html[dir=rtl] .micbtn{right:auto;left:6px}.searchbox input#q{padding-right:44px}html[dir=rtl] .searchbox input#q{padding-left:44px;padding-right:40px}.micbtn.on{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.35}}.sugg{background:var(--surface,#fff);color:var(--ink);border-radius:16px;margin-top:8px;padding:10px 12px;box-shadow:0 8px 24px rgba(0,0,0,.18)}.sg-h{display:flex;justify-content:space-between;align-items:center;margin:4px 0 6px;font-size:14px}.sg-c{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}.add.bell{margin-top:6px;min-width:0;padding:6px 10px}.add.bell.on{background:var(--brand);color:#fff}.sharebtn{flex:none;color:var(--brand)!important;border-color:var(--line)!important;background:var(--surface)!important}.faqq{border-bottom:1px solid var(--line);padding:10px 0}.faqq summary{font-weight:700;cursor:pointer}.faqq div{margin-top:6px;color:var(--muted)}

/* ===== Dera design system v2 (shared by all apps) ===== */
:root{
  --paper:#F2F5F1; --surface:#FFFFFF; --ink:#13201A; --muted:#64736A; --line:#E2E8E1; --soft:#E8F3EC; --field:#F3F6F2;
  --green:#0E7A4D; --green-dark:#0A5E3B; --green-2:#17A56B; --marigold:#FFB302; --danger:#D63B2F; --deal:#E2472F;
  --r-sm:12px; --r:16px; --r-lg:22px;
  --sh-1:0 1px 2px rgba(19,40,28,.06),0 1px 1px rgba(19,40,28,.03);
  --sh-2:0 8px 22px rgba(19,40,28,.08),0 2px 6px rgba(19,40,28,.05);
  --sh-3:0 18px 44px rgba(19,40,28,.20),0 4px 12px rgba(19,40,28,.08);
  --grad:linear-gradient(135deg,#F08A3C 0%,#E8722A 55%,#D95F16 100%);
  --grad-gold:linear-gradient(135deg,#FFC23A,#FFA400);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0C1511; --surface:#16211B; --ink:#E8F0EA; --muted:#93A59A; --line:#243229; --soft:#18291F; --field:#1C2922;
    --green:#34B27A; --green-dark:#23915F; --green-2:#46C489; --danger:#FF8A7E; --deal:#FF8A70;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 22px rgba(0,0,0,.35); --sh-3:0 18px 44px rgba(0,0,0,.55);
    --grad:linear-gradient(135deg,#7A3F14 0%,#96541C 60%,#B0621F 100%); }
}
body{background:var(--paper);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
::selection{background:rgba(232,114,42,.25)}
h1{font-weight:800;letter-spacing:-.025em}
h2{font-weight:800;letter-spacing:-.015em}
h3{font-weight:800}
/* Buttons */
.btn{background:var(--grad);border-radius:14px;box-shadow:0 6px 16px rgba(198,94,27,.25);transition:transform .12s var(--ease),box-shadow .2s,filter .2s;letter-spacing:.005em}
.btn:active{transform:scale(.98);filter:brightness(.95);background:var(--grad)}
.btn.ghost{background:var(--soft);color:var(--brand);border:1.5px solid transparent;box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.warn{background:rgba(214,59,47,.08);color:var(--danger);border:1.5px solid transparent;box-shadow:none}
.btn.gold{background:var(--grad-gold);color:#241a00;box-shadow:0 6px 16px rgba(255,170,0,.28)}
.btn[disabled]{opacity:.45;box-shadow:none;filter:grayscale(.3)}
/* Fields */
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:14px;transition:border-color .15s,box-shadow .15s,background .15s;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 4px rgba(232,114,42,.15)}
label.f{color:var(--muted);font-weight:700;font-size:13px;letter-spacing:.01em}
/* Surfaces */
.card,.box{border:1px solid var(--line);border-radius:20px;box-shadow:var(--sh-1);background:var(--surface)}
.pill{border-radius:999px;font-weight:700;letter-spacing:.01em}
.muted{color:var(--muted)}
.empty{color:var(--muted)}
/* Sheets and popups */
.sheet-back{background:rgba(8,20,14,.45);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);animation:wmFade .2s ease both}
.sheet{border-radius:28px 28px 0 0;box-shadow:var(--sh-3);animation:wmUp .32s var(--ease) both;position:relative;padding-top:22px!important}
.sheet::before{content:"";position:absolute;top:8px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:9px;background:var(--line)}
.sheet-head h3{font-size:20px;letter-spacing:-.01em}
.x{border-radius:50%!important;background:var(--field)!important;width:36px;height:36px;display:grid;place-items:center;border:0!important}
.toast{border-radius:16px!important;box-shadow:var(--sh-3)!important;font-weight:700;animation:wmToast .35s var(--ease) both;backdrop-filter:blur(6px)}
/* draggable order bubble */
#orderBubble{position:fixed;z-index:55;width:74px;height:74px;border-radius:50%;background:var(--green,#0b5c2f);display:none;align-items:center;justify-content:center;font-size:34px;box-shadow:0 8px 24px rgba(0,0,0,.35);border:3px solid #fff;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
#orderBubble.show{display:flex}
#orderBubble .ebadge{position:absolute;top:-10px;right:-14px;background:#E8A100;color:#3a2a00;font-weight:800;font-size:11px;border-radius:14px;padding:4px 8px;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25);pointer-events:none}
#orderBubble .blabel{position:absolute;bottom:-20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;font-size:10px;font-weight:700;border-radius:8px;padding:3px 8px;white-space:nowrap;pointer-events:none}
@keyframes wmFade{from{opacity:0}to{opacity:1}}
@keyframes wmUp{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes wmToast{from{transform:translate(-50%,16px) scale(.96);opacity:0}}
@keyframes wmPop{0%{transform:scale(.9);opacity:0}100%{transform:scale(1);opacity:1}}
/* Loading skeleton */
.skel{background:linear-gradient(90deg,var(--line) 25%,var(--field) 37%,var(--line) 63%);background-size:400% 100%;animation:wmShim 1.3s ease infinite;border-radius:14px}
@keyframes wmShim{0%{background-position:100% 50%}100%{background-position:0 50%}}
/* Switch */
.switch span{transition:background .2s}
/* Scrollbars */
*::-webkit-scrollbar{height:0;width:6px}
*::-webkit-scrollbar-thumb{background:var(--line);border-radius:9px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* Docked bottom navigation (full-width, like Foodpanda/Daraz) */
.nav{left:0!important;right:0!important;transform:none!important;width:100%!important;bottom:0!important;border-radius:0!important;
  border:0!important;border-top:1px solid var(--line)!important;box-shadow:0 -4px 20px rgba(0,0,0,.08)!important;padding:6px 4px calc(8px + env(safe-area-inset-bottom,0px))!important;
  background:#fff}
.nav-in{max-width:640px;margin:0 auto;display:flex}
@media (prefers-color-scheme: dark){ .nav{background:#16211c} }
.nav a,.nav button{border-top:0!important;border-radius:14px;transition:background .2s,color .2s;flex:1}
.nav a.on,.nav button.on{background:var(--forest)!important;color:#fff!important;border-radius:20px;box-shadow:0 6px 16px rgba(11,58,43,.35)}
main{padding-bottom:180px!important}

/* dera plus */

/* ===== Dera design system v3 ===== */
:root{
  --paper:#FFF9F1; --surface:#FFFFFF; --ink:#12201A; --muted:#5E6D65; --line:#EFE4D8; --soft:#E5F1EA; --field:#FFF3E8;
  --green:#0B7D4F; --green-dark:#086640; --green-2:#14A064; --forest:#0B3A2B; --marigold:#FFB400; --danger:#D23B2E; --blue:#2463B5; --deal:#E2472F;
  --brand:#E8722A; --brand-dark:#C65E1B; --brand-2:#F0923F; --brand-deep:#B34E14;
  --r-sm:12px; --r:16px; --r-lg:24px;
  --sh-1:0 1px 2px rgba(16,32,24,.05);
  --sh-2:0 8px 20px -10px rgba(16,32,24,.22),0 1px 2px rgba(16,32,24,.05);
  --sh-3:0 24px 50px -14px rgba(8,28,20,.38);
  --grad:var(--brand); --grad-gold:var(--marigold);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  /* truck-art band: the one decorative signature, used under the top bar */
  --band:linear-gradient(90deg,#FFB400,#E2472F,#F0923F);
  --ease:cubic-bezier(.2,.8,.2,1);
}
@media (prefers-color-scheme: dark){
  :root{ --paper:#0B1310; --surface:#141E19; --ink:#E6EEE8; --muted:#94A59B; --line:#24322B; --soft:#17291F; --field:#1A2620;
    --green:#2FB27A; --green-dark:#23915F; --green-2:#46C489; --forest:#0A241B; --danger:#FF8A7E; --blue:#7DB2F0; --deal:#FF8A70;
    --brand:#F08A3C; --brand-dark:#D9722A; --brand-2:#F5A968; --brand-deep:#7A3A12;
    --sh-1:0 1px 2px rgba(0,0,0,.4); --sh-2:0 8px 20px -10px rgba(0,0,0,.6); --sh-3:0 24px 50px -14px rgba(0,0,0,.7); }
}
body{font-family:var(--body);font-size:15.5px;line-height:1.5;color:var(--ink);background:var(--paper);letter-spacing:.003em}
html[lang=ur] body{font-family:"Noto Naskh Arabic",var(--body);line-height:1.75;letter-spacing:0}
h1,h2,h3,.brand,.oid,.tile b,.big,.newjob .big,.attgrid b,.susp .big,.waitbox .clock{font-family:var(--display)}
html[lang=ur] h1,html[lang=ur] h2,html[lang=ur] h3{font-family:"Noto Naskh Arabic",var(--display)}
h1{font-size:27px;font-weight:800;letter-spacing:-.03em;line-height:1.15;margin:4px 0 14px}
h2{font-size:19px;font-weight:800;letter-spacing:-.02em}
h3{font-size:16px;font-weight:700;letter-spacing:-.01em}
.tile b,.kv span:last-child,.kv b:last-child,.line span:last-child,.row-side,.row .r,.cash b,.money{font-variant-numeric:tabular-nums}
::selection{background:rgba(255,180,0,.35)}
:focus-visible{outline:3px solid var(--marigold)!important;outline-offset:2px}
/* buttons: solid, no gradients */
.btn{background:var(--brand);color:#fff;border:0;border-radius:var(--r-sm);min-height:50px;padding:13px 16px;font-weight:700;font-size:16px;letter-spacing:0;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.14),0 6px 14px -8px rgba(232,114,42,.8);transition:transform .12s var(--ease),background .15s}
.btn:active{background:var(--brand-dark);transform:scale(.985);filter:none}
.btn.ghost{background:var(--surface);color:var(--brand);border:1.5px solid var(--line);box-shadow:none}
.btn.ghost:active{background:var(--soft)}
.btn.warn{background:#FCEDEB;color:var(--danger);border:0;box-shadow:none}
.btn.gold{background:var(--marigold);color:#2A1D00;box-shadow:0 6px 14px -8px rgba(200,140,0,.9)}
.btn.small{min-height:40px;padding:8px 12px;font-size:14px}
.btn[disabled]{opacity:.45;box-shadow:none}
@media (prefers-color-scheme: dark){ .btn.warn{background:rgba(255,138,126,.12)} .btn{color:#06140E} .btn.ghost{color:var(--brand)} .btn.warn{color:var(--danger)} }
/* fields */
input[type=text],input[type=password],input[type=email],input[type=tel],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r-sm);font-size:16px;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--brand)!important;box-shadow:0 0 0 4px rgba(232,114,42,.14)!important}
label.f{color:var(--ink);opacity:.72;font-weight:700;font-size:13px}
/* surfaces */
.card,.box{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--sh-1)}
.note{background:#FFF5D9;color:#4F3A00;border-radius:12px;border:0}
.warnbox,.closedbar{background:#FDEFED!important;border:1px solid rgba(210,59,46,.3)!important;color:var(--danger);border-radius:14px}
@media (prefers-color-scheme: dark){ .note{background:rgba(255,180,0,.12);color:#F2D58C} .warnbox,.closedbar{background:rgba(255,138,126,.08)!important} }
.empty{color:var(--muted);font-size:15px}
.toast{background:var(--ink)!important;color:var(--paper)!important;border-radius:14px!important;box-shadow:var(--sh-3)!important;font-weight:600;padding:12px 18px}
.toast.err{background:var(--danger)!important;color:#fff!important}
/* chips */
.chip,.chip2{background:var(--surface);border:1px solid var(--line)!important;box-shadow:none;font-weight:600;font-size:14px;color:var(--ink)}
.chip.on,.chip2.on{background:var(--brand)!important;border-color:var(--brand)!important;color:#fff!important}
/* filter tabs: animated underline style */
.typerow .chip2{position:relative;background:transparent!important;border:0!important;box-shadow:none;border-radius:0;padding:10px 6px;margin:0 6px;font-weight:700;font-size:15px;color:var(--muted)}
.typerow .chip2::after{content:"";position:absolute;left:6px;right:6px;bottom:3px;height:3px;border-radius:2px;background:var(--marigold);transform:scaleX(0);transform-origin:left center;transition:transform .28s ease}
.typerow .chip2.on{background:transparent!important;border-color:transparent!important;color:var(--ink)!important}
.typerow .chip2.on::after{transform:scaleX(1)}
/* motorbike order-button effect (TikTok-style choreography: parcel -> bike picks it -> rides off) */
.btn.bike-load{position:relative;overflow:hidden}
.btn.bike-load .bl-t{visibility:hidden}
.btn.bike-load .bl-road{position:absolute;left:14px;right:14px;bottom:11px;border-bottom:3px dashed rgba(255,255,255,.65);animation:blRoad 3s ease infinite;pointer-events:none}
.btn.bike-load .bl-pack{position:absolute;left:38px;bottom:15px;font-size:20px;line-height:1;animation:blPack 3s ease infinite;pointer-events:none}
.btn.bike-load .bl-bike{position:absolute;bottom:5px;left:-52px;font-size:32px;line-height:1;transform:scaleX(-1);animation:blBike 3s ease infinite;filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));pointer-events:none}
@keyframes blBike{0%{left:-52px}32%{left:36px}44%{left:36px}72%{left:calc(100% + 14px)}100%{left:calc(100% + 14px)}}
@keyframes blPack{0%,38%{opacity:1;transform:translateY(0) scale(1)}52%,100%{opacity:0;transform:translateY(-16px) scale(.35)}}
@keyframes blRoad{0%,100%{opacity:0}12%,82%{opacity:1}}
html[dir=rtl] .btn.bike-load .bl-pack{left:auto;right:38px}
html[dir=rtl] .btn.bike-load .bl-bike{left:auto;right:-52px;transform:none;animation-name:blBikeR}
@keyframes blBikeR{0%{right:-52px}32%{right:36px}44%{right:36px}72%{right:calc(100% + 14px)}100%{right:calc(100% + 14px)}}
.btn.bike-done{background:var(--green)!important}
/* search suggestions + empty states + toast polish */
.sg-c .chip{background:var(--soft);border:1px solid var(--line);font-size:13px;transition:transform .12s ease}
.sg-c .chip:active{transform:scale(.94)}
.empty{padding:48px 16px}.empty .eic{font-size:60px;line-height:1;margin-bottom:14px;animation:wmPop .35s ease}
.toast{border:1px solid rgba(255,255,255,.14)!important}
/* sheets */
.sheet-back,.over{background:rgba(6,18,12,.5)}
.sheet,.over .panel{border-radius:24px 24px 0 0}
.sheet-head h3{font-family:var(--display);font-size:20px;font-weight:800}
.x{background:var(--field)!important;color:var(--ink)!important;font-size:22px!important}
/* switch */
.switch input:checked + span{background:var(--brand)}

/* top bar: warm light + truck-art band */
.top{position:sticky;top:0;background:linear-gradient(180deg,#FFF9F1,#FFF6EC)!important;border-radius:0!important;box-shadow:0 2px 14px rgba(180,110,50,.08)!important;padding:14px 16px 16px!important;color:var(--ink)}
@media (prefers-color-scheme: dark){ .top{background:linear-gradient(180deg,#141E19,#101713)!important;box-shadow:0 2px 14px rgba(0,0,0,.4)!important} }
.top::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--band)}
.top .brand{color:var(--ink);font-size:19px;font-weight:800;letter-spacing:-.025em;white-space:nowrap;flex:none}
.top-row{gap:8px}
.actions-top{display:flex;gap:6px;align-items:center;min-width:0}
#cityBtn{min-width:0;display:flex}
#cityBtn .citybtn{min-width:0;max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:none;border:0;color:var(--ink);font-weight:700;font-size:13.5px;padding:6px 2px;cursor:pointer}
#cityBtn .citybtn span{color:var(--marigold);margin-inline-start:4px;font-size:12px}
.actions-top>.pillbtn{flex:none;padding:0 10px!important}
.brand b{color:var(--marigold)}
.pillbtn{background:var(--surface)!important;border:1px solid var(--line)!important;color:var(--ink);border-radius:12px!important;height:38px;padding:0 12px!important;font-weight:600;font-size:13.5px;white-space:nowrap;box-shadow:var(--sh-1)}
.top .cbtn{width:38px;height:38px;border-radius:12px!important;background:var(--surface)!important;border:1px solid var(--line)!important;color:var(--ink)!important;font-size:17px;box-shadow:var(--sh-1)}
.addrchip .pin{background:rgba(255,184,0,.16);border-radius:10px;color:var(--marigold)}
.addrchip small{opacity:.65}
.hello b{font-family:var(--display);font-size:24px;letter-spacing:-.03em}
.searchbox input{border-radius:14px!important;box-shadow:none!important;border:0!important;height:50px}
main{padding-top:18px!important}
h2{font-size:20px;margin:26px 0 12px}
h2 a,h2 button{background:none!important;color:var(--brand)!important;padding:4px 0!important;font-size:14px!important;font-weight:700;text-decoration:none}
/* banners */
.banner,.bslide{border-radius:20px;box-shadow:none}
.banner{background:var(--brand-deep)}
.banner::after{opacity:.14}
.bdots i{background:var(--line)}
.bdots i.on{background:var(--ink)}
/* categories */
.catchip .ic{box-shadow:none;border:1px solid var(--line)}
.catchip span{font-weight:600;color:var(--ink)}
/* product and shop cards: flat, image first */
.gcard{border:1px solid var(--line);border-radius:18px;box-shadow:none;padding:6px 6px 12px;background:var(--surface)}
.gimg{border-radius:14px;overflow:hidden;position:relative}
.gname{font-weight:700;font-size:15px;line-height:1.3}
.gprice{font-family:var(--display);font-weight:800;font-size:16px}
.qadd{background:var(--brand)!important;border-radius:12px!important;box-shadow:0 6px 14px -6px rgba(232,114,42,.9)!important;color:#fff}
.heart{box-shadow:none;border:1px solid var(--line)}
.off{background:var(--deal);border-radius:8px;box-shadow:none;font-weight:800}
.custom{color:var(--brand);font-weight:700}
.shopcard{border:1px solid var(--line);box-shadow:none;border-radius:18px}
.shopcard .logo{border-radius:14px;overflow:hidden;position:relative}
.rcard{border:1px solid var(--line);box-shadow:none;border-radius:18px}
.rimg{border-radius:14px;overflow:hidden;position:relative}
.rname{font-family:var(--display);font-weight:800;letter-spacing:-.015em}
/* shop page */
.hero{border-radius:22px;box-shadow:none;border:1px solid var(--line);overflow:hidden}
.hero-img{position:relative;overflow:hidden}
.hero-info{border-radius:0}
.hero-info h1{font-size:28px}
.item{border:1px solid var(--line);box-shadow:none;border-radius:16px}
.item .tile{position:relative;overflow:hidden;border-radius:12px;padding:0;border:0}
.add{background:var(--brand)!important;border-radius:10px!important;box-shadow:none!important;transition:transform .12s ease,filter .15s ease}
.add:active{transform:scale(.93);filter:brightness(1.1)}
.qadd{transition:transform .15s ease,background .2s ease!important}
.qadd:active{transform:scale(.82) rotate(90deg)}
.gcard{transition:transform .18s var(--ease),box-shadow .18s var(--ease)}
.gcard:active{transform:scale(.97)}
.stepper{background:var(--soft)}
/* product page */
.dimg{border-radius:22px;box-shadow:none;border:1px solid var(--line);position:relative}.dimg{cursor:zoom-in}.zoomover{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:9999;display:flex;align-items:center;justify-content:center;animation:wmPop .25s ease}.zoomrow{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;max-width:100%;padding:0 18px}.zoomrow img{max-width:calc(100vw - 36px);max-height:84vh;object-fit:contain;border-radius:14px;scroll-snap-align:center;flex:none}.zoox{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:18px;width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.16);color:#fff;font-size:18px;border:0}.obover{position:fixed;inset:0;z-index:9998;background:var(--bg);display:flex;flex-direction:column;animation:wmUp .3s ease}.obskip{align-self:flex-end;margin:calc(14px + env(safe-area-inset-top,0px)) 18px 0;background:none;border:0;color:var(--muted);font-size:15px}.obbody{flex:1;display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.obbody::-webkit-scrollbar{display:none}.obslide{min-width:100%;scroll-snap-align:center;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:0 36px}.obemo{font-size:110px;line-height:1;margin-bottom:28px;animation:wmPop .45s ease}.obslide h2{margin:0 0 12px;font-size:26px}.obslide p{margin:0;color:var(--muted);font-size:16px;line-height:1.6;max-width:300px}.obfoot{padding:20px 24px calc(30px + env(safe-area-inset-bottom,0px))}.obdots{display:flex;gap:8px;justify-content:center;margin-bottom:20px}.obdots i{width:8px;height:8px;border-radius:50%;background:var(--line);transition:all .25s}.obdots i.on{width:26px;border-radius:6px;background:var(--brand)}
.dimg .ph{padding:0}
.shopstrip{border:1px solid var(--line);box-shadow:none}
.thumb{position:relative;overflow:hidden}
/* cart, checkout, orders */
.cartbar a{background:var(--brand-deep)!important;border-radius:16px!important;box-shadow:var(--sh-3)!important}
.seg button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.orow,.menu-row,.offer{border:1px solid var(--line)!important;box-shadow:none!important}
.statushero{background:linear-gradient(135deg,#0B7D4F,#086640);border-radius:22px;box-shadow:0 12px 28px -10px rgba(11,125,79,.5)}
.ridercard{border:0;box-shadow:var(--sh-2);border-radius:20px}

.statushero::before{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--band)}
.refcard{background:var(--brand-deep)}
/* bottom navigation */
.nav{background:#fff!important}
@media (prefers-color-scheme: dark){ .nav{background:#16211c!important} }
.nav a{background:transparent!important;font-size:11.5px;font-weight:600;border-radius:16px;transition:background .25s ease,color .25s ease,transform .15s ease}
.nav a:active{transform:scale(.96)}
.nav a.on{background:var(--forest)!important;color:#fff!important;font-weight:700;box-shadow:0 6px 16px rgba(11,58,43,.35);border-radius:20px}

.pill.wait{background:rgba(255,180,0,.2);color:#7A5200}
.auth .brand{font-size:36px;letter-spacing:-.035em}

/* image placeholder: tinted initial when a shop or product has no photo */
.thumb,.gimg,.logo,.rimg,.hero-img,.dimg{position:relative}
.thumb{overflow:hidden}
.noimg{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;line-height:1;
  background-color:hsl(var(--h) 42% 92%);color:hsl(var(--h) 45% 30%);
  background-image:radial-gradient(hsl(var(--h) 40% 82%) 1.2px,transparent 1.4px);background-size:11px 11px}

@media (prefers-color-scheme: dark){ .noimg{background-color:hsl(var(--h) 25% 18%);color:hsl(var(--h) 45% 78%);background-image:radial-gradient(hsl(var(--h) 25% 27%) 1.2px,transparent 1.4px)} }

/* ===== Layout fix: stop horizontal overflow (bottom bar cut-off) ===== */
html,body{max-width:100%;overflow-x:hidden}
#app{width:100%;overflow-x:clip}
.grid2{grid-template-columns:repeat(2,minmax(0,1fr))!important}

.grid2{grid-template-columns:repeat(3,minmax(0,1fr))!important;gap:8px!important}

    const L = ur ? { t:'ایپ کا رنگ', light:'☀️ روشن', dark:'🌙 گہرا', auto:'📱 فون جیسا' } : { t:'App theme', light:'☀️ Light', dark:'🌙 Dark', auto:'📱 Auto' };
    return `<div class="themebox"><b>${L.t}</b><div class="themesw">${['light', 'dark', 'auto'].map(m => `<button type="button" data-m="${m}" class="${cur === m ? 'on' : ''}" onclick="Theme.set('${m}')">${L[m]}</button>`).join('')}</div></div>`;

.themesw button.on{background:var(--surface);box-shadow:0 1px 4px rgba(0,0,0,.15)}`;

// Public browse feed only: never store session, profile, address, cart, order, payment, or push data here.
const PUBLIC_FEED_CACHE_PREFIX = 'dera_public_feed_v1_';
const PUBLIC_FEED_CACHE_MAX = 1400000;
function publicFeedCacheKey(region){ return PUBLIC_FEED_CACHE_PREFIX + encodeURIComponent(String(region || ls.get('kh_region', 'default'))); }
function setFeedNotice(){
  const host = $('feedNotice'); if (!host) return;
  if (!state.feedStale){ host.innerHTML = ''; return; }
  const saved = state.feedSavedAt ? new Date(state.feedSavedAt).toLocaleString() : '';
  const ur = state.lang === 'ur';
  host.innerHTML = `<div role="status" style="margin:10px 0;padding:11px 13px;border:1px solid #D98B38;border-radius:12px;background:#FFF4E5;color:#674015;font-size:13px;font-weight:600">${ur?'آف لائن محفوظ کیٹلاگ':'Saved catalog (offline)'}${saved ? ` · ${ur?'محفوظ ہونے کا وقت':'saved'} ${esc(saved)}` : ''}<div style="font-weight:400;margin-top:3px">${ur?'قیمتیں، دستیابی اور اوقات بدل چکے ہو سکتے ہیں۔ آرڈر دینے کے لیے دوبارہ آن لائن ہوں۔':'Prices, availability, and hours may have changed. Reconnect before placing an order.'}</div></div>`;
}
function savePublicFeed(){
  if (!state.region || !state.restaurants.length || !state.products.length) return;
  try {
    const itemIds = new Set(state.products.map(p => String(p.id))), shopIds = new Set(state.restaurants.map(r => String(r.id)));
    const items = {}, shops = {};
    Object.entries(state.stats.items || {}).forEach(([id, value]) => { if (itemIds.has(String(id))) items[id] = value; });
    Object.entries(state.stats.shops || {}).forEach(([id, value]) => { if (shopIds.has(String(id))) shops[id] = value; });
    const record = { version:1, region:String(state.region), savedAt:new Date().toISOString(), restaurants:state.restaurants, products:state.products, stats:{ items, shops } };
    const text = JSON.stringify(record); if (text.length > PUBLIC_FEED_CACHE_MAX) return;
    localStorage.setItem(publicFeedCacheKey(state.region), text);
    const keys = []; for (let i=0; i<localStorage.length; i++){ const k=localStorage.key(i); if (k && k.startsWith(PUBLIC_FEED_CACHE_PREFIX)) keys.push(k); }
    keys.filter(k => k !== publicFeedCacheKey(state.region)).slice(0, Math.max(0, keys.length - 3)).forEach(k => localStorage.removeItem(k));
  } catch(e) { /* storage unavailable or quota exceeded */ }
}
function restorePublicFeed(){
  try {
    const raw = localStorage.getItem(publicFeedCacheKey(state.region)); if (!raw || raw.length > PUBLIC_FEED_CACHE_MAX) return false;
    const rec = JSON.parse(raw);
    if (!rec || rec.version !== 1 || String(rec.region) !== String(state.region) || !Array.isArray(rec.restaurants) || !Array.isArray(rec.products) || !rec.stats) return false;
    state.restaurants = rec.restaurants; state.products = rec.products; state.stats = { items:rec.stats.items || {}, shops:rec.stats.shops || {} };
    state.itemsCache = Object.assign({}, state.itemsCache || {}); state.products.forEach(p => { if (p && p.id) state.itemsCache[p.id] = p; });
    state.feedStale = true; state.feedSavedAt = rec.savedAt || null; setFeedNotice();
    if ($('view') && currentRoute) route(true);
    return true;
  } catch(e) { return false; }
}
window.addEventListener('online', async () => {
  if (!state.feedStale || !state.region) return;
  try { await loadRestaurantsFresh(); await loadProductsFresh(); state.feedStale = false; state.feedSavedAt = null; savePublicFeed(); setFeedNotice(); if ($('view') && currentRoute) route(true); } catch(e) { /* retain saved feed until a complete fresh feed arrives */ }
});

function toast(msg, isErr){
  if (isErr && /failed to fetch|networkerror|load failed|network request failed/i.test(String(msg))) msg = (() => { try { return state.lang === 'ur'; } catch (e) { return false; } })() ? 'انٹرنیٹ کا مسئلہ ہے۔ انٹرنیٹ چیک کر کے دوبارہ کوشش کریں۔' : 'Internet problem. Check your internet and try again.';
  const el = document.createElement('div'); el.className = 'toast' + (isErr ? ' err' : ''); el.textContent = msg;
  document.body.appendChild(el); setTimeout(() => el.remove(), 3200);
}

  if (!lat || !lng || !zones.length) return null;
  const inCircle = (z, clat, clng, rkm) => kmBetween(lat, lng, Number(clat), Number(clng)) <= num(rkm || 5);

  for (const z of zones){

    for (const c of (z.extra_circles || [])){
      if (inCircle(z, c.lat, c.lng, c.r)) return z.id;

const SERVICE_CATS = [{k:'salon',i:'💈',en:'Barber & salon',ur:'حجام / سیلون'},{k:'parlour',i:'💅',en:'Beauty parlour',ur:'بیوٹی پارلر'},{k:'doctor',i:'🩺',en:'Doctor / clinic',ur:'ڈاکٹر / کلینک'},{k:'dentist',i:'🦷',en:'Dentist',ur:'دندان ساز'},{k:'lab',i:'🔬',en:'Laboratory / tests',ur:'لیبارٹری / ٹیسٹ'},{k:'carwash',i:'🚗',en:'Car wash & detailing',ur:'کار واش'},{k:'tailor',i:'🧵',en:'Tailor',ur:'درزی'},{k:'electrician',i:'🔌',en:'Electrician',ur:'الیکٹریشن'},{k:'plumber',i:'🔧',en:'Plumber',ur:'پلمبر'},{k:'mobile',i:'📱',en:'Mobile repair',ur:'موبائل مرمت'},{k:'mechanic',i:'🏍️',en:'Mechanic',ur:'مکینک'},{k:'photo',i:'📸',en:'Photographer / studio',ur:'فوٹوگرافر'},{k:'tractor',i:'🚜',en:'Tractor / agri services',ur:'ٹریکٹر / کھیتی'},{k:'tutor',i:'📚',en:'Tutor / academy',ur:'ٹیوٹر / اکیڈمی'},{k:'other',i:'➕',en:'Other',ur:'دیگر'}];
const svcTrade = r => { const k = ((r && r.categories) || []).find(x => SERVICE_CATS.some(c => c.k === x)); const c = SERVICE_CATS.find(c => c.k === k); return c ? { k, label:c.i + ' ' + (state.lang === 'ur' ? c.ur : c.en) } : null; };
const tradeChip = r => { const tr = r && r.shop_kind === 'services' ? svcTrade(r) : null; return tr ? `<div style="margin-top:6px"><span class="pill" style="background:#E8F5EE;color:#176B45">${esc(tr.label)}</span></div>` : ''; };
const shopDisc = (r, sub) => { const f = r && r.offer; if (!f || !f.on || !num(f.pct) || sub < num(f.min)) return 0; let d = Math.round(sub * Math.min(90, num(f.pct)) / 100); if (num(f.max) > 0) d = Math.min(d, num(f.max)); return d; };
const offerText = r => { const f = r && r.offer; if (!f || !f.on || !num(f.pct)) return ''; return t('offer_pct', { p:num(f.pct) }) + (num(f.min) ? ' ' + t('offer_min', { m:money(f.min) }) : '') + (num(f.max) ? ' · ' + t('off_upto', { m:money(f.max) }) : ''); };
const isPharma = r => ((r && r.categories) || []).includes('pharmacy');
const isMart = r => ((r && r.categories) || []).some(k => ['grocery','fruit_veg','meat','dairy','pharmacy','general','bakery'].includes(k));
const SHOP_F = { offer:r => !!offerText(r), top:r => { const x = shopRating(r.id); return !!x && num(x.avg) >= 4; }, fast:r => num(r.prep_time_minutes || 25) <= 20, pick:r => r.allow_pickup !== false, free:r => r.zone && !num(r.zone.delivery_fee) };
function filterChips(){ return `<div class="typerow">${['all','offer','top','fast','pick','free'].map(k => `<button class="chip2 ${(state.shopF || 'all') === k ? 'on' : ''}" onclick="A.setShopF('${k}')">${t('f_' + k)}</button>`).join('')}</div>`; }
const typeShops = () => state.shopCat ? state.restaurants.filter(r => (r.categories || []).includes(state.shopCat)) : state.restaurants;
const typeProducts = () => { if (!state.shopCat) return state.products; const ids = new Set(typeShops().map(r => r.id)); return state.products.filter(p => ids.has(p.restaurant_id)); };
function typeChips(){
  const have = SHOP_CATS.filter(c => state.restaurants.some(r => (r.categories || []).includes(c.k)));
  if (have.length < 2) return '';
  return `<div class="typerow">${[{ k:'', i:'✨', en:t('all_types'), ur:t('all_types') }].concat(have).map(c => `<button class="chip2 ${(state.shopCat || '') === c.k ? 'on' : ''}" onclick="A.setShopCat('${c.k}')">${c.i} ${esc(state.lang === 'ur' ? c.ur : c.en)}</button>`).join('')}</div>`;
}
// Stock: null = no limit
const stockOf = it => it && it.stock_qty != null ? num(it.stock_qty) : null;
const fmtWinT = x => { const pp = String(x).slice(0, 5).split(':'); const h = +pp[0], mm = +pp[1]; const ap = h >= 12 ? 'PM' : 'AM'; return (h % 12 || 12) + (mm ? ':' + String(mm).padStart(2, '0') : '') + ' ' + ap; };
const winOff = i => { if (!i || !i.avail_from || !i.avail_to) return false; const f = String(i.avail_from).slice(0, 5), u = String(i.avail_to).slice(0, 5); if (f === u) return false; const nw = new Date(new Date().toLocaleString('en-US', { timeZone:'Asia/Karachi' })); const m = nw.getHours() * 60 + nw.getMinutes(); const fm = +f.slice(0, 2) * 60 + +f.slice(3), um = +u.slice(0, 2) * 60 + +u.slice(3); return fm <= um ? (m < fm || m >= um) : (m < fm && m >= um); };
const winBadge = i => i && i.avail_from && i.avail_to ? `<span class="leftb">⏰ ${t('win_only')} ${fmtWinT(i.avail_from)}–${fmtWinT(i.avail_to)}</span>` : '';
const leftBadge = it => { const n = stockOf(it); return n != null && n > 0 && n <= 5 && it.is_available !== false ? `<span class="leftb">${t('only_left', { n })}</span>` : ''; };
function stockOk(it, add){
  const n = stockOf(it); if (n == null) return true;
  const have = state.cart.rid === it.restaurant_id ? state.cart.items.filter(c => c.id === it.id).reduce((a, c) => a + c.qty, 0) : 0;
  if (have + add > n){ toast(t('stock_max', { n }), true); return false; }
  return true;
}

const PK_ITEM_LABELS = {'📄 Kagzaat':['📄 Documents','📄 دستاویزات'], '👕 Kapray':['👕 Clothes','👕 کپڑے'], '🍱 Khana':['🍱 Food','🍱 کھانا'], '💊 Dawaai':['💊 Medicine','💊 دوائی'], '📱 Mobile':['📱 Mobile','📱 موبائل'], '📦 Doosra':['📦 Other','📦 دیگر']};
const pkItemLabel = x => { const l = PK_ITEM_LABELS[x]; return l ? l[state.lang === 'ur' ? 1 : 0] : x; };
function pkZones(){
  const zs = (state.allZones || []).slice();
  zs.sort((a, b) => (a.name === 'Maini Town' ? -1 : b.name === 'Maini Town' ? 1 : a.name.localeCompare(b.name)));
  return zs;
}
function pkZone(id){ return pkZones().find(z => z.id === id) || null; }
function pkInitForm(){
  const zs = pkZones();
  const town = zs.find(z => z.name === 'Maini Town') || zs[0];
  PK = { from: town ? town.id : '', to: '', item: '📦 Doosra', band: 1, urgent: false,
         second: false, to2: '', item2: '📦 Doosra', band2: 1, q1: null, q2: null, busy: false, tok: 0 };

}
function pkStatusPill(s){

}

function pkStepSummary(n){
  const v = id => ((document.getElementById(id) || {}).value || '').trim();
  if (n === 1){ const z = pkZone(PK.from); return [z ? z.name : '', v('pkPickD'), v('pkMyPhone')].filter(Boolean).join(' · '); }
  if (n === 2){ const z = pkZone(PK.to); return [z ? z.name : '', v('pkRecv'), v('pkPhone')].filter(Boolean).join(' · '); }
  if (n === 3){ return [pkItemLabel(PK.item), t('pk_band' + PK.band), PK.urgent ? '⚡ ' + t('pk_urgent') : '🐢 ' + t('pk_normal')].join(' · ') + (PK.second ? ' · +2' : ''); }
  return '';
}
function pkRenderSteps(){
  for (let n = 1; n <= 4; n++){
    const body = $('pkBody' + n), sum = $('pkSum' + n), ed = $('pkEdit' + n), card = $('pkStep' + n);
    if (!body) continue;
    const done = n < pkStep;
    body.style.display = n === pkStep ? 'block' : 'none';
    if (sum){ sum.style.display = done ? 'block' : 'none'; if (done) sum.textContent = pkStepSummary(n); }
    if (ed) ed.style.display = done ? 'inline-block' : 'none';
    if (card) card.style.opacity = n > pkStep ? '.55' : '';
  }
}
function pkNextStep(){
  const v = id => ((document.getElementById(id) || {}).value || '');
  if (pkStep === 1){
    if (!pkZone(PK.from)) { toast(t('pk_choose')); return; }
    if (!v('pkMyPhone').trim()) { toast(t('pk_need_phone')); return; }
  } else if (pkStep === 2){
    if (!pkZone(PK.to)) { toast(t('pk_choose')); return; }
    if (!v('pkRecv').trim() || !v('pkPhone').trim()) { toast(t('pk_need_recv')); return; }
  } else if (pkStep === 3){
    if (PK.second && (!pkZone(PK.to2) || !v('pkRecv2').trim() || !v('pkPhone2').trim())) { toast(t('pk_need_recv')); return; }
  }
  if (pkStep < 4) pkStep++;
  pkRenderSteps();
}
function pkZoneOptions(sel){
  return pkZones().map(z => `<option value="${z.id}" ${z.id === sel ? 'selected' : ''}>${esc(z.name)}</option>`).join('');
}
async function pkQuote(){
  if (!PK) return;
  const tok = ++PK.tok;
  const box = $('pkPrice'), btn = $('pkBookBtn');
  const from = PK.from, to = PK.to;
  if (!from || !to) { PK.q1 = null; if (box) box.innerHTML = `<span class="muted">${t('pk_choose')}</span>`; if (btn) btn.disabled = true; return; }
  if (box) box.innerHTML = `<span class="muted">…</span>`;
  try {
    const r1 = await sb.rpc('quote_parcel', { p_from_zone: from, p_to_zone: to, p_weight_band: PK.band, p_urgent: PK.urgent, p_second: false });
    if (tok !== PK.tok) return;
    PK.q1 = r1.data && r1.data[0] ? r1.data[0] : null;
    PK.q2 = null;
    if (PK.second && PK.to2) {
      const r2 = await sb.rpc('quote_parcel', { p_from_zone: from, p_to_zone: PK.to2, p_weight_band: PK.band2, p_urgent: PK.urgent, p_second: true });
      if (tok !== PK.tok) return;
      PK.q2 = r2.data && r2.data[0] ? r2.data[0] : null;
    }
    if (!PK.q1 || !PK.q1.ok) { if (box) box.innerHTML = `<span style="color:var(--danger)">${esc((PK.q1 && PK.q1.message) || t('error'))}</span>`; if (btn) btn.disabled = true; return; }
    if (PK.second && (!PK.q2 || !PK.q2.ok)) { if (box) box.innerHTML = `<span style="color:var(--danger)">${esc((PK.q2 && PK.q2.message) || t('pk_choose2'))}</span>`; if (btn) btn.disabled = true; return; }
    const total = num(PK.q1.total_fee) + (PK.q2 ? num(PK.q2.total_fee) : 0);
    if (box) box.innerHTML = `<div><b>${money(total)}</b><div class="muted" style="font-size:13px">${t('pk_cash_note')}</div></div><div style="font-size:26px">🛵</div>`;
    if (btn) { btn.disabled = false; btn.textContent = `${t('pk_book')} — ${money(total)}`; }
  } catch (e) { if (box) box.innerHTML = `<span style="color:var(--danger)">${t('error')}</span>`; }
}

let pollTimer = null;
function stopPoll(){ if (pollTimer){ clearInterval(pollTimer); pollTimer = null; } }
const LOGIN_ROUTES = ['checkout', 'orders', 'order', 'account', 'offers', 'plus', 'parcel', 'shopping-list', 'meal-plan', 'help', 'groups', 'vouchers', 'security', 'price-alerts', 'donations'];
let routeRunning = false, routeQueued = false;
async function route(soft){
  if (routeRunning){ routeQueued = true; return; }
  routeRunning = true;
  try { await routeImpl(soft); } finally { scheduleProductGridUpdate(); routeRunning = false; if (routeQueued){ routeQueued = false; route(); } }
}
async function routeImpl(soft){
  stopPoll();
  const h = location.hash.replace(/^#\/?/, '');
  const p = h.split('/');
  const name = p[0] || 'home';
  if (!state.user && LOGIN_ROUTES.includes(name)){ state.pending = location.hash; return showAuth(); }
  if (!$('view')) renderShell();
  currentRoute = name; highlightNav(name); updateCartUI();
  const v = $('view'); if (!v) return;
  if (!soft) v.innerHTML = skeleton(name);
  try {
    if (name === 'home') await showHome();
    else if (name === 'search') await showSearchResults();
    else if (name === 'shops') await showShops();
    else if (name === 'c') await showCategory(decodeURIComponent(p[1] || ''));
    else if (name === 'r') await showRestaurant(p[1]);
    else if (name === 'p') await showProduct(p[1]);
    else if (name === 'cart') await showCart();
    else if (name === 'checkout') await showCheckout();
    else if (name === 'orders') await showOrders();
    else if (name === 'groups') await groupShow(p[1] ? decodeURIComponent(p[1]) : null);
    else if (name === 'vouchers') await voucherShow();
    else if (name === 'price-alerts') await pdaShow();
    else if (name === 'donations') await donShow();
    else if (name === 'families') await familyShow(p[1] ? decodeURIComponent(p[1]) : null);
    else if (name === 'security') await secShow();
    else if (name === 'order') await showOrder(p[1]);
    else if (name === 'parcel') await showParcel();
    else if (name === 'account') await showAccount();
    else if (name === 'saved') await showSaved();
    else if (name === 'shopping-list') await showShoppingList();
    else if (name === 'meal-plan') await showMealPlan();
    else if (name === 'help') { if (p[1] === 'ticket') await showSupportTicket(p[2]); else await showHelpCenter(p[1] || null); }
    else if (name === 'offers') await showOffers();
    else if (name === 'plus') await showPlus();
    else return nav('/');
  } catch (e) {
    logErr(e);
    if (!soft) v.innerHTML = `<div class="empty">${esc(niceErr(e))}<br><br><button class="btn inline" onclick="route()">${t('retry')}</button></div>`;
  }
  if (!soft) window.scrollTo(0, 0);
}

// Shop timings (Pakistan time). Same rule as the server: no time or same time = open all day.
function pkNow(){ try { return new Intl.DateTimeFormat('en-GB', { timeZone:'Asia/Karachi', hour:'2-digit', minute:'2-digit', hour12:false }).format(new Date()).replace(/^24/, '00'); } catch (e) { return new Date().toTimeString().slice(0, 5); } }
function withinHours(r){ return openAt(r, new Date()); }
function fmtTime(hm){
  if (!hm) return ''; const [h, m] = hm.slice(0, 5).split(':').map(Number);
  return ((h % 12) || 12) + ':' + String(m).padStart(2, '0') + ' ' + (h < 12 ? 'AM' : 'PM');
}
function closedText(r){
  if (r && r.busy && r.manual_open !== false) return t('busy_msg', { t:new Date(r.busy_until).toLocaleTimeString('en-US', { hour:'numeric', minute:'2-digit', timeZone:'Asia/Karachi' }) });
  if (r && r.manual_open !== false && !withinHours(r)){ const n = nextOpen(r); if (n) return t('closed_msg') + ' ' + t('opens_at').replace('{t}', schedLabel(n)); }
  return t('closed_msg');
}

async function loadRegionsC(){
  try {
    const { data } = await sb.from('regions').select('id,name,center_lat,center_lng,radius_km').eq('is_active', true).order('created_at');
    state.regions = data || [];
  } catch (e) { state.regions = []; }
  const saved = ls.get('kh_region', null);
  if (saved && state.regions.some(r => r.id === saved)) state.region = saved;
  else if (state.regions.length === 1) state.region = state.regions[0].id;
  else {
    const a = (state.addresses || []).find(x => x.id === state.selAddr) || (state.addresses || [])[0];
    state.region = (a && nearestRegion(a.lat, a.lng)) || (state.regions[0] || {}).id || null;
    // Do not request location during startup; users can choose a region or explicitly use location in address entry.
  }
  await loadRegionSettings();
  refreshCityBtn();
}
function nearestRegion(lat, lng){
  if (lat == null || lng == null) return null;
  let best = null, bd = Infinity;
  state.regions.forEach(r => { if (r.center_lat == null) return; const d = kmBetween(lat, lng, r.center_lat, r.center_lng); if (d < bd && d <= num(r.radius_km || 30) * 1.5){ bd = d; best = r.id; } });
  return best;
}
async function loadRegionSettings(){
  state.rset = {};
  state.gateway = null;
  if (!state.region) return;
  const safe = async fn => { try { return await fn(); } catch (e) { return { data:null, error:e }; } };
  const [settingsRes, gatewayRes, badgesRes] = await Promise.all([
    safe(() => sb.from('region_settings').select('key,value').eq('region_id', state.region)),
    safe(() => sb.rpc('gateway_public_status', { p_region:state.region })),
    safe(() => sb.rpc('shop_badges', { p_region:state.region }))
  ]);
  if (!settingsRes.error) (settingsRes.data || []).forEach(x => { state.rset[x.key] = x.value; });
  state.gateway = gatewayRes.error ? null : gatewayRes.data || null;
  state.badges = new Set((badgesRes.error ? [] : badgesRes.data || []).map(x => typeof x === 'string' ? x : Object.values(x)[0]));
}
const regionName = () => ((state.regions || []).find(r => r.id === state.region) || {}).name || '';
const cityBtn = () => (state.regions || []).length > 1 ? `<button class="citybtn" onclick="A.pickRegion()" aria-label="Change city">${esc(regionName())}<span aria-hidden="true">▾</span></button>` : '';

async function loadRestaurantsFresh(){
  if (!state.regions) await loadRegionsC();
  let q = sb.from('restaurants')
    .select('id,zone_id,name,description,logo_url,address,phone,lat,lng,open_time,close_time,hours,categories,shop_kind,busy_until,offer,sponsored_until,allow_pickup,booking_on,chairs,grace_min,is_open,is_active,prep_time_minutes,dinein_on,dinein_pay,zone:zones(id,name,delivery_fee,min_order,base_km,per_km_fee,max_km,bulk_items,bulk_fee,bulk_max,weight_tiers,center_lat,center_lng,radius_km)')
    .eq('is_active', true).order('name');
  if (state.region) q = q.eq('region_id', state.region);
  const list = need(await q);
  const today = PKD.format(new Date()), untilDate = PKD.format(new Date(Date.now() + 8 * 864e5));
  const ids = list.map(r => r.id);
  const [specialByShop, topShops] = await Promise.all([
    (async () => {
      if (!ids.length) return new Map();
      try {
        const { data, error } = await sb.from('restaurant_special_hours').select('restaurant_id,exception_date,is_closed,open_time,close_time,note').in('restaurant_id', ids).gte('exception_date', today).lte('exception_date', untilDate).limit(500);
        if (error) throw error;
        const byShop = new Map(); (data || []).forEach(x => { if (!byShop.has(x.restaurant_id)) byShop.set(x.restaurant_id, []); byShop.get(x.restaurant_id).push(x); });
        return byShop;
      } catch (e) { console.warn('Special shop hours unavailable', e); return new Map(); }
    })(),

function recoScore(p){

function recoSections(PR){

  // 4. Recently viewed

  if (recent.length) html += `<h2>${t('reco_recent')}</h2><div class="muted" style="font-size:12.5px;margin:-6px 0 8px">${t('reco_recent_sub')}</div><div class="hscroll">${recent.map(p => productCard(p)).join('')}</div>`;
  return html;
}

// ================= PRICE-DROP ALERTS — My alerts list =================
// Live backend (migration 20261027060139, already live):
// price_drop_alerts(user_id, item_id, created_at) + RPCs
// price_drop_alert_toggle / my_price_drop_alerts + trigger
// zz_price_drop_alerts -> price_drop_alert_notify on menu_items UPDATE.
// Counted price = menu_items.price (listed price), the same field the
// server trigger uses. Offers / compare_price / flash do NOT count.
// Target price is NOT supported by the live table (no column) —
// alerts are any-drop only. Baselines are device-local: captured when
// the bell is turned ON (price at that moment). Legacy alerts and
// alerts set on another device have no baseline and fall back to the
// compare-price note only. No push/SMS/WhatsApp is promised: the server
// trigger calls push_notify, but push delivery is a separate broken
// track — the reliable surface is this in-app list + one login toast.
function pdaBaseKey(){ return 'kh_pda_base_' + (state.user ? state.user.id : 'anon'); }
function pdaSeenKey(){ return 'kh_pda_seen_' + (state.user ? state.user.id : 'anon'); }
function pdaBaseGet(){ try { return ls.get(pdaBaseKey(), {}) || {}; } catch (e) { return {}; } }
function pdaBaseSet(id, price){ try { const m = pdaBaseGet(); m[String(id)] = num(price); ls.set(pdaBaseKey(), m); } catch (e) {} }
function pdaBaseDel(id){ try { const m = pdaBaseGet(); delete m[String(id)]; ls.set(pdaBaseKey(), m); } catch (e) {} }
function pdaSeenGet(){ try { return ls.get(pdaSeenKey(), {}) || {}; } catch (e) { return {}; } }
function pdaSeenSet(id, price){ try { const m = pdaSeenGet(); m[String(id)] = num(price); ls.set(pdaSeenKey(), m); } catch (e) {} }
function pdaSeenDel(id){ try { const m = pdaSeenGet(); delete m[String(id)]; ls.set(pdaSeenKey(), m); } catch (e) {} }
function pdaRowState(it, base){
  if (!it || !it.is_available || (it.restaurants && it.restaurants.is_active === false)) return 'unavailable';
  const cur = num(it.price);
  if (base !== undefined && base !== null && num(base) > 0 && cur < num(base)) return 'triggered';
  if (num(it.compare_price) > cur) return 'below_compare';
  return 'watching';
}
async function pdaLoad(){
  if (!state.user) return [];
  const { data: ids } = await sb.rpc('my_price_drop_alerts');
  const list = ids || [];
  state.priceAlerts = new Set(list);
  if (!list.length){ state.pdaRows = []; return []; }
  const { data: items } = await sb.from('menu_items').select('id,name,price,compare_price,is_available,restaurant_id,restaurants!inner(id,name,is_active)').in('id', list);
  const byId = {}; (items || []).forEach(x => { byId[x.id] = x; state.itemsCache[x.id] = x; });
  const base = pdaBaseGet();
  state.pdaRows = list.map(id => ({ id, it: byId[id] || null, base: base[String(id)], st: byId[id] ? pdaRowState(byId[id], base[String(id)]) : 'unavailable' }));
  return state.pdaRows;
}
function pdaTriggeredCount(){ return (state.pdaRows || []).filter(r => r.st === 'triggered').length; }
function pdaBadgeUpdate(){
  const b = $('pdaBadge'); if (!b) return;
  const n = pdaTriggeredCount();
  b.textContent = n ? '⬇ ' + n : ''; b.style.display = n ? '' : 'none';
}
async function pdaShow(){
  const v = $('view'); if (!v) return;
  let rows = [];
  try { rows = await pdaLoad(); } catch (e) { logErr(e); }
  const rowHtml = r => {
    const name = r.it ? esc(r.it.name) : t('pda_unavailable');
    const shop = r.it && r.it.restaurants ? esc(r.it.restaurants.name) : '';
    const cur = r.it ? money(num(r.it.price)) : '—';
    const was = (r.base !== undefined && r.base !== null) ? money(num(r.base)) : '—';
    const pill = r.st === 'triggered' ? `<b style="color:var(--brand)">⬇ ${t('pda_dropped')} ${was} → ${cur}</b>` : r.st === 'unavailable' ? `<span class="muted">${t('pda_unavailable')}</span>` : r.st === 'below_compare' ? `<span>${t('pda_below_compare')}: ${cur}</span>` : `<span class="muted">${t('pda_watching')} · ${cur}</span>`;
    const open = r.it ? `<a class="btn ghost" href="#/p/${r.id}">${t('pda_open')}</a>` : '';
    return `<div class="box" style="margin-bottom:10px"><div style="display:flex;justify-content:space-between;gap:10px"><div><b>${name}</b>${shop ? `<div class="muted" style="font-size:12px">${shop}</div>` : ''}<div style="margin-top:4px">${pill}</div>${(r.base !== undefined && r.base !== null && r.st !== 'triggered') ? `<div class="muted" style="font-size:12px">${t('pda_set_at')}: ${was}</div>` : ''}</div><div style="text-align:end;flex-shrink:0">${open}<button class="btn ghost" style="margin-top:6px" onclick="pdaDelete('${r.id}')">${t('pda_delete')}</button>${r.st === 'triggered' ? `<button class="btn ghost" style="margin-top:6px" onclick="pdaDismiss('${r.id}')">${t('pda_dismiss')}</button>` : ''}</div></div></div>`;

async function pdaDelete(id){

function pdaDismiss(id){

const CLOTH_KEYS = ['cloth', 'kapr', 'fashion', 'wear', 'garment', 'shalwar', 'kameez', 'kurta', 'shirt', 'suits', 'dress', 'jeans', 'trousers', 'pants', 'abaya', 'hijab', 'لباس', 'کپڑ', 'شلوار', 'قمیض', 'کرتا'];
function railPics(item){ return [item.photo_url].concat(Array.isArray(item.photos) ? item.photos : []).filter((x, i, a) => x && a.indexOf(x) === i); }
function isClothes(item){ const c = ((item.category && item.category.name) || '').toLowerCase(); return CLOTH_KEYS.some(k => c.includes(k)); }
function railFor(item){ if (!item || railPics(item).length < 2) return false; return isClothes(item) || galOptsFor(item).length >= 2; }
const isColorGroup = g => /rang|color|colour|design/i.test(g.name || '');
function colourSizeSet(groups, sel){
  const cg = (groups || []).find(g => isColorGroup(g)); if (!cg) return null;
  const oid = sel && sel[cg.id] && sel[cg.id][0]; if (!oid) return null;
  const o = (cg.menu_options || []).find(x => x.id === oid);
  if (!o || !Array.isArray(o.sizes) || !o.sizes.length) return null;
  return new Set(o.sizes.map(x => String(x).trim().toLowerCase()));
}
function optVisible(g, groups, s){
  if (isColorGroup(g)) return g.menu_options;
  const cs = colourSizeSet(groups, s.sel);
  if (!cs) return g.menu_options;
  return g.menu_options.filter(o => cs.has(String(o.name).trim().toLowerCase()));
}
function pruneOptSel(){
  const s = state.optSel; if (!s) return; const groups = state.optCache[s.id] || [];
  const cs = colourSizeSet(groups, s.sel); if (!cs) return;
  groups.forEach(g => { if (isColorGroup(g)) return; s.sel[g.id] = (s.sel[g.id] || []).filter(oid => { const o = g.menu_options.find(x => x.id === oid); return o && cs.has(String(o.name).trim().toLowerCase()); }); });
}
const COLOR_DOTS = [['navy','#1D3557'],['maroon','#7B1E26'],['red','#D42B1E'],['laal','#D42B1E'],['لال','#D42B1E'],['blue','#2456C8'],['neel','#2456C8'],['نیلا','#2456C8'],['green','#1E9E50'],['har','#1E9E50'],['sabz','#1E9E50'],['سبز','#1E9E50'],['black','#232323'],['kal','#232323'],['کالا','#232323'],['yellow','#F2B705'],['peel','#F2B705'],['پیلا','#F2B705'],['white','#FFFFFF'],['safed','#FFFFFF'],['سفید','#FFFFFF'],['orange','#F97316'],['narangi','#F97316'],['pink','#EC4899'],['gulabi','#EC4899'],['گلابی','#EC4899'],['purple','#7C3AED'],['baingani','#7C3AED'],['brown','#8B5A2B'],['bhoora','#8B5A2B'],['grey','#8A8F98'],['gray','#8A8F98'],['surmai','#8A8F98']];
function colorCss(name){ const n = String(name || '').toLowerCase(); for (const [k, v] of COLOR_DOTS) if (n.includes(k)) return v; return '#C9CDD4'; }
function galBacks(item){ if (!item || !Array.isArray(item.back_photos)) return []; return item.back_photos; }

let geoSeq = 0, geoTimer = null, lastAuto = '';
async function reverseGeo(lat, lng){
  const lang = state.lang === 'ur' ? 'ur,en' : 'en';
  try {
    const r = await fetch(`https://nominatim.openstreetmap.org/reverse?format=jsonv2&zoom=18&addressdetails=1&accept-language=${lang}&lat=${lat}&lon=${lng}`, { headers:{ Accept:'application/json' } });
    if (r.ok){
      const j = await r.json(); const a = j.address || {};
      const street = [a.house_number, a.road || a.pedestrian || a.footway].filter(Boolean).join(' ');
      const parts = [a.amenity || a.shop || a.building, street, a.neighbourhood || a.suburb || a.quarter || a.hamlet, a.village || a.town || a.city || a.municipality, a.county || a.state_district];
      const out = []; parts.forEach(x => { x = (x || '').trim(); if (x && !out.some(y => y.toLowerCase() === x.toLowerCase())) out.push(x); });
      if (out.length) return out.join(', ');
      if (j.display_name) return j.display_name.split(',').slice(0, 4).join(',').trim();
    }
  } catch (e) {}
  try {
    const r = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lng}&localityLanguage=en`);
    if (r.ok){ const j = await r.json(); const out = [j.locality, j.city, j.principalSubdivision].filter((x, i, a) => x && a.indexOf(x) === i); if (out.length) return out.join(', '); }
  } catch (e) {}
  return '';
}

}

// Additive only. A dine-in deal discount is NEVER part of the server order
// total: place_multi_order_v2 rebuilds p_extra (dropping unknown fields) and
// place_order computes total from subtotal/fee/promo/shop-offer only, so no
// client channel can put a deal into orders.total. A deal therefore applies
// ONLY to dine-in orders paid CASH at the restaurant, where the shop collects
// the discounted amount in person. The application row records deal +
// discount; order details show the server total, the deal line, and the live
// amount to pay (max(0, total - discount)) so customer and shop always agree.

// Provider-gated upsell, delivery orders only. The option is NEVER shown
// unless the admin enabled insurance AND configured a premium rate: no
// rate means no UI, never a 0-premium fake insurance. Server order totals
// never include the premium (place_order builds totals server-side, same
// as Feature 7 deals): the order detail shows server total + premium +
// amount to pay, and the premium rides on the amount the customer pays.
// Recording uses the SECURITY DEFINER RPC set_order_insurance (prepared
// SQL), which re-validates ownership, delivery type, non-final status and
// the exact premium against the admin rate — the client can never invent
// a premium. Claims are review requests only: no payout, provider or
// timeline is ever promised. Parcel opt-in is a documented follow-up
// (parcels use a separate table + RPC, not this checkout).
function insIsBackendError(e){ const m = String((e && e.message) || e || ''); return /42P01|PGRST204|PGRST205|does not exist/i.test(m); }

function insCheckoutFor(sub, otype, set){
  const ot = otype || 'delivery';
  if (ot !== 'delivery') return { show:false, pct:0, premium:0, terms:'', reason:'not_delivery' };
  const s = set || { on:false, pct:0, terms:'' };

  if (!(num(s.pct) > 0)) return { show:false, pct:0, premium:0, terms:'', reason:'no_rate' };

  if (premium <= 0) return { show:false, pct:num(s.pct), premium:0, terms:'', reason:'zero' };

function insSplitPremium(premium, totals){
  const sum = (totals || []).reduce((a, b) => a + num(b), 0);
  const out = []; let assigned = 0;
  (totals || []).forEach((t, idx) => {
    let sh;
    if (idx === totals.length - 1) sh = premium - assigned;
    else sh = sum > 0 ? Math.round(premium * num(t) / sum) : 0;
    sh = Math.max(0, sh); out.push(sh); assigned += sh;
  });
  return out;
}

async function voucherConsume(amount){
  let left = num(amount);
  const entries = (state.voucherEntries || []).filter(e => voucherRemaining(e) > 0 && !voucherIsExpired(e.expires_at, Date.now()));
  entries.sort((a, b) => new Date(a.expires_at || '9999-12-31').getTime() - new Date(b.expires_at || '9999-12-31').getTime());
  for (const e of entries){
    if (left <= 0) break;
    const use = Math.min(voucherRemaining(e), left);
    const upd = await sb.from('voucher_wallet_entries').update({ used_amount:num(e.used_amount) + use }).eq('id', e.id).eq('user_id', state.user.id);
    if (upd.error) throw upd.error;
    left -= use;
  }
  state.voucherEntries = undefined; state.useVoucher = false; state.voucherUse = 0;
}
async function voucherBanner(){
  const el = $('vchBanner'); if (!el || !state.user) return;
  try {
    const entries = state.voucherEntries || await (async () => { await voucherLoadEntries(); return state.voucherEntries || []; })();
    const soon = (entries || []).filter(e => voucherIsExpiringSoon(e.expires_at, Date.now()) && voucherRemaining(e) > 0);
    if (soon.length) el.innerHTML = `<a href="#/vouchers" class="closed-note" style="display:block;text-decoration:none;margin-bottom:12px">⏰ ${t('vch_expiring')}: ${soon.map(e => esc((e.gift_vouchers && e.gift_vouchers.code) || '')).join(', ')}</a>`;
  } catch (e) {}
}


// ================= GROUP ORDERS (Feature 1: group order + payment split) =================
// Additive flow only. Normal checkout (place_multi_order_v2) is untouched.
// If the group tables are not live yet, every group action shows the
// backend-pending message instead of pretending the group was saved.
function groupCodeGen(){
  const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let out = '';
  for (let i = 0; i < 6; i++) out += chars[Math.floor(Math.random() * chars.length)];
  return out;
}
function groupFeeSplit(fee, n){
  const total = Math.round(num(fee) || 0);
  if (!n || n < 1) return [];
  const base = Math.floor(total / n);
  const rem = total - base * n;
  const out = [];
  for (let i = 0; i < n; i++) out.push(base + (i === 0 ? rem : 0));
  return out;
}
function groupMemberTotals(items, feeShares, memberIds){
  const out = {};
  memberIds.forEach((id, i) => { out[id] = { items:0, fee:num(feeShares[i] || 0), total:0 }; });
  (items || []).forEach(it => { if (out[it.member_id]) out[it.member_id].items += num(it.price) * num(it.quantity); });
  memberIds.forEach(id => { out[id].total = out[id].items + out[id].fee; });
  return out;
}
function groupPayBadge(paid, cod, checking, total){
  if (num(paid) >= num(total) && num(total) > 0) return 'paid';
  if (num(paid) > 0 && num(cod) > 0 && num(paid) + num(cod) >= num(total)) return 'walletcod';
  if (num(cod) >= num(total) && num(total) > 0) return 'cod';
  if (num(checking) > 0) return 'checking';
  return 'pending';
}
function groupPayBadgeLabel(badge){
  if (badge === 'paid') return t('grp_paid');
  if (badge === 'cod') return t('grp_cod_badge');
  if (badge === 'walletcod') return t('grp_wallet_cod');
  if (badge === 'checking') return t('grp_checking');
  return t('grp_pending');
}
function groupIsBackendError(e){
  const m = String((e && (e.message || e.error_description)) || e || '').toLowerCase();
  return /42p01|pgrst205|does not exist|relation .* does not exist|schema cache|table .* not found/i.test(m) || (e && (e.code === '42P01' || e.code === 'PGRST205'));
}
function groupBackendPending(){ toast(t('grp_backend_pending'), true); }
async function groupLoad(code){
  const gRes = await sb.from('group_orders').select('*').eq('code', String(code).toUpperCase()).single();
  if (gRes.error) throw gRes.error;
  const g = gRes.data;
  const [mRes, iRes, pRes] = await Promise.all([
    sb.from('group_order_members').select('*').eq('group_id', g.id).order('joined_at'),
    sb.from('group_order_items').select('*').eq('group_id', g.id).order('created_at'),
    sb.from('group_order_payments').select('*').eq('group_id', g.id).order('created_at')
  ]);
  if (mRes.error) throw mRes.error;
  if (iRes.error) throw iRes.error;
  if (pRes.error) throw pRes.error;
  const members = mRes.data || [], items = iRes.data || [], payments = pRes.data || [];
  let profMap = {};
  const ids = [...new Set(members.map(m => m.user_id))];
  if (ids.length){
    const pr = await sb.from('profiles').select('id,full_name').in('id', ids);
    if (!pr.error) (pr.data || []).forEach(p => { profMap[p.id] = p.full_name; });
  }
  let shop = (state.restaurants || []).find(r => r.id === g.shop_id) || null;
  if (!shop){
    const sr = await sb.from('restaurants').select('id,name,zone,zone_id').eq('id', g.shop_id).single();
    if (!sr.error) shop = sr.data;
  }
  return { g, members, items, payments, profMap, shop };
}
function groupPayers(items){
  const ids = [];
  (items || []).forEach(it => { if (it.member_id && !ids.includes(it.member_id)) ids.push(it.member_id); });
  return ids;
}
function groupMemberPaySums(payments, memberId){
  let paid = 0, cod = 0, checking = 0;
  (payments || []).filter(p => p.member_id === memberId).forEach(p => {
    if (p.status === 'paid') paid += num(p.amount);
    else if (p.status === 'cod') cod += num(p.amount);
    else if (p.status === 'checking') checking += num(p.amount);
  });
  return { paid, cod, checking };
}
